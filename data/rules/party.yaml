# THE PARTY - adventurers the guild will send with you against a fortified camp.
#
# A hire is paid once, stays until you part ways (or they die or quit), joins every fight, and grows with you at half your pace, up
# to the top of their guild rank; a promotion lifts the ceiling. They carry their wounds between fights and mend with time. They
# roll a manner, a want and a line they will not cross, and trust you more or less as you treat them. Rules for how they act in a camp:
#   - Moving as a group is loud: each member who is not a scout costs the party's sneak and ambush checks (members told to hold
#     back cost nothing, and come running when the alarm goes up).
#   - A group of armed people helps a threat and hurts a bluff.

max_party: 3
roster_size: 5
roster_days: 7                # the guild's list of free adventurers changes every this many days
level_share: [0.42, 0.58]     # a hireling's level, of the player's
veteran_chance: 0.2           # each free adventurer may be a veteran, much closer to your level
veteran_share: [0.70, 0.90]   # a veteran's level, of the player's
hire_base: 500                # what an F-rank fighter costs to hire, in copper (5 silver); every rank above costs rank_step times the one below
rank_step: 4
level_pace: 0.5               # a hire gains this many levels for each level you gain, until the top of their rank band
heal_minutes: 480             # a hurt hire is fully mended after this long
death_when_down: 0.5          # a hire who goes down in a fight dies this often; otherwise they are carried out alive and hurt
hold_arrival_round: 3         # a party told to hold back reaches the fight on this round

stealth:
  sneak_each: -8              # per member who is not a scout
  bluff_each: -4
  scare_each: 6
  scout_each: 5               # scouts help you read the camp (cap below)
  scout_cap: 10

roles:
  fighter: {profile: guardian, attacks: [sword], fee: 1.0, blurb: ["a scarred sellsword", "a shield-bearer from the border wars", "a grim veteran of three sieges", "a broad-shouldered mercenary"]}
  archer:  {profile: scout,    attacks: [bow],   fee: 1.0, blurb: ["a keen-eyed bowman", "a hunter turned hireling", "a quiet markswoman", "a ranger with a longbow"]}
  priest:  {profile: support,  attacks: [mace],  fee: 1.2, heals: true, blurb: ["a field priest with steady hands", "a wandering healer of the old faith", "a cleric who has seen too much", "a brisk temple medic"]}
  rogue:   {profile: striker,  attacks: [dagger], fee: 1.0, scout: true, blurb: ["a lean cutpurse gone straight", "a quiet blade who likes the dark", "a former spy with light feet", "a nimble sneak-thief"]}
  mage:    {profile: support,  attacks: [bolt],  fee: 1.3, blurb: ["a hedge-mage with scorched sleeves", "a battle-wizard in a patched robe", "a young arcanist with something to prove", "a sullen spellcaster"]}

profiles:
  striker:  {strength: 14, dexterity: 15, constitution: 11, intelligence: 6, wisdom: 10, charisma: 6}
  guardian: {strength: 15, dexterity: 9, constitution: 16, intelligence: 6, wisdom: 10, charisma: 6}
  scout:    {strength: 8, dexterity: 16, constitution: 10, intelligence: 8, wisdom: 14, charisma: 6}
  support:  {strength: 8, dexterity: 12, constitution: 11, intelligence: 10, wisdom: 15, charisma: 10}

# Bond: how much a hire has come to trust you. It starts from their temperament, rises as you fight side by side, and falls when you
# leave them hurt. Low bond brings a warning, then they go.
bond:
  start: 15
  tiers: [[-999, cold], [0, hired hand], [30, trusted], [60, devoted]]
  # How each tier is with the player, in every reply. A hire never walks out over trust; one the player has let down goes cold instead,
  # and warms again as trust is earned back.
  regard:
    cold: "they have let you down, and you have stopped expecting better: you do the work you are paid for, answer short, offer nothing of your own, and warm to them again only if they earn it"
    hired hand: "they are the one paying; you owe them your sword and nothing more yet"
    trusted: "you have come to trust them, and would say so if asked"
    devoted: "you would follow them into most things, and they know it"
  win: 1                      # each fight won together
  hard_win: 1                 # extra when the foe was at your level or above
  battered: -2                # a fight that leaves them under battered_below of their health
  battered_below: 0.25
  promote: 5
  warn_at: 0                  # at or below this: a warning
  promote_needs: trusted      # tier a hire must reach before they ask to be promoted
  promote_fights: 6           # and the fights won together since their last rank

# A temperament says how a person decides and reacts. It is never a subject they keep returning to: the scene supplies what is talked about.
temperaments:
  blunt:      {say: "answers plainly and does not soften bad news; finds hints and hedging a waste of breath", start: 0, quip: "Say it straight, then."}
  cheerful:   {say: "takes setbacks lightly and would rather lift a mood than dwell on a problem", start: 8, quip: "Could be worse. Could be raining."}
  wary:       {say: "slow to trust, quick to notice a change in tone, and keeps their own counsel until sure", start: -6, quip: "Keep your voice down."}
  proud:      {say: "expects to be treated as a professional and bristles at being ordered about or pitied", start: -3, quip: "I have been asked worse by worse people."}
  gentle:     {say: "patient with people, and the first to notice when someone is hurt or uncomfortable", start: 6, quip: "Mind yourself out there."}
  mercenary:  {say: "practical about pay and risk, expects agreements kept, and does not pretend otherwise", start: -4, quip: "Does this come out of my fee?"}
  devout:     {say: "quietly faithful; their beliefs shape what they will and will not do, but they rarely preach", start: 3, quip: "The road keeps those who keep faith."}
  dry:        {say: "understates everything and finds the humour in inconvenience", start: 2, quip: "Of course."}

motives:
  coin:       "wants coin enough to stop living by the contract"
  glory:      "wants a name that bards will remember"
  revenge:    "is looking for the one who wronged them and has not found them yet"
  atonement:  "left something undone once and wants to make up for it"
  protect:    "keeps someone safe back home, and works to keep them so"
  wander:     "wants to see the far places on the map before they are too old"
  rank:       "wants to earn the next guild rank and be taken seriously"

lines:
  - "will not strike a foe who has yielded"
  - "will not take from the poor"
  - "will not leave anyone behind in a fight"
  - "will not lie to someone who has been honest with them"
  - "will not fight against a priest's temple"
  - "will not kill what has not first attacked them"

# (f325) How the narrator frames a companion's words with what they do as they speak (scenes/party_actions.companion_show), as it does
# Maren's and the townsfolk's; and how an exchange among the party is opened and closed (scenes/banter_actions.show_exchange).
frame:
  talk: "how they listen and what they do as they speak - often only a look or a pause, sometimes nothing. They handle their gear only when the moment gives them a reason. They do not touch the player or anything of theirs, hand anything over, go anywhere, or do anything that changes the scene; never their words or their meaning"
  fight: "what they are doing in the press of the fight as they say it - a parry, a step, a look thrown over a shoulder. Nothing that changes the fight"
  exchange: "before: how they fall into talking, where they are, what they are doing; after: how the talk ends or trails off. Nothing that changes the scene, and never any of their words"
  exchange_fight: "the press of the fight around the words; nothing after"
