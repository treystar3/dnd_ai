# ENCHANTING
#
# Enchantments come from two places:
#   - every material in materials.yaml with drops_from: spend one raw piece to give an item that material's effects
#   - the general enchantments below, which cost only coin
# Enchanting requires an NPC with the enchanter role where you are (or debug mode).

slots: {crude: 0, common: 1, uncommon: 1, rare: 2, epic: 2, legendary: 3}

# The fee is a share of what a contract pays at the item's level (so it keeps pace with what you earn), x the option's fee_multiplier,
# x (1 + extra_per_used x enchantments already on the item).
fee_share: 0.4
extra_per_used: 0.75
# A material's essence costs by how rare the material is (general enchantments set their own fee_multiplier below).
material_fee: {common: 0.5, uncommon: 1.0, rare: 1.5, legendary: 2.5}

# Chance of success, minus a penalty per enchantment already on the item. Failure loses the reagent; the fee is kept.
success: 95
penalty_per_used: 15

# Names given to material enchantments. Others default to "of the <first creature that drops it>".
names:
  rawhide: of the Hunt
  drake_scale: of the Drake
  drake_bone: of the Drake
  dragon_scale: of the Dragon
  dragonbone: of the Dragon
  spider_silk: of the Spider
  mammoth_ivory: of the Mammoth

# General enchantments. Each is one stat, and an item only accepts it if that piece of gear could roll the stat (the same lists as in
# equipment.yaml roll_lists, or the lane of a ring or amulet), and it is not already enchanted with that stat (an enchantment may add to a rolled stat).
# Companion enchantments are only offered to characters who keep companions.
general:
  - {id: keen, name: Keen, suffix: of Keenness, applies: any, fee_multiplier: 2, effects: [{modifies: accuracy, magnitude: 8}]}
  - {id: sharpness, name: Sharpness, suffix: of Sharpness, applies: weapon, fee_multiplier: 2, effects: [{modifies: damage, magnitude: 8}]}
  - {id: precision, name: Precision, suffix: of Precision, applies: any, fee_multiplier: 3, effects: [{modifies: crit_chance, magnitude: 3}]}
