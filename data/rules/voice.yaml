# HOW THE VOICES SPEAK (f375). No narrator and no person of the world is given a length: no word budget, no sentence count, no room.
# The narrator writes what the moment holds and a person says what they would say. (Until f375 the engine set room in words by the
# weight of the moment and how much the talk called for, and checked replies against it.) config.PROSE_MAX_TOKENS only stops a
# runaway generation.

# When a line of speech gets the narrator's frame at all (scenes/world.py frame_reasons, party_actions.py hire_frame_reasons). Every
# other line is the words and the speaker's own gesture. The frame is told its reason and writes to it.
frame_when:
  first: "the first words between them this visit"
  trust: "their trust in the player has just moved"
  reveal: "they have just told the player something that matters"
  refuse: "they are refusing, or threatening"
  gift: "they are handing something over"
  leave: "they are ending the talk and going"
  decided: "the game has decided how the player's attempt went, and it shows on them"
  fight: "a beat in the press of a fight"
  feeling: "they are {feeling} right now, and it shows"
  back: "they know the player and have not seen them for a while: show them knowing who it is"      # (f382)

# (f349) The worn-word watch (engine/worn.py): the last `keep` passages are kept; a seed word or a suffixed manner word that appears in at
# least `least` of them is worn, and the `top` most worn are handed to the narrator, the frames, the fight and everyone who speaks as
# WORDS YOU HAVE WORN OUT, and checked after (f584). Found, never banned: the list is whatever the writing has actually leaned on lately.
worn:
  keep: 30
  least: 4
  top: 8
  suffixes: [ly, ness, less, ful, ous, ible, able, ive, ish, some]
  seed: [expression, unreadable, mask, weary, steady, gaze, glance, flicker, hint, trace, faint, slight, grim, tight, quiet, soft, sharp,
         heavy, pale, rough, calm, wary, tired, careful, brief, slow, quick, small, dull, flat, bare, rhythmic, rhythm, cadence, measured,
         folk, folks, aye, stranger, friend, trouble, lad, lass, reckon, suppose]
weather_words: [rain, snow, fog, mist, wind, cloud, sun, sky, drizzle, storm, frost, sleet, hail, overcast, breeze, gale, moon, stars, dusk, dawn]

# THE VOICE, SHOWN. A model given rules writes in the rules' vocabulary; given a few passages, it writes like them. These are the register
# of this game, shown to the narrator and to everyone who speaks. They are examples of how, never lines to say: no names, no places, no
# numbers, so nothing in them can be mistaken for a fact of the moment. Rewrite them freely; keep them short and plain.
# (f583) Pools by moment, drawn per call at the end of the request; a starting set (owner, 2026-11-11) until night runs' best replace it.
exemplars:
  draw: 3
  refusal_trust: 30           # trust under this with the one speaking: the refusal pool
  narration:
    general:
      - "The gate stands open and nobody minds it. A dog looks up, decides against you, and goes back to sleep. Smoke from the chimneys leans east."
      - "Night. The fire has gone to coals and somebody's horse is shifting in its sleep. You lie with a hand on the sword and listen to the river, which has nothing to say."
      - "The axe comes down where your head was. You are already moving. Splinters sting your cheek, and then the thing is on you, all weight and stink, and the world narrows to its teeth."
      - "He does not see you off. He has turned back to the nets before you reach the door, and the only farewell is the shuttle going on without you."
    arrival:
      - "The gate stands open and nobody minds it. A dog looks up, decides against you, and goes back to sleep. Smoke from the chimneys leans east."
      - "The road gives out into mud and then into cobbles. A boy with a bucket stops to look at you, decides you are nobody, and goes on to the well."
      - "Washing hangs across the lane between two upper windows. Somewhere behind it a woman is arguing with a goat and losing."
      - "The bridge has been mended with planks of three different colours. On the far side a man is selling eels out of a barrel and not shouting about it."
      - "Bells from the chapel, then from somewhere further off, then nothing. The square fills with people who all seem to know where they are going."
      - "Two guards at the gate are sharing a pie. One of them lifts it an inch by way of greeting and does not stop chewing."
      - "The smell reaches you before the town does: tar, fish, bread, and under it the tannery, which nobody here notices any more."
      - "Hens in the road. A cart backing up with a lot of advice from the people watching. You wait, and so does everyone else."
    night:
      - "Night. The fire has gone to coals and somebody's horse is shifting in its sleep. You lie with a hand on the sword and listen to the river, which has nothing to say."
      - "The inn's last light goes out above you. After that there is only the dog two yards over, who has opinions about the moon."
      - "Rain starts sometime after midnight and finds the one gap in the roof. You move your boots and lie listening to it drip into them anyway."
      - "Owls. A cart that should not be on the road this late. Then the cart is gone and the owls are not."
      - "You wake once, sure someone said your name. The room is empty, the door is barred, and the fire has nothing more to tell you."
      - "Stars, more than you have seen in a month. The cold comes up out of the ground and settles in your hips."
      - "Down in the common room someone is still singing, the same verse over, each time a little further from the tune."
    interior:
      - "Low beams, black with smoke. Every table has a cloth and every cloth has a burn in it."
      - "The shop is one room and most of it is barrels. The owner is behind them somewhere; you can hear him counting."
      - "Herbs hang from the rafters in bunches, labelled in a hand nobody else could read. It smells like a cupboard that has kept a secret for years."
      - "A long table, benches, a fire at the far end doing its best. The cat on the hearth has taken the warmest place and means to keep it."
      - "The counting house is cold on purpose. Ledgers on every shelf, and a clerk who does not look up until you have stood there long enough."
      - "Someone has swept the floor and stopped halfway. The broom is still leaning where they left it."
      - "The forge throws more heat than light. Tongs, hammers, a bucket gone black, and a horseshoe cooling on the anvil as if it is waiting to be asked."
    grief:
      - "He does not see you off. He has turned back to the nets before you reach the door, and the only farewell is the shuttle going on without you."
      - "She folds the shirt twice, puts it on the pile, and then takes it off the pile and holds it."
      - "Nobody has cleared his place at the table. They eat around it."
      - "The old woman thanks you for coming. She says it three times, as if the first two did not take."
      - "His tools are still on the bench in the order he left them. The boy will not let anyone move them."
      - "She talks about the price of salt, and her hands never stop working at the hem of her apron."
      - "There is a fresh mound behind the chapel with a jar of wildflowers on it. The flowers are a day old and somebody has already changed the water."
  fight:
    - "The axe comes down where your head was. You are already moving. Splinters sting your cheek, and then the thing is on you, all weight and stink, and the world narrows to its teeth."
    - "The first one comes in low. You take it on the shield and the shock goes up your arm to the teeth. The second is already behind you."
    - "It misses. The claw takes bark off the tree where your shoulder was and you are inside its reach now, close enough to smell it, and you put the knife in."
    - "She goes down hard and does not get up. The one with the spear sees it and stops. Nobody moves. Then he runs."
    - "You are late on the parry and it costs you. The blade skids off your guard and opens your forearm, and the pain comes a breath later."
    - "It goes for the horse first. The horse has other ideas, and for a moment you have two enemies and one of them is on your side."
    - "The shield takes the blow and then the second, and the third splits it. You throw the pieces in its face and draw."
    - "Mud to the ankles. Every step is a bargain. The thing across from you is better at this ground than you are and it knows it."
    - "Your arrow takes it in the shoulder. It looks at the shaft as if offended, pulls it out, and comes on."
    - "You step in close where the spear is no use to him. He drops it and goes for his knife, and you are both very busy."
  speech:
    small_talk:
      - "Horseshoes. Nails. If you want a sword you want the city, and more coin than you've got."
      - "Keep walking, you. No, I mean it kindly. The gate shuts at dark and I'd sooner you were inside it than out."
      - "If it isn't raining it's about to. Hand me that. No, the other one. Were you wanting something, or did you come in to drip?"
      - "Morning. You're the one with the wand. What can I do for you?"
      - "Thanks. Most don't bother saying it."
      - "Bread's gone up again. Don't ask me why. Ask the miller, he'll tell you it's the rain, it's always the rain."
      - "You're not from the valley. You walk like you expect the road to be there."
      - "Sit if you're sitting. The bench won't hold a man who leans."
      - "My sister's boy wants to go for a soldier. I told him, you'll see the world, and most of it will be the inside of a ditch."
      - "That dog's not mine. He just likes the step."
      - "If you're after the smith, he's at his mother's. If you're after his mother, good luck to you."
    refusal:
      - "You may ask. I may not answer. The dead keep their own counsel here, and so do I."
      - "Later. I've a cart to get under cover before the hay's ruined. Ask me when it's done, or ask her."
      - "No. And don't stand there hoping I'll change it."
      - "I sold to somebody off the road once. Once."
      - "That's not mine to give, and if it were I still wouldn't."
      - "Come back with someone I know, and we'll talk."
      - "I've a family. You haven't asked me anything I can afford to answer."
      - "The door's behind you. It works the same going out."
    gossip:
      - "It took the ewe. Just took her. Didn't eat her, didn't drag her off, left her in the yard like a... like a message. You tell me what does that."
      - "You didn't hear it from me, but the reeve's been buying rope. A lot of rope."
      - "They say the widow up the hill has a man in the house. They say it like it's a bad thing."
      - "Three nights running there's been a light out on the marsh. Nobody's gone to look. Nobody's that stupid twice."
      - "The new priest drinks. Not much. Just enough that you'd notice, if you were me."
      - "The miller's boy and the smith's girl. Everyone knows. Everyone but the smith."
      - "Ask anyone and they'll tell you the bridge toll goes to the town. Ask who counts it, and they'll find something else to look at."

# (f347) A STANCE FOR THE CONVERSATION. Rolled once by the engine when a talk begins (engine/voice_rules.roll_stance) and told plainly
# to the person as RIGHT NOW YOU ARE, with the rule that they answer the part they care about. Most talks have none: the person is
# simply themselves. wary needs trust under 50, grievance a concern, after a motive; tired is twice as likely after dark.
stances:
  none:      {weight: 40, text: ""}
  busy:      {weight: 18, text: "busy: you answer with half your attention and your hands do not stop; you never say that you are busy"}     # (f375) the chore itself is in RIGHT NOW, not quoted here
  wary:      {weight: 12, text: "wary of strangers today: you ask what they want before you give anything, and give little"}
  tired:     {weight: 10, text: "tired: you answer shorter than you would, and take any excuse to end it; you never say that you are tired"}
  grievance: {weight: 12, text: "nursing a grievance that keeps coming up whatever they ask: {concern}"}
  after:     {weight: 8,  text: "after something, and this stranger might be useful for it: {motive}"}

# (f347) A written parting line, used when the model's own fails, by how they are with the player; never one they said lately.
partings:
  warm:  ["Mind how you go.", "Go on, then. Come back when there's something to tell.", "Don't be a stranger."]
  plain: ["Aye.", "Good day to you.", "Right. Mind the road.", "Go well."]
  wary:  ["Hm.", "Go on, then.", "Mind yourself."]

# (f485, owner question 11) A line's frame stood in for: when the narrator's frame was dropped by the turn's budget or failed, the words are
# shown with the speaker's own short gesture; with none, one of these, drawn for the speaker (scenes/world.py show_speech). And a reply
# with no words at all, which is shown as what they do, or, with nothing, one of no_words.
frame_stand_in: ["answers after a moment", "looks up before answering", "gives it a moment's thought", "answers without hurry",
                 "meets your eye to answer"]
no_words: ["{speaker} says nothing.", "{speaker} gives no answer.", "{speaker} lets the silence answer.", "{speaker} only looks back at you."]

# (f485) The conversation under way, as the save keeps it (kv talk, scenes/world.py talk_record): the most lines its record holds.
conversation:
  lines: 60

