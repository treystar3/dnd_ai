# MOMENTS (f348, engine/moments.py): something going on when the player walks in. The engine decides THAT it happens, its SHAPE and
# everything mechanical; the model writes WHAT it is, for this place, this hour and these people, told every moment this playthrough
# has already seen so no two are alike (engine/moment_prompts.py, llm/contracts.py MomentProposal). A written moment under each shape
# is the fallback when the model fails, never the first choice.
#
# A possibility, not a habit: on arriving somewhere the engine rolls once for that place and period of the day (stepping out and back
# in rolls nothing new), at the chance for the kind of place; a place that had one waits cooldown_hours before another, and a town
# waits town_gap_hours after any of its places had one; a shape seen before in this playthrough is drawn less often than one not yet seen.
# A moment lasts its minutes and ends by itself, whatever the player does; the town remembers it in the model's words.
#
# A shape carries:
#   brief        what kind of thing it is, for the model: it makes the particular one
#   where/when   the place types and periods of the day; needs_people: at least so many present; needs: {heat: H} the player's heat
#   lasts        minutes; mood: a mood the people here carry till it ends (engine/drift.py knows it)
#   visitor      {roles: [...], people: any|<people>}: someone from elsewhere is made as a real person for the while, in one of these
#                roles (roles.yaml); the model gives them an epithet, a look and a doing; they can be spoken to, and leave at the end
#   effects      hurt: {chance, pct}: the player may be caught in it on the way in, for pct of their health; the model writes how (mishap)
#   written      the fallback: title, line, doings [{who, doing}], visitor {epithet, look, doing}, mishap, memory

chance: {inn: 0.18, square: 0.15, guild: 0.15, guardpost: 0.15, temple: 0.12, town: 0.1, city: 0.1, village: 0.1, yard: 0.1, smithy: 0.1, shop: 0.08, workshop: 0.08}
cooldown_hours: 36
town_gap_hours: 12
remember: 40                 # how many past moments the model is shown (all of them count for the repeat check)

shapes:
  - id: performer
    where: [inn, square]
    when: [evening, night]
    weight: 3
    lasts: 180
    needs_people: 2
    brief: "someone from the road is performing, and the place has been caught up in it: music, a story, a trick, a song everyone knows - and what the people here are doing about it"
    visitor: {roles: [traveling_player], people: any}
    mood: merry
    written:
      title: the night the player came
      line: "A travelling player has the room: a lute by the fire, the tables pushed back, and half the room dancing or stamping the time."
      doings: [{who: everyone, doing: "dancing, or stamping the time from a bench"}, {who: innkeeper, doing: "pulling ale as fast as the mugs come back"}, {who: server, doing: "dodging through the dancers with a tray"}]
      visitor: {epithet: "a travelling player", look: "A lean, road-worn figure with a lute case on a strap and boots that have seen three regions.", doing: "playing by the fire with the room clapping the time"}
      memory: "the night a travelling player had the room dancing"
  - id: quarrel
    where: [inn, square, yard, guild]
    when: [afternoon, evening, night]
    weight: 2
    lasts: 25
    needs_people: 2
    brief: "a quarrel between people of the place has just turned into a fight - over what, between whom (unnamed), with what going over - and the rest have drawn back"
    effects: [{kind: hurt, chance: 0.35, pct: 4}]
    written:
      title: the brawl
      line: "A brawl: two men at each other across an overturned table, a third hanging on one of them, and the rest of the room backed to the walls."
      doings: [{who: everyone, doing: "keeping out of the fight with a back to the wall"}, {who: innkeeper, doing: "shouting at the brawlers to take it outside"}]
      mishap: "As the player comes in, a thrown stool catches them across the shoulder."
      memory: "the brawl that ended with the watch dragging two men out"
  - id: gathering
    where: [inn, temple, square]
    when: [afternoon, evening, night]
    weight: 2
    lasts: 240
    needs_people: 2
    brief: "a gathering of the place's own people, with drink or food, for a reason of their own - a wake, a wedding, a name-day, a homecoming, a debt paid off, a last night before a journey - and the mood of it"
    written:
      title: the wake
      line: "A wake: the long table laid, the town's people drinking to someone gone, and the stories getting louder as the evening goes."
      doings: [{who: everyone, doing: "drinking to the dead at the long table"}, {who: innkeeper, doing: "filling mugs for the mourners and not taking coin for it"}]
      memory: "a wake held here"
  - id: game
    where: [inn]
    when: [night, deep night]
    weight: 2
    lasts: 120
    needs_people: 2
    brief: "a game of chance has a corner and most of the room's attention - what game, what is at stake, who is losing and how they are taking it"
    written:
      title: the card game
      line: "A card game has the corner table and most of the room's attention: coin stacked, someone losing badly and saying so."
      doings: [{who: everyone, doing: "watching the card game over someone's shoulder"}, {who: innkeeper, doing: "keeping half an eye on the corner table"}]
      memory: "a card game that went on till the small hours"
  - id: crowd
    where: [square, town, city, village]
    when: [morning, midday, afternoon]
    weight: 2
    lasts: 60
    needs_people: 1
    brief: "a crowd has stopped for something worth watching - a sale, a notice read out, a dispute, a show, a strange animal, a wager - and what it is doing"
    written:
      title: the auction
      line: "An auction in the square: a dead man's goods going lot by lot off the tail of a cart, the crier calling the bids."
      doings: [{who: everyone, doing: "bidding, or watching the bidding with arms folded"}]
      memory: "the auction of a dead man's goods in the square"
  - id: commotion
    where: [square, town, city, village, yard]
    when: [morning, midday, afternoon]
    weight: 2
    lasts: 10
    needs_people: 1
    brief: "a sudden small commotion running through the street, over in minutes - a chase, a runaway animal, a dropped load, a shout from a roof - and everyone's part in it"
    written:
      title: the chase
      line: "A chase: a boy with a stolen loaf running the length of the street, the baker's lad after him, and everyone shouting one way or the other."
      doings: [{who: everyone, doing: "shouting after the chase"}]
      memory: "the day a boy stole a loaf and outran the baker's lad"
  - id: observance
    where: [temple]
    when: [dawn, evening]
    weight: 2
    lasts: 40
    needs_people: 1
    brief: "an observance under way that nobody will interrupt - what is being done, for what, by whom, and what it asks of anyone who walks in"
    written:
      title: the rite
      line: "A rite under way: the lamps lit, the people kneeling, the priest's voice carrying, and nobody to be spoken to until it ends."
      doings: [{who: everyone, doing: "kneeling at the rite"}, {who: priest, doing: "leading the rite with the god's sign raised"}]
      memory: "a rite held here"
  - id: homecoming
    where: [guild]
    when: [afternoon, evening]
    weight: 2
    lasts: 90
    needs_people: 1
    brief: "a party of the guild's own just back from a contract, the worse for it, with something to show for it - what they brought, what state they are in, how the hall takes it"
    written:
      title: the party back from the hills
      line: "A party just back from a contract: mud to the thigh, one of them carried in, and a kill laid on the floor for the clerk to see."
      doings: [{who: everyone, doing: "crowding round the party just back"}, {who: guild_clerk, doing: "writing up a kill with a wet pen"}]
      memory: "a party coming back with a kill and one of them carried"
  - id: searching
    where: [guardpost, town, city, village, square]
    when: [morning, midday, afternoon, evening]
    weight: 2
    lasts: 60
    needs_people: 1
    needs: {heat: 30}
    brief: "the watch is stopping people and going through packs, and the street has a queue and a mood - what they are looking for is not said"
    written:
      title: the day the watch searched every pack
      line: "The watch searching packs at the gate, two by two, and a queue of travellers waiting with their hands in sight."
      doings: [{who: everyone, doing: "waiting in the queue with a pack open"}, {who: guard, doing: "turning out a traveller's pack onto a board"}]
      memory: "the day the watch searched every pack at the gate"
  - id: nuisance
    where: [inn, square]
    when: [night, deep night]
    weight: 1
    lasts: 180
    needs_people: 1
    brief: "a small nuisance nobody will be the one to deal with - someone asleep in the way, an animal loose, a cart across the door, a smell - and how everyone is working round it"
    written:
      title: the drunk nobody would move
      line: "A drunk asleep across the doorway, snoring, and nobody willing to be the one to move him."
      doings: [{who: everyone, doing: "stepping over the drunk in the doorway"}]
      memory: "the night nobody would move the drunk from the door"
  - id: rush
    where: [smithy, workshop, shop, yard]
    when: [morning, midday, afternoon]
    weight: 2
    lasts: 60
    needs_people: 1
    brief: "work has gone wrong, or come all at once, and the place is in an uproar over it - what broke or what arrived, who is in the way, who is shouting"
    written:
      title: the broken axle
      line: "A rush at the forge: a cart with a broken axle in the yard, the carter in the way, and the smith shouting for the bellows."
      doings: [{who: everyone, doing: "working the bellows for the smith, or being in the way"}, {who: smith, doing: "hammering an axle-iron with the carter at an elbow"}]
      memory: "the carter whose axle broke outside"
  - id: arrival
    where: [shop, yard, square, inn]
    when: [morning, midday]
    weight: 2
    lasts: 45
    needs_people: 1
    brief: "something has just come in off the road and has the place busy - a delivery, a carrier with a letter, a beast for sale, a stranger's cart - and what everyone is doing with it"
    written:
      title: the delivery
      line: "A delivery just in: crates across the floor, a carter waiting to be paid, and the shopkeeper counting against a list."
      doings: [{who: everyone, doing: "counting crates against a list, or carrying one"}]
      memory: "a delivery that filled the floor"
