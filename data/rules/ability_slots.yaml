# Slot-based ability creation: the engine plans the 15 starting actives (what each one does) and the model only names and
# describes them. Everything a slot's mechanic needs is decided here and in engine/ability_slots.py.
total: 15

# share of a class's abilities that cost mana (the rest stamina), by archetype
mana_share: {warrior: 0.0, rogue: 0.0, mage: 1.0, support: 0.7}
# Channeled abilities: a mana ability delivered through the wielded weapon (see engine/combat.py, act_ability).
# A hybrid class makes about half of its mana attacks channeled (at least one); any other class never makes one (f249: a random
# magic strike the class never asked for).
channel: {hybrid_chance: 0.5, other_chance: 0.0}
hybrid_families: {paladin: 0.4, druid: 0.4, warlock: 0.7, necromancer: 0.8, summoner: 0.7, bard: 0.3}
# A fighter (warrior or rogue) that also draws on a casting family is a mixed class too (f252): this share of mana, channeled strikes.
caster_families: [mage, necromancer, druid, healer, summoner, warlock]
mixed_share: 0.4
# A fighter whose concept names an element carries it in the weapon (f252): Imbue of that element is always one of its buffs, and
# this many of its single-target attacks (a pure fighter's) become channeled strikes of it.
element_channel: [1, 2]

# how the combat-only remainder (after buffs, functions, healing, summons...) is split. No defense stances (f250): the free
# Defend and the defensive buffs cover protection
mix:
  combat:   {damage: 0.66, control: 0.20, defense: 0, mobility: 0.14}
  balanced: {damage: 0.56, control: 0.24, defense: 0, mobility: 0.20}
  social:   {damage: 0.44, control: 0.28, defense: 0, mobility: 0.28}
companion_damage_scale: 0.5
heavy: {combat: 3, balanced: 2, social: 1}
moderate_chance: 0.45
min_damage: 2

# reach of an ordinary attack, by archetype
reach:
  warrior: {melee: 0.65, extended: 0.2, ranged: 0.15}
  rogue:   {melee: 0.5, ranged: 0.35, extended: 0.15}
  mage:    {ranged: 0.55, area: 0.3, extended: 0.15}
  support: {ranged: 0.5, extended: 0.3, melee: 0.1, area: 0.1}

# what each outside-combat function becomes. defaults: effect utility, tier light, reach self, context out_of_combat
function_defaults: {effect: utility, tier: light, reach: self, context: out_of_combat}
functions:
  scout: {reach: extended}
  shelter: {reach: area, tier: moderate}
  pass_without_trace: {reach: area, tier: moderate}
  haste: {effect: utility, context: out_of_combat}     # a journey or stealth function: no part in a fight (f223)
  swift_step: {effect: utility, context: out_of_combat}     # a journey or stealth function: no part in a fight (f223)
  shadow: {effect: utility, context: out_of_combat}     # a journey or stealth function: no part in a fight (f223)
  influence: {effect: influence, reach: extended, context: both}
  intimidate: {effect: influence, reach: extended, context: both}
  read_the_room: {reach: extended}
  showmanship: {reach: area, tier: moderate}
  barter: {reach: extended}
  pickpocket: {reach: extended}
  commune: {tier: moderate}
  trapfinder: {reach: extended}
  beastspeak: {reach: extended}
  size_up: {reach: extended}
  snare: {reach: area}
  picklock: {reach: extended}
  treat: {reach: extended, tier: moderate}
  revivify: {reach: extended, tier: heavy}
  bless: {tier: moderate}
  word_of_recall: {tier: heavy}
  phantom_steed: {tier: moderate}
  bind_beast: {effect: control, reach: ranged, context: both, tier: moderate}
  speak_corpse: {reach: extended}
  summon_labor: {}
  recall: {}
  tinker: {}

# what the model is told each kind of slot is
effects:
  damage_single: one strike or one blast at a single target
  damage_at_range: "made from a distance at a target away from the user: a throw, a shot, or a strike that reaches across the gap - not a lunge, thrust or swing at someone right beside them"
  # what a ranged weapon technique must read as, and must not, judged by meaning (engine/ability_slots.py text_problem, f287)
  reads_far: "an attack made from a distance at a target away from you: throwing a weapon, shooting, hurling, or striking across a gap"
  reads_close: "a close-quarters attack on someone right beside you: a lunge, a thrust, a swing, a slash, a punch or a shove"
  damage_area: a blast or sweep that hits everything in an area
  control: hinders the enemy (pins, slows, blinds, disrupts or rattles it) without being a proper attack
  defense: a guarding stance or ward on yourself that blunts the blows you take this fight
  mobility: a swift movement in a fight - a leap, dash, slip or blink
  healing: restores health to you or an ally, in a fight or out of one
  summon: makes a being out of your magic that fights beside you on its own turns (name and describe it in summons)
  command: gives an order to the companions you already have
  crafting: improves the next thing you make (forging, brewing, cooking, leatherwork)
  influence: sways a person's feelings or choices
  utility: something done outside a fight, out in the world

# how a trait should read in the name and description (shapes, buffs and riders without their own words)
depict:
  chain: the blow arcs on to hit other enemies as well, so it reads as striking more than one foe
  sweeping: a wide arc that also catches the enemies beside the target
  ricochet: the strike glances off its target and bounces on to other enemies
  reliable: a steady, precise, dependable strike - never wild, random or chaotic
  flank: a strike from the side or behind
  opener: the first, unexpected strike against a foe still fresh
  finisher: a strike that ends an enemy already weakened
  desperate: a reckless strike that grows deadlier when you are near death
  combo: one strike that builds on the last, as a rhythm of attacks
  overcharge: pouring extra power and effort into a single blow
  exploiting: a strike that punishes an enemy already afflicted
  packhunt: a strike your companions join in
  imbue: a weapon wreathed in an element - NAME the element in the ability name or description
  precision: a moment of perfect focus that steadies every blow
  blur: a body that becomes hard to see or pin down - a shimmer, a haze, a flicker
  manashield: a barrier of mana that takes the blows for you
  enlarge: growing to a towering size - bigger, stronger, and impossible to miss
  arcaneward: a ward of woven magic around the body that turns spells aside
  attunement: becoming an archon of one element, wreathed in it and wielding it - NAME the element in the ability name or description
  bladeward: a ward that turns the first blade each moment - a caster's guard, not a fighter's
  frostarmor: a shell of ice over the body that chills whoever strikes it - it is cold, and nothing else
  envenom: coating the weapon in venom or poison - it is poison, and nothing else
  acidcoat: coating the weapon in acid that eats through armor - it is acid, and nothing else
  stoneform: the body turning to stone - heavy, slow and unshakable
  thorns: a guard of spikes, barbs or briars that wounds whoever strikes it
