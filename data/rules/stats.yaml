  suits:
    archetypes: []
    themes: [summoner, beast, tamer, necromancer, commander, pack, binder, master]

- id: companion_durability
  category: companion
  effect: scale
  attribute: null
  covers: How much harm the character's companions can take.
  suits:
    archetypes: []
    themes: [summoner, beast, tamer, necromancer, guardian, pack, binder, bond]
