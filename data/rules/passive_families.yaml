# PASSIVE FAMILIES - pools of passive mechanics by kind of class.
#
# The class reading gives every character one to three families. Each playthrough the engine draws a random
# selection from their combined pool, so the same class sees different options each time.
#
# Each option is a mechanic from passive_mechanics.yaml, optionally only active 'when' a trigger is true.
# values: [light, moderate] - conditional options are usually stronger than always-on ones.
# Options with no values use the mechanic's own. Add, remove or move options freely.

