# NEEDS - hunger and fatigue. Each is a meter from 0 (fine) to 100 (as bad as it gets). Neither ever kills; both make you worse at everything.
#
# Hunger builds while time passes and is cleared by eating. Fatigue builds while you are awake and is cleared by sleeping.
# Working, travelling and fighting add to both (exertion).
# Health no longer returns by itself: it comes back from resting or sleeping (rest_heal), from food, and from healing of any kind.

hunger_per_hour: 2.1              # empty after about 48 hours without eating
fatigue_per_hour: 2.5             # at its worst after about 40 hours awake
exertion: {hunger: 1.25, fatigue: 1.5}     # times the rate while travelling, working or fighting
fight: {hunger: 1.0, fatigue: 2.0}         # flat amount a fight adds

sleep_fatigue_per_hour: 12.5      # 8 hours of sleep clears it
sleep_after_minutes: 360          # a wait this long is real sleep (it clears fatigue and the rest of the game's sleep rules apply)
rest_fatigue_per_hour: 2.0        # a shorter rest eases fatigue a little (it still builds nothing)

# Health returned by resting or sleeping, as a share of maximum per hour.
rest_heal_per_hour: {safe: 0.20, rough: 0.10}

# What each stage costs, by the stage's lower bound (highest bound first). Hunger and fatigue are added together.
stages:
  - {from: 90, hunger: Famished,  fatigue: Collapsing, checks: -30, stamina: -50, health: -25, damage: -20, rest_heal: 0.5}
  - {from: 70, hunger: Starving,  fatigue: Exhausted,  checks: -15, stamina: -30, health: -10, damage: -10, rest_heal: 1.0}
  - {from: 40, hunger: Hungry,    fatigue: Tired,      checks: -5,  stamina: -10, health: 0,   damage: 0,   rest_heal: 1.0}
  - {from: 0,  hunger: Fed,       fatigue: Rested,     checks: 0,   stamina: 0,   health: 0,   damage: 0,   rest_heal: 1.0}

# What the body says as a meter crosses into a worse stage (Hungry, Starving, Famished / Tired, Exhausted, Collapsing), and when it is fully eased.
voice:
  hunger:
    worse:
      - "Your stomach growls; it has been a while since you ate."
      - "Hunger gnaws at you now, and your hands are not as steady as they were."
      - "You are famished. Your head swims and every task feels twice as heavy."
    better: "The hunger in your belly finally quiets."
  fatigue:
    worse:
      - "A tiredness settles into your shoulders; you could use a rest."
      - "You are exhausted. Your eyelids droop and your limbs move as if through water."
      - "You can barely stay on your feet. Sleep will take you soon whether you want it or not."
    better: "You feel rested, your head clear."

checks_floor: -60                 # the most checks can drop from needs
max_penalty: {stamina: 60, health: 35, damage: 30}

# At this fatigue you fall asleep where you stand.
collapse_at: 100
collapse_hours: 8
collapse_unslept: 90              # if you cannot sleep where you stand (a dangerous dungeon), you stagger on at this fatigue

# Hot meals, sold at inns. Other food is in data/world/goods.yaml (feeds: hunger cleared).
meal: {feeds: 60, health: 15}
