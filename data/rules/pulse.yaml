# THE PULSE - how the world moves on its own, away from the player.
# The player never sees the pulse directly; they find its results in the world: people, places, the board.

interval_hours: 8               # the world pulses this often
eventful_chance: 0.35           # chance a pulse does anything at all (the rest are quiet)
max_new_events_per_action: 2    # model calls the pulse may make while the player does one thing
                                # (long stretches of time are compressed: timers still run, fewer new events)
max_engine_events_per_action: 8 # (f353) the engine's own situations cost no call, so a long absence may start this many of them

# What an eventful pulse does, by weight.
kinds: {motive: 4, thread: 4}

# (f354) THE ENGINE'S OWN ROLL. The roll above was priced when every situation cost a model call; nineteen in twenty now cost nothing, and
# at that rate there was half a situation at the player's town at any time. Each tick the engine may also start one within reach of the
# player (the here and near bands), and after a quiet day within reach it starts one whether the roll said so or not; never more than
# most_live within reach at once.
engine_roll:
  chance: 0.4
  bands: {here: 55, near: 45}
  quiet_hours: 24
  most_live: 2

# Tiers of new situations (threads). Odds are for an eventful pulse that starts a thread.
# engine: true (f331): the engine builds the situation itself from data/rules/threads.yaml, with no model call; the model may re-tell its
# lines when the player comes where it is. A tier without it is written by the model; with fallback: engine it is the engine's when the
# model fails, and without that it simply does not start this time (a campaign needs what only the model writes).
tiers:
  normal:   {weight: 80, stages: 1, days: [1, 2],  resolved_by_others: 0.5, engine: true}
  uncommon: {weight: 15, stages: 2, days: [3, 6],  resolved_by_others: 0.35, engine: true}
  rare:     {weight: 5,  stages: 3, days: [7, 14], resolved_by_others: 0.2, fallback: engine}   # the model's; the engine's when the model fails
  campaign: {stages: 4, days: [30, 90], resolved_by_others: 0.05}
  cataclysm: {stages: 6, days: [84, 144], resolved_by_others: 0.0}   # built by engine/events.py; nobody else ends one

# Where a new situation goes (f323): a band drawn by these weights, measured from the player's town - the town itself, its neighbours
# within near_minutes' walk, the rest of its region, or anywhere else - then a pressure in that band (pressure_share of the time) or one
# of its towns. The world keeps moving where nobody watches; most of what is written is where the player will meet it.
placement:
  bands: {here: 45, near: 30, region: 15, far: 10}
  near_minutes: 600
  pressure_share: 0.75
anchor_settles: 0.5             # when a situation is settled by others, this often it is one of the town's anchors who did it
deeds_days: 30                  # the writer is told what the stranger has done in the region this far back

# How often a campaign (or, at high level, a cataclysm) starts: see data/rules/events.yaml (campaign.every_days, cataclysm).
pressure_cooldown_days: 4       # a pressure can't start a new situation again this soon

# Which tiers may take a person the player has met out of the story (gone, taken, killed) or change their
# personality. Lower tiers can't. Roles listed under protected_roles are never removed.
may_remove_met: [rare, campaign, cataclysm]
may_change_traits: [uncommon, rare, campaign, cataclysm]
protected_roles: [guild_clerk, guild_master, monarch]

# Motives: some people the player has met have an active goal that moves forward off-screen. Most are content.
motives:
  base_chance: 0.25             # share of people with a motive when first met
  step_days: 3                  # a person's motive moves at most this often
  trait_shift: {ambitious: 0.25, greedy: 0.2, vengeful: 0.3, anxious: 0.15, competitive: 0.15, obsessive: 0.25,
                bitter: 0.15, envious: 0.15, rebellious: 0.15, manipulative: 0.2,
                content: -0.2, easygoing: -0.15, cheerful: -0.1, calm: -0.1, humble: -0.1, patient: -0.05}

# Effects the world can have, and their limits.
effects:
  prices: {min: -30, max: 60}         # percent change to prices in a town
  danger: {min: -50, max: 100}        # percent change to encounter odds in a place
  relation: {min: -25, max: 25}       # change in how one person feels about another
  max_days: 60                        # longest any temporary effect lasts (campaign events can renew them)

# News travels along roads. It reaches a place this many hours after it happened, per hour of walking between.
news:
  hours_per_walking_hour: 1.5
  keep_days: 45                       # how long news stays "news" before it's just history

# Seasons. The campaign starts on the first day of the first season.
seasons:
  days_each: 30
  order: [spring, summer, autumn, winter]

# How the player's deeds change a town's opinion of them (-100 to 100).
reputation:
  contract_done: 4
  request_done: 3
  work_done: 2
  lie_caught: -4
  threat: -2
  caught_spying: -2
  performed: 2
  trust_per_point: 0.25               # people meeting the player for the first time start this much warmer per point

# ---------- drift (f331, engine/drift.py): the world settling and shifting between pulses, with no model call ----------
# A pass runs on its own clock (world_state drift_last), outside the pulse's event budget. What a pass does is measured in game time,
# so a long absence is not a long computation: people are looked at a chunk per pass, round robin, and feelings ease by the days gone.
drift:
  every_hours: 24
  most_passes: 30               # a long absence runs at most this many passes
  people_per_pass: 40           # people looked at per pass, so a big campaign costs the same per pass as a small one
  relations: {settle_after_days: 7, per_day: 1.0}     # a feeling nobody has stirred for a week eases toward neutral this much a day; at nothing it is forgotten
  moods: {days: 6}              # a mood the world gave someone fades after this many days
  motives:
    cooldown_days: 12           # after a motive ends, this long before a new one may take hold
    chance: 0.5                 # ...and then this chance each time they are looked at
    lasts_days: 24              # (f334) a goal the engine gave someone nobody has spoken to runs its course in about this long...
    made_chance: 0.5            # ...and this often they get there; the town remembers either way (engine/matters.py town_note)
    outcomes:
      made: ["{name}, the {role}, set out {motive} - and by the look of things, made it.",
             "{name}, the {role}, got what they were after: {motive}. The town has noticed."]
      failed: ["{name}, the {role}, wanted {motive}; it came to nothing, and they have stopped talking about it.",
               "Whatever {name}, the {role}, meant by trying {motive}, it has not come off."]
      mood_made: ["quietly pleased with how things have gone", "walking a little taller lately"]
      mood_failed: ["sour about something that came to nothing", "short with people since a plan fell through"]
    seeds:                      # what takes hold, by the first of their traits that matches, else default; {role} and {town} are filled
      ambitious: ["to be more than a {role} in {town}", "to have a say in how {town} is run"]
      greedy: ["to get hold of the money going around {town}", "to be the richest {role} in {town}"]
      vengeful: ["to get even with the one who wronged them in {town}"]
      anxious: ["to make sure nothing in {town} goes wrong again"]
      competitive: ["to be known as the best {role} in {town}"]
      obsessive: ["to finish the one piece of work that matters, whatever it costs"]
      envious: ["to have what the better-off of {town} have"]
      rebellious: ["to shake {town} out of its habits"]
      manipulative: ["to get someone in {town} to do their bidding"]
      curious: ["to find out what is really going on in {town}"]
      default: ["to see this year out better than the last", "to set something right at home"]
  situations:                   # while a situation runs at a town, prices there and danger in its wild places lean this way: percent per
    prices: {threat: 4, natural: 5, nature: 3, economic: 3, trade: -3, work: 2, politics: 2, mystery: 2, social: 0, fortune: -4}   # situation, by its kind,
    danger: {threat: 12, nature: 10, mystery: 8, work: 5}                                                                          # scaled by its severity
    cap: 25                     # the most such lean at one place
    days: 2                     # re-laid every pass, so it ends soon after the situation does
  travellers: {roles: [merchant, tinker, caravan_master, bargeman, scout], every_days: 6, chance: 0.4}   # a travelling trade moves along the roads to a neighbouring town now and then (people the player has not met)
  standing: {after_days: 21, per_day: 0.5}     # a town's groups forget: standing nobody has moved for three weeks eases toward neutral this much a day
