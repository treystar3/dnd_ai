- {id: waywise,      name: Waywise,       applies: jewelry,    value: 0,  world: wayfinder,        description: "Closed roads and blocked passes never stop you; you always find a way around."}
- {id: vigil,        name: Ever-Watchful, applies: jewelry,  value: 0,  world: night_watch,      description: "Nothing catches you while you rest outdoors; your sleep is never interrupted."}
- {id: hearthfire,   name: Hearthfire,    applies: jewelry,  value: 0,  world: campaigner,       description: "Sleeping rough in the wild restores you as fully as a bed."}
- {id: whisperer,    name: Whisperer,     applies: jewelry,    value: 0,  world: patron_whispers,  description: "Once a day, your first attempt to recall lore cannot fail; something whispers the answer."}
