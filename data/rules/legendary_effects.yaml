- {id: farsight,     name: Farsight,      applies: jewelry,    value: 0,  world: danger_sense,     description: "You are never caught off guard: hostile creatures are always spotted at a distance."}
- {id: huntsmans_eye, name: Huntsman's Eye, applies: jewelry,  value: 0,  world: tracker,          description: "Arriving somewhere wild, you read the signs of every creature that roams there."}
- {id: oracle,       name: Oracle,        applies: jewelry,    value: 0,  world: keen_judge,       description: "You read a fight before it starts: you see your exact odds."}
- {id: fortunes_favor, name: Fortune's Favor, applies: jewelry, value: 30, world: lucky_find,      description: "{value}% chance of a second chance at a find on every enemy you fell."}
- {id: phoenix,      name: Phoenix,       applies: jewelry,  value: 7,  description: "Once every {value} days, a killing blow does not kill you: you rise from the ashes at half health, with nothing lost, and the fight is over."}

