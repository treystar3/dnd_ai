# LEGENDARY EFFECTS - one per legendary item, on top of its rolled properties.
# Unlike properties, these are mechanics the engine executes (engine/combat.py).
#
# applies:  weapon | armor | jewelry
#           weapon  = effects that act in combat (strikes, afflictions, slaying)
#           armor   = effects that act in combat on the damage you take (reduction, avoidance, survival)
#           jewelry = rings and amulets: the wonders, effects the world answers to (see `world`)
# value:    the effect's strength; meaning depends on the effect (shown in its description)
# enabled:  false keeps an effect from ever rolling

- {id: vampiric,     name: Vampiric,      applies: weapon, value: 15, description: "Heals you for {value}% of the damage you deal."}
- {id: retribution,  name: Retribution,   applies: armor,  value: 20, description: "Returns {value}% of the damage you take to the attacker."}
- {id: deathward,    name: Deathward,     applies: armor,    value: 20, description: "Once per fight, a killing blow leaves you at 1 health and you recover {value}% of your health."}
- {id: cleave,       name: Cleave,        applies: weapon, value: 50, description: "Your melee weapon hits carry through into one other enemy engaged with you for {value}% damage."}
- {id: executioner,  name: Executioner,   applies: weapon, value: 50, description: "+{value}% damage against enemies below 30% health."}
- {id: first_blood,  name: First Blood,   applies: weapon, value: 0,  description: "Your first strike in every fight is a critical hit."}
- {id: relentless,   name: Relentless,    applies: weapon, value: 8,  description: "Each consecutive hit deals +{value}% more damage, up to five times. A miss resets it."}
- {id: aegis,        name: Aegis,         applies: armor,  value: 30, description: "The first hit you take each round is reduced by {value}%."}
- {id: phantom,      name: Phantom,       applies: armor,  value: 15, description: "{value}% chance to slip through an attack untouched."}
- {id: stormcaller,  name: Stormcaller,   applies: weapon, value: 25, description: "{value}% chance on hit to call lightning for extra spell damage."}
- {id: frostbite,    name: Frostbite,     applies: weapon, value: 30, description: "{value}% chance on hit to slow the target."}
- {id: rending,      name: Rending,       applies: weapon, value: 35, description: "{value}% chance on hit to make the target bleed."}
- {id: thunderous,   name: Thunderous,    applies: weapon, value: 12, description: "{value}% chance on hit to stun the target."}
- {id: echoing,      name: Echoing,       applies: weapon,    value: 30, description: "{value}% chance an ability doesn't go on cooldown."}
- {id: unburdened,   name: Unburdened,    applies: weapon,    value: 30, description: "Abilities cost {value}% less."}
- {id: regeneration, name: Regeneration,  applies: armor,  value: 3,  description: "You recover {value}% of your health every round of combat."}
- {id: unyielding,   name: Unyielding,    applies: armor,  value: 0,  description: "You cannot be stunned or knocked prone."}
- {id: fearsome,     name: Fearsome,      applies: weapon,    value: 0,  description: "Lower-level enemies may be frightened when a fight begins."}
- {id: wardbreaker,  name: Wardbreaker,   applies: weapon, value: 50, description: "Your attacks ignore {value}% of spell wards."}
- {id: last_stand,   name: Last Stand,    applies: armor,    value: 30, description: "Below 25% health: +{value}% damage and +20% defense."}
- {id: lightfoot,    name: Lightfoot,     applies: jewelry,  value: 25, description: "Travel {value}% faster, and fleeing is much easier."}
- {id: packbond,     name: Packbond,      applies: weapon,    value: 35, companions: true, description: "{value}% chance each time you hit that every companion strikes the same target at once."}
- {id: lifebinder,   name: Lifebinder,    applies: weapon,    value: 20, companions: true, description: "Your companions are healed for {value}% of the damage you deal."}
- {id: lifeline,     name: Lifeline,      applies: armor,     value: 0,  companions: true, description: "Once per fight, a companion that would fall is held to life at 1 health."}
- {id: guardian,     name: Guardian,      applies: armor,    value: 30, companions: true, description: "Your companions take {value}% less damage."}
- {id: spellblade,   name: Spellblade,    applies: weapon, value: 25, description: "Every hit also deals spell damage equal to {value}% of the blow."}
- {id: longreach,    name: Longreach,     applies: weapon, value: 0,  description: "Melee strikes reach like a spear."}
- {id: dragonslayer, name: Dragonslayer,  applies: weapon, value: 40, category: dragon,         description: "+{value}% damage against dragons and their kin."}
- {id: giantsbane,   name: Giantsbane,    applies: weapon, value: 40, category: giant,          description: "+{value}% damage against giants."}
- {id: gravewarden,  name: Gravewarden,   applies: weapon, value: 40, category: undead,         description: "+{value}% damage against the undead."}
- {id: hellbane,     name: Hellbane,      applies: weapon, value: 40, category: fiend,          description: "+{value}% damage against fiends."}
- {id: beastbane,    name: Beastbane,     applies: weapon, value: 40, category: beast,          description: "+{value}% damage against beasts."}
- {id: warbreaker,   name: Warbreaker,    applies: weapon, value: 40, category: monstrous race, description: "+{value}% damage against goblins, orcs and their like."}
- {id: soulbound,    name: Soulbound,     applies: any,    value: 0,  enabled: false, description: "Bound to your soul: it survives your death."}

