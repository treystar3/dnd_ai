# BIG FIGHTS (f224): camp and hideout assaults, boss fights, and any fight with 6 or more enemies (reserves counted) are fought on
# a larger, chained field. Ordinary encounters keep the small field above; duels keep their one bare zone.
#   wild   - this biome's ground, larger: a main zone, 2-3 side zones, and 1-2 zones beyond a side (a biome may list its own
#            `beyond`; otherwise its side zones serve). The far end is 3 steps or more from where the fight starts.
#   camp   - a camp or hideout, entered from outside: you come in at the approach, the camp's fighters are among the tents,
#            archers take the watch platform, the leader waits at the back and the rest of the camp comes from there.
#   lair   - a boss's chamber: you come in at the entrance, the boss holds the dais, and what it calls comes out of the alcove.
#   Roles: player = where you and yours begin; enemy = where they begin; back = where their leader or boss begins (and anything
#   spotted from afar); arrivals = where reinforcements come in from. Enemy archers and casters begin on the nearest high or
#   covered ground on their side, when there is any.
big:
  sides: {two: 0.5, three: 0.5}
  beyond: {one: 0.6, two: 0.4}
  camp:
    zones:
      approach: {name: the approach to the camp, tags: [open]}
      gate:     {name: the camp gate, tags: [narrow]}
      tents:    {name: between the tents, tags: [cover]}
      platform: {name: the watch platform, tags: [elevated]}
      leader:   {name: the leader's tent, tags: [concealed]}
    edges: [[approach, gate, open], [gate, tents, open], [tents, platform, climb], [tents, leader, doorway]]
    player: approach
    enemy: tents
    back: leader
    arrivals: leader
  lair:
    zones:
      entrance: {name: the entrance, tags: [open]}
      floor:    {name: the chamber floor, tags: [open]}
      pillars:  {name: among the pillars, tags: [cover]}
      dais:     {name: the dais, tags: [elevated]}
      alcove:   {name: a dark alcove, tags: [concealed]}
    edges: [[entrance, floor, open], [floor, pillars, open], [floor, dais, stairs], [pillars, alcove, difficult]]
    player: entrance
    enemy: floor
    back: dais
    arrivals: alcove
