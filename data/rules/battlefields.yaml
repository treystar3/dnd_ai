# The ground fights are fought on (engine/battlefield_builder.py): for each biome, the main zones a fight can start in and the side
# zones that may stand beside it. The builder draws one main and 0-2 sides, seeded by the campaign, so the same ambush on the same day
# is the same ground. The model never chooses topology or tags; it only dresses these names in the narration.
#
# Zone tags (engine/battlefield.py TERRAIN_TAGS):
#   open       nothing special
#   concealed  hard to see into: hiding, ambushes
#   cover      things to duck behind: ranged attacks in are harder
#   elevated   high ground: its holders strike down with the high-ground bonus
#   difficult  hard going: crossing in or out costs the whole action
#   narrow     a squeeze: only so many can come at one defender at once
#   hazardous  the ground itself can hurt (kept rare)
# Edge ways (ways between zones): open, doorway, stairs, climb, jump, difficult, blocked.

sides: {none: 0.2, one: 0.5, two: 0.3}    # how many side zones a battlefield gets
side_link: 0.3                            # chance the two side zones also join each other (by a difficult way)

default:
  main:
    - {name: open ground, tags: [open]}
  side:
    - {name: a rocky rise, tags: [elevated, difficult], way: climb}
    - {name: a jumble of boulders, tags: [cover, difficult]}
    - {name: a shallow gully, tags: [cover]}

