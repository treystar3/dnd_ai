# An outcome that committed but was never shown before the game closed (decision 8): told once on the next load, before its lines.
shown_later:
  - "To pick up where you were:"
  - "Here's where you left off."
  - "Where you left off:"
  - "Picking up where you left off."
  - "Last time, just before you stopped:"
  - "Before you stopped last time, this had just happened."
# (f507) A fight saved mid-round that this game could not take up again (a row of an older shape, or one that could not be read): the
# fight is let go of, never the game, and the player is told so once at the next load, in the narrator's voice. (f512) The owner's own
# six lines, 2026-11-04; (f513) the words that named a kind of place (a road, grass, a deserted spot) or had the player walk off made
# neutral at the owner's word, since the line is shown wherever the save left the player: a cave, a street, a hall, a field.
fight_let_go:
  - "Your foes are gone."
  - "The fight is done. There's no one to face."
  - "When you look around, the fighting has stopped."
  - "It's quiet now. The fight is over, and your enemies have gone."
  - "The fight is over. Your enemies are gone."
  - "No one is left to fight. It's over."
# A fight round whose telling could not be written: the numbers carry the blows.
round_stood:
  - "You trade blows, and the round ends."
  - "The round is over."
  - "A round passes, and the fight goes on."
  - "The round goes by fast."
  - "The fighting goes on. Another round done."
  - "That's one more round fought."
# A fight won whose aftermath could not be written: the win and its gains stand ({xp}, {coins}, {fallen}, {found} as the facts allow).
victory_stood:
  - "The fight's over, and you're still standing. {xp} experience."
  - "That's the last of them. {xp} experience."
  - "You win. {xp} experience for the trouble."
  - "They're beaten. You catch your breath. {xp} experience."
  - "It's over, and you've won. {xp} experience."
  - "The last one goes down. You've earned {xp} experience."
# The goddess at a death whose words could not be written: her own lines, in her voice. The death stands either way.
goddess_silent:
  - "Hush now... I have you. Breathe, little one, and go back."
  - "Oh, child. Come here, out of the cold. You are not finished yet."
  - "There you are. I have you now. Go on, go back."
  - "Shh. Lean on me a moment. Then back you go."
  - "Little one... you're cold. Here, take my warmth, and go."
  - "Not yet, child. Feel the sea let go of you. Back to the light with you."
# (f498) A fight begun whose opening could not be written: the fight is on, told plainly, with who came ({foe}) and how many ({count}).
fight_begun:
  - "It comes to a fight: {foe}, {count}."
  - "Weapons out. {foe}, {count}."
  - "No time to think. {foe}, {count}, coming at you."
  - "Trouble: {foe}, {count}."
  - "Here they come: {foe}, {count}."
  - "It's a fight now. {foe}, {count}, and close."

# (f525, engine/failures.py; the lines read and approved by the owner on 6 Nov, f527) Creation and the opening go on through an outage.
# creation_fail: the goddess's own words when a creation call failed (the player's line not read, the concept not read, the gifts or the
# traits not shaped); nothing is lost and the step is asked again. One list per kind, three lines at least, never the one shown last.
creation_fail:
  interpret:
    - "She frowns, puzzled. Say it to her once more."
    - "She tilts her head. She didn't catch that. Say it again."
    - "She leans in close, listening. Tell her again."
  concept:
    - "She can't yet see who you mean to become. Tell her again."
    - "She can't quite picture it. Describe yourself to her once more."
    - "She shakes her head. Tell her again what you'd like to be."
  gifts:
    - "Try saying yes again."
    - "That didn't work. Say yes again."
    - "She smiles, patient. Say yes once more."
  traits:
    - "Choose the three you were born with, once more."
    - "She can't find it yet. Choose your three again."
    - "Choose your three once more, and she'll look again."
# creation_stand_in: what she says for the step she is on when her own words could not be written; the page moves on (a refused pick
# still shows the "That can't be done: ..." note with its reason). One list per step.
creation_stand_in:
  name:
    - "She waits for your name."
    - "Her eyes rest on you. What are you called?"
    - "She tilts her head. What's your name, child?"
  concept:
    - "What will you become?"
    - "Whatever you'll be, she's ready."
    - "Tell her who you would be. She's listening."
  confirm_class:
    - "She shows you what she sees. Has she got you right?"
    - "Is this you?"
    - "Is this who you are?"
  actives:
    - "Here are the gifts she can give you. Choose three."
    - "Choose three to take back with you."
    - "Three of these are yours to take."
  passives:
    - "Now for what you were born with. Choose three."
    - "Three more. These are part of you already."
    - "Choose the three you were born with."
  stats:
    - "Now shape your body and mind."
    - "The shaping is up to you."
    - "Shape yourself as you'd like to be."
  confirm_stats:
    - "She looks you over. Is this how you want to be?"
    - "This is how you made yourself. Is it right?"
    - "Are you happy with this?"
# opening_untold: the narrator's plain line when the game's opening passage (the first waking, or where a loaded game left off) could
# not be written; the game reaches its first line all the same.
opening_untold:
  - "You take a breath and look around."
  - "You stand up."
  - "You get your bearings."
