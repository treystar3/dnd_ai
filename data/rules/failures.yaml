# A line of several actions in which some committed and a later one did not (decision 13): what stood is named in {done}.
# (f715) A line that stood in part: what stood, as finished clauses ({done}: "walked to the guild hall and handed in the contract
# 'Bounty: ...' and were paid 27 silver"), then what did not, as the clause its step set out to do ({missed}: "speak with the clerk");
# never "the rest", never a pasted summary.
part_stood:
  - "You {done}, but you never got to {missed}."
  - "You {done}. You didn't get to {missed}."
  - "You {done}, but that's as far as it went. You never got to {missed}."
  - "You {done}, and that was all. You didn't {missed}."
  - "You {done}, but you didn't manage to {missed}. Try that part again."
  - "You {done}. You didn't {missed}. Say it again if you still want to."
