# LAW - theft, force, witnesses, heat. Every number the crime system uses lives here.
#
# THEFT is rolled on a bar, not a percentage. For a steal in a zone of level Z:
#   roll    = a whole number from 1 to W            (W grows with Z; the roll is then multiplied by the best stealth gear, up to the cap)
#   score   = 1.5 x (Dexterity you allocated - 15)  + passives, training and scene bonuses (each a percent of W)
#   bar     = the bar for an average steal at Z, plus the item's value, plus the situation (each a percent of W)
#   margin  = (roll + score - bar) / W x 100
#   margin >= 30 strong success, >= 0 success, >= -15 partial, otherwise failure
# Gear never adds attribute points to a check. A stealth ring multiplies the roll instead.
theft:
  start_dex: 20                    # what a fresh character is assumed to start with, for the anchor below
  points_per_level: 5              # attribute points a level-up grants (matches progression.yaml)
  score_per_point: 1.5
  attribute_center: 15
  window: {per_level: 5.43, minimum: 40, scale: 0.5}       # W = round(max(minimum, per_level x (Z-1)) x scale)
  anchor: {investment: 0.34, chance: 0.5}                  # a character who put 34% of their level-up points into Dexterity has even odds at the reference bar
  degrees: {strong success: 30, success: 0, partial: -15}  # margin, as a percent of W
  item: {baseline: 100, per_doubling: 6, cap: 60}          # percent of W per doubling of value above baseline (copper)
  situation: {watched: 15, unattended: 0, per_witness: 5}  # percent of W, on top of the reference bar (unattended, nobody around); watched = the owner is there and looking
  worth: {trinket: 50, ordinary: 500, valuable: 5000, priceless: 50000}   # copper, for story objects that have no price
  gear_multiplier_cap: 1.3         # stealth gear adds to the multiplier (a +20 ring is 1.2); never more than this

# Chance (percent) that a person who could see it notices, by how well the stealth went.
notice:
  by_degree: {strong success: 0, success: 5, partial: 40, failure: 90}
  target_failure: 100              # the person being robbed always notices a failure
  assault: 70                      # someone seeing a violent act
  role_factor: {guard: 1.5, watch_captain: 1.5, royal_guard: 1.5}
  look_away_minutes: 360           # a bribed person looks away this long

# Heat: how wanted you are in a town, 0-100.
heat:
  gain: {theft: 10, story_theft: 15, assault: 20, run: 10, valuable_bonus: 5}
  valuable_over: 10000             # items worth more than this (1 gold) add the bonus
  passerby_share: 0.5              # if only passers-by noticed (not the victim or a guard) the gain is this share
  decay_per_day: 4
  after_paid: 39                   # paying a fine or serving jail drops you to this
  tiers: {cold: 20, confront: 40, wanted: 70}
  price_markup: 0.10               # at 'cold' and above
  first_meeting_trust: -5          # people meeting you for the first time, at 'cold' and above
  talk_relief: {success: 20, strong success: 30}    # persuading a guard out of it
  bribe_relief: 20
  fine_per_point: 50               # copper per point of heat
  jail_days: 2
  jail_fine_share: 0.5
  guard_roles: [guard, watch_captain, royal_guard]

# When someone you rough up fights back instead of backing down.
fight_back:
  base: 15
  armed_roles: [guard, watch_captain, royal_guard, hunter, guild_contractor, elven_warden, scout, trapper, guild_instructor]
  armed_bonus: 35
  traits: {brave: 15, hot_tempered: 25, proud: 10, cowardly: -20, anxious: -15}

# Words that make the audit gate look twice: a theft or an act of force that the plan does not show.
words:
  steal: [steal, pickpocket, pilfer, filch, swipe, snatch, lift, nick, purloin, burgle, rob]
  force: [grab, shove, seize, collar, slam, pin, choke, throttle, strangle, rough, punch, slap, drag]
