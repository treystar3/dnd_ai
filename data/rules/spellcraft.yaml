    depict: "the ground bursting into flame"
    rounds: {light: 2, moderate: 3, heavy: 3}
    pct: {light: 20, moderate: 30, heavy: 40}       # of the caster's spell power, each turn
  freezing_surface:
    element: cold
    kind: control
    label: Freezing Surface
