# SPELLCRAFT (engine/spellcraft.py, f227): what an element DOES, and the forms a damage spell takes.
#
# ELEMENT EXPRESSIONS
#   Every element has a mechanical speciality. An elemental ability carries one expression of its element, planned by the engine
#   (engine/ability_slots.py) like its element: a damage expression rides on each hit; a control expression is a spell that deals no
#   damage at all and changes the fight instead. Expressions replace the generic riders on elemental abilities - physical and
#   unaligned abilities keep the rider pool. The same law holds for every source: a weapon or a melee ability with an element
#   expresses it exactly as a spell does (ignite and poison themselves are one law for all - data/rules/combat.yaml, engine/afflictions.py).
#
#   Each expression:
#     element   the element it belongs to
#     kind      damage (rides on hits) | control (the whole spell, no damage)
#     label     the name on the ability card
#     text      what the card says, plainly ({numbers} filled per tier)
#     depict    what the narrator is told it looks like
#     numbers   per-tier values (light / moderate / heavy)
expressions:
  ignite:
    element: fire
    kind: damage
    label: Ignite
    text: "sets the target burning: it takes half the hit again as fire over the next two rounds. Only the strongest burn on a target counts."
    depict: "flames catching and clinging to the target"
  spreading_flames:
    element: fire
    kind: damage
    label: Spreading Flames
    text: "sets the target burning, and the fire leaps to every other enemy standing in the same area, burning each of them just as hot."
    depict: "fire leaping from the target to everyone around it"
  chill:
    element: cold
    kind: damage
    label: Chill
    text: "slows the target for {rounds} rounds."
    depict: "cold sinking into the target's limbs"
    rounds: {light: 1, moderate: 2, heavy: 2}
  arc:
    element: lightning
    kind: damage
    label: Arc
    text: "jumps to one other enemy in the same area, which takes {pct}% of the hit."
    depict: "the bolt jumping on to a second foe"
    pct: {light: 40, moderate: 50, heavy: 60}
  conduction:
    element: lightning
    kind: damage
    label: Conduction
    text: "spreads through every enemy in the target's area that is fighting the same people as the target: each takes {pct}% of the hit, or half again as much if it wears metal armor or is made of metal."
    depict: "current running through everyone tangled up in the same fight"
    pct: {light: 30, moderate: 40, heavy: 50}
    metal: 1.5
  envenom:
    element: poison
    kind: damage
    label: Envenom
    text: "adds a stack of poison. Every stack deals the same damage each round, however small the hit was, and each new stack restarts the timer on all of them."
    depict: "venom working into the wound"
  corrode:
    element: acid
    kind: damage
    label: Corrode
    text: "eats away {pct}% of the target's armor and ward for the rest of the fight (it builds up, to at most {cap}%)."
    depict: "acid pitting armor and hide"
    pct: {light: 10, moderate: 15, heavy: 20}
    cap: 75
  wither:
    element: necrotic
    kind: damage
    label: Wither
    text: "withers the target for {rounds} rounds: healing and regeneration do half as much for it."
    depict: "the flesh greying and dying around the wound"
    rounds: {light: 2, moderate: 2, heavy: 3}
  drain:
