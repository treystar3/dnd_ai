    depict: "the air in one place crackling with charge"
    rounds: {light: 2, moderate: 3, heavy: 3}
    pct: {light: 20, moderate: 30, heavy: 40}
  toxic_cloud:
    element: poison
    kind: control
    label: Toxic Cloud
    text: "fills the target's area with poison for {rounds} rounds: anyone who starts their turn there gains a stack of poison."
    depict: "a choking cloud rolling over one part of the field"
    rounds: {light: 2, moderate: 3, heavy: 3}
  dissolve_barriers:
    element: acid
    kind: control
    label: Dissolve Barriers
    text: "strips the target's protections: its barrier, its stance, any buff that guards it, and its Defend."
    depict: "acid eating through every guard the target had raised"
  unravel_recovery:
    element: necrotic
    kind: control
    label: Unravel Recovery
    text: "turns the target's healing against it for {rounds} rounds: every heal, drain or regeneration it gets deals that much damage to it instead."
    depict: "death worming into the target's ability to mend"
    rounds: {light: 2, moderate: 2, heavy: 3}
  reveal:
    element: radiant
    kind: control
    label: Reveal
    text: "floods the target's area with light for {rounds} rounds: no one there can hide, and the cover there hides no one."
    depict: "light flooding every hiding place"
    rounds: {light: 2, moderate: 3, heavy: 3}

  grasping_dead:
    element: necrotic
    kind: control
    label: Grasping Dead
    text: "raises clutching hands from the ground of the target's area for {rounds} rounds: any enemy who starts their turn there is held for a round and cannot get away."
    depict: "dead hands clawing up out of the ground"
    rounds: {light: 2, moderate: 3, heavy: 3}
  smoke:
    element: fire
    kind: control
    label: Smoke
    text: "fills the target's area with smoke for {rounds} rounds: attacks into or out of it are much likelier to miss."
    depict: "thick smoke boiling up over one part of the field"
    rounds: {light: 2, moderate: 3, heavy: 3}
    accuracy: 30
  thunderclap:
    element: lightning
    kind: control
    label: Thunderclap
    text: "staggers every enemy in the target's area: any blow or spell they are winding up is broken, and they are left open: easier to hit, and to hit hard, for a round."
    depict: "a crack of thunder that knocks every head back"
  caustic_pool:
    element: acid
    kind: control
    label: Caustic Pool
    text: "floods the target's area with acid for {rounds} rounds: any enemy who starts their turn there loses {pct}% of its armor and ward for the rest of the fight (up to 75%)."
    depict: "a spreading pool of acid hissing over the ground"
    rounds: {light: 2, moderate: 3, heavy: 3}
    pct: {light: 10, moderate: 10, heavy: 15}
  flare:
    element: radiant
    kind: control
    label: Flare
    text: "blinds every enemy in the target's area for a round."
    depict: "a burst of light too bright to look at"
  overgrowth:
    element: nature
    kind: control
    label: Overgrowth
    text: "grows thick undergrowth over the target's area for {rounds} rounds: no one outside can see in to target anyone there from range."
    depict: "undergrowth surging up thick enough to hide in"
    rounds: {light: 2, moderate: 3, heavy: 4}
  earthen_barricade:
    element: nature
    kind: control
    label: Earthen Barricade
    text: "walls in the area you stand in with packed earth for {rounds} rounds. Behind the walls, you and everyone with you are in cover: ranged attacks on you are likelier to miss. Anyone crossing the walls, in or out, has to climb, and that costs a whole turn."
    depict: "walls of packed earth heaving up out of the ground"
    rounds: {light: 2, moderate: 3, heavy: 3}
  earthquake:
    element: nature
    kind: control
    label: Earthquake
    text: "knocks every enemy in the target's area off their feet (no more than one size larger than you)."
    depict: "the ground bucking and splitting underfoot"
  petrify:
    element: nature
    kind: control
    label: Petrify
    text: "turns the target to stone for {rounds} rounds: it cannot act, and it cannot be damaged. Bosses cannot be petrified."
    depict: "stone creeping over the target until it stands frozen"
    rounds: {light: 1, moderate: 2, heavy: 2}

# Which control spells resist: a control expression aimed at an enemy is contested like any control spell (a full success lands
# it whole; a partial success lands it for one round less, at least one). Ground expressions (burning ground, freezing surface,
# seal the way, static field, toxic cloud, reveal) change the place, not the creature, so they always land.
ground: [burning_ground, freezing_surface, seal_the_way, static_field, toxic_cloud, reveal, grasping_dead, smoke, thunderclap,
         caustic_pool, flare, overgrowth, earthen_barricade, earthquake]

# SPELL FORMS - how a mana damage spell (not a channeled strike) delivers its damage.
#   bolt     one target (the default)
#   blast    everyone hostile in one area - the target's - each at a share
#   burst    everyone hostile in your own area, each at a share
#   curse    the damage comes over the target's next turns instead of now (it cannot miss, and it ignores a guard's interception)
#   charged  takes two whole turns: begun on the first, released on the second (that turn goes to it, and it cannot be dropped) for an
#            enormous blow; a stun or a fall before then breaks it and both turns are lost
forms:
  bolt:  {label: Bolt,  text: "strikes one target."}
  blast: {label: Blast, text: "strikes every enemy in the target's area, each for {share_pct}% damage.", share: 0.7}
  burst: {label: Burst, text: "strikes every enemy in your own area, each for {share_pct}% damage.", share: 0.8}
  curse: {label: Curse, text: "curses the target for {total_pct}% damage spread over its next {turns} turns. It cannot miss.", total: 1.5, turns: 3}
  charged: {label: Charged, text: "takes two turns: you begin casting on the first and release it on the second (that whole turn is spent on it, and you cannot stop once begun), for {mult_pct}% damage. If you are stunned or knocked down before it goes off, it is lost and both turns are wasted.", mult: 3.5}
# The old "area" reach strikes the target's area (a blast) - never every enemy on the field.
area_share: 0.7

# How the planner gives a mana damage spell its form (engine/ability_slots.py). An area spell is a blast or a burst; a single-target
# spell with a shape stays a bolt; a curse never carries a rider (its damage comes later, with nothing riding on it).
form_weights:
  area:   {blast: 60, burst: 40}
  single: {bolt: 50, curse: 25, charged: 25}
