    rounds: {light: 2, moderate: 3, heavy: 4}
  seal_the_way:
    element: cold
    kind: control
    label: Seal the Way
    text: "raises a wall of ice for {rounds} rounds: no one can cross between your area and the target's (if you share an area, every way out of it is sealed)."
