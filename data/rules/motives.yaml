# (f360) KNOWN PEOPLE'S LIVES, WITHOUT A MODEL CALL. A person the player has met who has a goal (npc.motive: the engine's from their traits,
# pulse.yaml drift.motives.seeds, or the profile's own words) moves it a step forward at a pulse; the step used to be a model call, so
# the people the player liked moved about once every three hours of play. Now the step is the engine's: a line from the table for the
# trait their goal came from (else default), in the first person, kept as their memory of it and as what is on their mind, so the next
# talk brings it up; a line of gossip for the town's news; a mood for a while. After steps_most steps the goal ends, made or not, as
# drift's rules decide (pulse.yaml drift.motives), and the town remembers. {name} {role} {town} {motive} are filled in.

engine: true
steps_most: 3

by_seed:
  ambitious:
    - {line: "I have been making myself useful to the people who matter in {town}, and letting it be seen.", gossip: "{name}, the {role}, has been keeping company above a {role}'s station.", mood: "watchful, with an eye on who is watching"}
    - {line: "A door opened a crack in {town} and I put my foot in it; it has cost me an old friend.", gossip: "{name} and an old friend are not speaking, and nobody will say why.", mood: "short with old friends"}
    - {line: "It is close now: one more favour owed to me, one more I owe.", gossip: "They say {name}, the {role}, is owed favours by half of {town}.", mood: ""}
  greedy:
    - {line: "I have found where the coin in {town} goes, and I have put myself in its way.", gossip: "{name}, the {role}, has taken an interest in other people's business.", mood: "sharp-eyed about every coin"}
    - {line: "I lent at a hard rate to someone who could not say no; they will not thank me for it.", gossip: "Somebody in {town} owes {name} more than they can pay.", mood: "pleased with a bargain nobody else liked"}
    - {line: "The money is nearly in hand; the only question left is who notices.", gossip: "{name}, the {role}, is spending like someone who expects more.", mood: ""}
  vengeful:
    - {line: "I have found out where the one who wronged me drinks, and when.", gossip: "{name}, the {role}, has been asking odd questions about someone.", mood: "quiet in a way that worries their friends"}
    - {line: "I said a thing to their face in {town} that cannot be unsaid, and I am glad.", gossip: "There were hard words in {town} between {name} and someone they have a grudge against.", mood: "grimly satisfied"}
    - {line: "It is nearly done; whatever comes of it, I will not be sorry.", gossip: "People in {town} are keeping clear of {name} this week.", mood: ""}
  anxious:
    - {line: "I have gone over everything in {town} twice that could go wrong, and fixed what I could.", gossip: "{name}, the {role}, has been checking doors and counting stock at odd hours.", mood: "tired from not sleeping"}
    - {line: "I asked for help and was laughed at, kindly; I am still afraid.", gossip: "{name} has been fretting at anyone who will listen.", mood: "fretful"}
    - {line: "Nothing has gone wrong yet. I do not trust it.", gossip: "They say {name} has calmed down a little, or given up.", mood: ""}
  competitive:
    - {line: "I have let it be known in {town} that my work is the best to be had, and dared anyone to say otherwise.", gossip: "{name}, the {role}, has been boasting, and somebody is bound to take it up.", mood: "spoiling for a contest"}
    - {line: "Somebody took the dare; we have each had a piece of the other's custom this week.", gossip: "There is a rivalry on in {town} over who is the better {role}.", mood: "working harder than is good for them"}
    - {line: "It comes down to one more job; the whole of {town} is watching, or I think it is.", gossip: "The rivalry in {town} is near its end, and people have money on it.", mood: ""}
  obsessive:
    - {line: "I have put everything else aside for the one piece of work that matters.", gossip: "{name}, the {role}, has shut the door on everyone and is at something.", mood: "absent, thinking of the work"}
    - {line: "It went wrong and I began again; nobody understands why it has to be right.", gossip: "{name} was heard breaking something and starting over.", mood: "raw from a setback"}
    - {line: "It is nearly finished. I have not slept.", gossip: "They say {name} has not been seen outside for days.", mood: ""}
  envious:
    - {line: "I have been watching how the better-off in {town} get what they get, and taking notes.", gossip: "{name}, the {role}, has been asking what things cost that a {role} cannot afford.", mood: "sour about other people's luck"}
    - {line: "I bought a thing I could not afford, to have one thing they have; it did not help.", gossip: "{name} has been seen with something fine and new, and people wonder how.", mood: "defensive about a purchase"}
    - {line: "I know now what it would take, and I am not sure I want it after all.", gossip: "{name} seems easier in themselves lately, or has stopped trying.", mood: ""}
  rebellious:
    - {line: "I said in the open what everyone in {town} says behind doors.", gossip: "{name}, the {role}, spoke out in {town} and some cheered and some did not.", mood: "lit up by an argument"}
    - {line: "They tried to make me take it back; I did not, and it has cost me custom.", gossip: "{name} is being cold-shouldered by some in {town} for what they said.", mood: "stubborn, and a little lonely"}
    - {line: "Others have started saying it too; whatever happens to me, that is done.", gossip: "There is more talk in {town} of the kind {name} started.", mood: ""}
  manipulative:
    - {line: "I have found the one in {town} who can do what I want done, and found what they want.", gossip: "{name}, the {role}, has been very friendly with someone lately.", mood: "pleasant, with something behind it"}
    - {line: "A favour done, a favour owed; they do not see the shape of it yet.", gossip: "Somebody in {town} is running errands for {name} and does not know why.", mood: "pleased with themselves"}
    - {line: "They will do it now, and think it was their own idea.", gossip: "They say {name} always gets their way in the end, and nobody can say how.", mood: ""}
  curious:
    - {line: "I have been listening at doors in {town}, and there is more going on than people say.", gossip: "{name}, the {role}, has been asking a great many questions.", mood: "bright-eyed with a secret"}
    - {line: "I found a thread and pulled it, and someone has told me to stop.", gossip: "{name} was warned off something, and is not saying what.", mood: "cautious, for once"}
    - {line: "I know now what is really going on in {town}, or most of it; the rest I can guess.", gossip: "They say {name} knows something about {town} and is enjoying not telling.", mood: ""}
  bitter:
    - {line: "I have been saying out loud what {town} owes me, to anyone who will stand still for it.", gossip: "{name}, the {role}, has been airing an old grievance again.", mood: "sour, and looking for an ear"}
    - {line: "Someone told me to let it go. I have not, and I told them so.", gossip: "{name} and a neighbour had words over something years old.", mood: "wounded, and stiff about it"}
    - {line: "I have what I was owed, or the nearest thing to it; it tastes of less than I thought.", gossip: "They say {name} got back something that was owed them, and is no happier for it.", mood: ""}
  proud:
    - {line: "I have refused work in {town} that was beneath me, and let it be known why.", gossip: "{name}, the {role}, turned down a job and made sure everyone heard.", mood: "stiff-backed"}
    - {line: "I was slighted in front of people, and I answered it; it may cost me.", gossip: "There was a scene in {town} over {name}'s good name.", mood: "burning over a slight"}
    - {line: "They came round, or enough of them did. I did not bend.", gossip: "They say {name} has had an apology out of someone, and is dining on it.", mood: ""}
  loyal:
    - {line: "A friend in {town} is in a hole, and I have put my own name next to theirs.", gossip: "{name}, the {role}, has been seen a great deal with someone the town is talking about.", mood: "braced, and not saying for whom"}
    - {line: "It has cost me custom to stand where I stand; I am still standing there.", gossip: "Some in {town} have stopped dealing with {name} over the company they keep.", mood: "set, with a tired face"}
    - {line: "It is over, one way or the other, and I was there for the whole of it.", gossip: "Whatever was wrong with {name}'s friend, {name} saw it through with them.", mood: ""}
  pious:
    - {line: "I have been at the temple before anyone else is up, and I have given more than I can spare.", gossip: "{name}, the {role}, has taken to the temple of a morning, and it is noticed.", mood: "quiet, with a far look"}
    - {line: "I asked the priest a thing I should have asked years ago, and the answer was not a comfort.", gossip: "{name} came away from the temple looking older.", mood: "chastened"}
    - {line: "I have done what was asked of me. Whether it is enough is not mine to say.", gossip: "They say {name} has made some peace with the temple, or with themselves.", mood: ""}
  secretive:
    - {line: "Somebody in {town} knows a thing about me, and I have been finding out who.", gossip: "{name}, the {role}, has been oddly careful about who they talk to.", mood: "watchful"}
    - {line: "I paid for a silence; I do not know yet whether I bought it.", gossip: "Money changed hands in {town} between {name} and someone, and neither will say for what.", mood: "tight, listening for their own name"}
    - {line: "It is buried again, deeper than before. I will sleep now.", gossip: "Whatever people were about to say about {name}, they have stopped.", mood: ""}
  suspicious:
    - {line: "Somebody in {town} is not what they say, and I have been counting what they take and what they give.", gossip: "{name}, the {role}, has been watching someone and not hiding it.", mood: "narrow-eyed"}
    - {line: "I said it to their face, and they laughed; I was not wrong, and I will show it.", gossip: "{name} accused someone in {town} and has been laughed at for it.", mood: "stung, and surer than ever"}
    - {line: "I was right, or right enough; the town can make of it what it likes.", gossip: "They say {name} was on to something after all, and will not let anyone forget it.", mood: ""}
  gossipy:
    - {line: "There is a story going round {town} and I have had three versions of it; I mean to have the true one.", gossip: "{name}, the {role}, has been asking everyone the same thing and comparing the answers.", mood: "lit up with news"}
    - {line: "I told it to the wrong person, and it came back to the one it was about.", gossip: "Something {name} said got back to the person it concerned, and there was a row.", mood: "sheepish, for a day"}
    - {line: "I have the whole of it now, and I am sitting on it, which is the hardest thing I have ever done.", gossip: "{name} knows something and, for once, is not telling.", mood: ""}
  hardworking:
    - {line: "I have taken on more than one pair of hands should, and I am keeping up, so far.", gossip: "{name}, the {role}, has been at work before light and after dark.", mood: "worn thin and not stopping"}
    - {line: "Something gave, as it had to; I have patched it and gone on.", gossip: "{name} was laid up for a day and back at it the next, against advice.", mood: "stubborn with tiredness"}
    - {line: "It is done, the whole of it; I will rest when I remember how.", gossip: "They say {name} has finished a job nobody thought one person could.", mood: ""}
  frugal:
    - {line: "I have cut everything that could be cut, and I am putting by every coin that comes in.", gossip: "{name}, the {role}, has been living on bread and will not say why.", mood: "careful to a fault"}
    - {line: "A chance came to spend it all on a sure thing; I nearly did.", gossip: "{name} turned down a deal half of {town} would have jumped at.", mood: "shaken by a near thing"}
    - {line: "It is enough now; a bad year can come and I will meet it.", gossip: "They say {name} has money put by, more than a {role} ought.", mood: ""}
  generous:
    - {line: "There are people in {town} going without, and I have been seeing to some of it quietly.", gossip: "Somebody in {town} has been leaving bread and firewood at doors, and {name} has gone very quiet about it.", mood: "warm, and tired"}
    - {line: "It has been noticed, and now they come to the door; I cannot help them all.", gossip: "{name}, the {role}, is being asked for help by more people than they can manage.", mood: "stretched thin"}
    - {line: "I have done what I can; the rest {town} will have to do for itself.", gossip: "They say {name} has given away more this season than a {role} earns.", mood: ""}
  dutiful:
    - {line: "A charge was laid on me, and I have been doing it exactly, whatever people think.", gossip: "{name}, the {role}, has been seeing to an old obligation nobody else remembers.", mood: "set-faced"}
    - {line: "They asked me to let it slide, just this once; I could not.", gossip: "{name} would not bend on something, and somebody in {town} is sore about it.", mood: "unhappy, and unmoved"}
    - {line: "It is discharged. I did not enjoy it, and I would do it again.", gossip: "Whatever {name} had taken on, it is done, and done properly.", mood: ""}
  adventurous:
    - {line: "I have been getting ready to go: maps, a pack, a story for the people I will leave.", gossip: "{name}, the {role}, has been asking travellers about the roads.", mood: "restless"}
    - {line: "I got as far as the first night out and came back for something I had forgotten; that is what I am telling people.", gossip: "{name} left {town} and was back within two days, saying nothing.", mood: "sheepish, and more determined"}
    - {line: "The pack is by the door and the goodbyes are said. Soon.", gossip: "They say {name} means to leave {town} for good this time.", mood: ""}
  haunted:
    - {line: "I have gone back over the thing that follows me, looking for a way to set it down.", gossip: "{name}, the {role}, has been sleeping badly, and it shows.", mood: "far away"}
    - {line: "I spoke of it, once, to someone; it did not help them and it did not help me.", gossip: "{name} told somebody something, and that somebody has not been the same since.", mood: "closed up again"}
    - {line: "It is still there. I have learned to walk with it, and that will have to do.", gossip: "They say {name} seems easier lately, or has just stopped showing it.", mood: ""}
  idealistic:
    - {line: "I have been telling {town} how things ought to be, and some of them have listened.", gossip: "{name}, the {role}, has been talking about how {town} ought to be run.", mood: "burning with it"}
    - {line: "The first time it came to a choice, half of them chose the easy way; I have not given up on them.", gossip: "{name} was let down by people they had counted on, and said so.", mood: "disappointed, and still at it"}
    - {line: "A small thing is changed in {town} because I would not shut up about it. It is a start.", gossip: "They say one thing in {town} is done differently now, and {name} is the reason.", mood: ""}
  shrewd:
    - {line: "Everyone in {town} is selling the same thing; I have been buying something else.", gossip: "{name}, the {role}, has been making deals nobody else understands.", mood: "pleased with a private sum"}
    - {line: "The price moved against me for a week and people laughed; it has moved back.", gossip: "People were laughing at {name}'s deals, and have stopped.", mood: "unbothered"}
    - {line: "It came out as I said it would, near enough; I will not say so to anyone.", gossip: "They say {name} came out well ahead of {town} on something, and is modest about it, for once.", mood: ""}
  vain:
    - {line: "I have had something made that {town} has not seen the like of, and I have been wearing it.", gossip: "{name}, the {role}, has new clothes and makes sure you see them.", mood: "preening"}
    - {line: "Somebody said a thing about it that was meant to be heard; I heard it.", gossip: "A remark was made in {town} about {name}'s finery, and {name} has not forgiven it.", mood: "brittle"}
    - {line: "I am admired, by the ones who count; the others may say what they like.", gossip: "They say {name} has an admirer in {town} at last.", mood: ""}
  reckless:
    - {line: "I have said I will do a thing that {town} says cannot be done, and now I have to.", gossip: "{name}, the {role}, has taken a dare in front of witnesses.", mood: "lit up and sleepless"}
    - {line: "The first try went badly and I have the bruises; I am going again.", gossip: "{name} came off worse at something and will not be talked out of a second go.", mood: "bruised and grinning"}
    - {line: "Done, or near enough that nobody can say otherwise. My hands are still shaking.", gossip: "They say {name} actually did it, whatever it was, and {town} is still arguing about it.", mood: ""}
  default:
    - {line: "I have been quietly at work on something of my own, and it is going.", gossip: "{name}, the {role}, has had something on their mind lately.", mood: "preoccupied"}
    - {line: "It went wrong once; I have started again and said nothing about it.", gossip: "{name} has been short with people and will not say why.", mood: "short with people"}
    - {line: "It is nearly where I wanted it; one more good week.", gossip: "They say {name}, the {role}, is near the end of something.", mood: ""}
