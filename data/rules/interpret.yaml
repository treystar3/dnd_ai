# What the action interpreter is shown (engine/candidates.py): only what the player's words could be about, instead of the whole world.
# A place or person the words name always goes in; the rest comes in by meaning, and only when it is close.
most_places: 32              # the most places the interpreter is ever shown (this town, the ways out and what is in them, anything named, the closest by meaning)
nearest_of_kind: 3           # "the smithy": the nearest places of a kind the words name, wherever they are
places_by_meaning: 6         # how many places may come in by meaning alone
place_floor: 0.45            # how close a place's name must be to the words to come in by meaning
most_people: 8               # the most people met-and-elsewhere shown
people_by_meaning: 3
person_floor: 0.45
about_floor: 0.45            # how close the words must be to one of the sentences below for that catalogue to be shown
# One sentence per kind of catalogue: the words are compared to it by meaning. Nothing is matched on particular words.
about:
  wares:     "buying something that is for sale here, asking what is sold or what it costs, or shopping"
  abilities: "using, casting or trying one of the character's own abilities or spells"
  pack:      "handling an item they carry: using, equipping, wearing, wielding, drinking, eating, dropping, giving, showing or examining it"
  recipes:   "crafting, cooking, brewing or making something from materials"
  buyers:    "selling something they carry, or asking who would buy it"
  stash:     "putting something into storage or taking it out of the item box"
# A catalogue this short goes in whole whatever the words are
always_if_short: 4
# Words that name nothing on their own: a place is named by its other words ("the Blackpine inn" by "blackpine", not "inn")
generic_words: [the, of, and, hall, house, guild, guildhall, inn, shop, temple, forge, smithy, market, square, tavern, workshop, yard, trading,
                village, town, city, road, gate, north, south, east, west]
# (f428, the owner's review Q17) A far place the words do not name is never walked to on a guess: "For major cities they need to say it
# exactly but for places off a road or locations it can ask." Far is a walk longer than far_walk_minutes (where road events begin). A
# city or town (major towns, as the map types them) must be named; any other far place is asked about. A word for a kind of place names
# none of them in particular: "the shore" is not the drowned shore, "the ridge" is not Windbreak Ridge.
far_walk_minutes: 180
say_exactly_types: [city, town]
landform_words: [shore, shores, shoreline, coast, beach, ridge, ridges, crypt, crypts, cave, caves, cavern, hills, hill, forest, wood,
                 woods, marsh, marshes, fens, fen, fields, field, ruins, ruin, barrow, barrows, pass, peak, peaks, falls, lake, river,
                 deeps, shoals, wetland, wetlands, steps, stair, stairs, sepulchre, tomb, tombs, vault, vaults, mine, mines, delve, warren,
                 lair, grove, glade, valley, vale, moor, moors, heath, waste, wastes, badlands, plains, downs, cliffs, cliff, bluff, ford,
                 bridge, trail, track, path, beneath, under, deep, exit, door, doors, gate, gates, there, back, home, onward, ahead]
# When the words name a town, which of its places come in with it (the ones a traveller would mean by the town's name)
named_town_types: [city, town, village, guild, inn, market, square, shop, temple, smithy, yard]
