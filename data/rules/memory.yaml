# (f478, GOALS.md "every store has a cap") How much a person keeps of each kind of memory (engine/memory.py, storage/campaign.py _trim).
# Past a cap, rows go lowest importance first, then oldest: a defining memory goes last, but within the cap like any other, so no kind
# grows without bound on a long campaign; the journal keeps the trail. The owner's first numbers (2026-11-03, Q4), tuned from the first
# night after Bundle D.
#
#   experienced    what happened to them, with the player there (a sale, a theft caught, a gift)
#   witnessed      what they saw done to someone else
#   noticed        what they found afterwards, not seeing who did it
#   heard          what reached them from others (a matter's end, the guild's word)
#   told           what someone said to them about themselves or the world (f482)
#   own_life       their own life, with no one else in it
#   promise_heard  a promise made to them (f482)
#   said           what they said of themselves (a hire's claims, f482)
#   knows          a thing they know, held for a matter (f483)
#   revision       how they changed (f483)
townsfolk: {experienced: 40, witnessed: 20, noticed: 10, heard: 16, told: 16, own_life: 12, promise_heard: 8, said: 8, knows: 12, revision: 8}
# (f479) a hire's memories, as rows under hire:<id> (about 80 in all): what they lived with the player, and what the player told them
hire: {experienced: 60, told: 20}
# (f479) Maren's log of what was said lately between her and the player: one cap where there were two (12 and 24)
maren: {chat: 24}
# (f482, GOALS.md S1 and S5: a spoken claim never becomes fact) How sure a person is of what they hold, by kind: what they saw or lived is
# sure; what they were told is what someone said; what reached them from others is hearsay. A claim is never read by the rules (a fence,
# tools/sim/claims_482_test.py), only offered back to the one who holds it, as what it is.
certainty: {experienced: sure, witnessed: sure, noticed: sure, own_life: sure, knows: sure, revision: sure,
            told: they say, heard: hearsay, said: their word, promise_heard: their word}
# Words of time that are true only on the day they were said: struck from a claim as it is kept, so "yesterday" never stays yesterday
# (the time it was said is the row's own minute, told from now in words, f477).
relative_time: ["earlier today", "this morning", "this afternoon", "this evening", "last night", "tonight", "yesterday", "the day before yesterday",
                "a few days ago", "the other day", "last week", "this week", "just now", "a moment ago", "recently", "lately"]
