      lines: ["The good year at {wild} is remembered in {town} as the one that paid off the debts; the next was ordinary, as they are.",
              "What {wild} gave it took back the next {season}; {town} spent the windfall and then looked at the empty hillside."]
      effects:
        - {kind: mood, npc: role, text: ["content after a good year"]}
    resolution: ["A good year needs no settling; keep the {creatures} off the pickers, and a share is yours.", "See that {town} gets the best of its own good luck."]
    truth: ["What {wild} shows this {season} was hidden on purpose, long ago; those who go furthest in are finding more than {good}, and keeping quiet.",
            "The bounty is real, and so is what wakes under it: the {creatures} are moving because something they fear was uncovered with the rest."]
    clues:
      - {holder: role, lines: ["Go past where the others stop. There's more, further in, and something else besides. I saw stone.",
                               "The {role2} has been out at night. Nobody picks {good} at night."]}
      - {holder: role2, lines: ["It's a good year. Enjoy it. Don't go digging under it.",
                                "The {creatures} don't come near the pickers. They come near the ones who go in deep. Think about that."]}
    paths:
      - {kind: find, target: wild, name: "Find what {wild} uncovered", how: "Go past the pickers into {wild} and find what the {season} laid bare."}
      - {kind: kill, target: creature, name: "Keep the {creatures} off", how: "Kill the {creatures} that take a toll of the pickers."}
      - {kind: contract}
    contract: {kind: gather, what: good, count: [4, 8]}
    reveal: ["Past the last of the pickers, a worked stone with a hole under it, and the earth about it fresh.",
             "The {creatures} are not hunting the pickers. They are circling one place, and keeping everything away from it."]

  mystery_changed:
