    fallout:
      lines: ["{Road} opened again when the {creatures} moved on, and the first cart up it found the last one still in the ditch.",
              "{Town} learned to live with the long road; when {road} was safe again, half the trade had found other ways."]
      effects:
        - {kind: prices, place: town, value: [5, 12], days: [8, 16]}
        - {kind: mark, place: road, text: ["a culvert the {creatures} denned in, still stinking"]}
    resolution: ["Clear the {creatures} off {road}.", "Open {road} between {town} and {neighbour}."]
    truth: ["The {creatures} did not come to {road} by chance: something is dead in the culvert at the low bend, and they came for it and stayed for the carts.",
            "The {creatures} are the lesser trouble; the {role2} of {town} pays a few hard men to turn carts back so the long road, which they own a piece of, stays busy."]
