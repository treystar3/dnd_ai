    reveal: ["In the culvert at the low bend, a cart's load of salt meat, spoiled, that the {creatures} have been feeding on for weeks: dumped, not lost.",
             "Two of the {creatures} you killed had been fed by hand: no fear of men, and a cut rope on one."]

  nature_cut_off:
