          - {kind: danger, place: wild, value: [20, 40], days: [4, 8]}
          - {kind: mark, place: wild, text: ["a cold camp, one boot, a ring of searchers' tracks"]}
      - lines: ["{Town} has given them up: a stone with no body under it, and {wild} left to itself for the rest of the {season}.",
                "Nobody from {town} goes into {wild} now; the lost are mourned, and the {role} has not forgiven the town for stopping."]
        effects:
          - {kind: closed, place: wild, days: [2, 5], text: ["nobody from {town} will go in after the lost"]}
          - {kind: relation, npc: role, other: role2, value: [-12, -5], text: ["blames them for calling off the search"]}
    fallout:
      lines: ["The lost of {wild} were never found; {town} put up a stone and the {role} stopped going to the gate.",
              "A single one came back out of {wild}, months on, and would not say where the others were; {town} stopped asking."]
      effects:
        - {kind: mark, place: town, text: ["a new stone by the gate with names and no dates"]}
    resolution: ["Go into {wild} and find them, alive or not.", "Find what in {wild} took them."]
    truth: ["They are alive, some of them: holed up deep in {wild} with a hurt one they would not leave, and whatever took the rest is between them and the road.",
            "The {creatures} of {wild} have them; the camp was taken at night, and what is left is in a den that can be found by the tracks."]
    clues:
      - {holder: role, lines: ["They went in by the old path, not the new one. If you follow anyone, follow that.",
                               "One of them was hurt before they went. They'd not have moved fast. They're nearer than the searchers thought."]}
      - {holder: role2, lines: ["The camp wasn't broken. It was left. Fires out, packs gone. They walked away from it, or were walked.",
                                "I heard something answer when we called. Not them. I'm not going back for any pay."]}
    paths:
      - {kind: find, target: wild, name: "Find the lost in {wild}", how: "Search {wild} for the party, and bring word or bring them."}
      - {kind: kill, target: creature, name: "Kill what took them", how: "Put down what in {wild} is keeping the lost from the road."}
      - {kind: contract}
    contract: {kind: hunt, what: creature, count: [1, 3]}
    reveal: ["A trail of cut marks on the trees leads away from the camp: somebody blazed a way out, slowly, for someone who could not walk.",
             "The den is lined with gear from {town}, and some of it is warm."]

  threat_road:
