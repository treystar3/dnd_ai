# THREADS THE ENGINE BUILDS ITSELF (f331, engine/threads.py).
#
# Most of what happens in the world away from the player is ordinary (pulse.yaml: four situations in five are normal, most of the rest
# uncommon). Those the engine now makes without a model call: a template for the pressure's kind, the pressure's own severity and scope
# for the size of it, the place's own people and creatures for the parts, and these phrase tables for every word. A situation built
# here is complete at birth and runs on its own; when the player comes where it is, one model call (engine/threads.py tell) may
# re-tell the lines nothing has copied yet in the world's own words, so what the player meets reads fresh. The title is never
# re-told: it is the key the world keeps its effects and memories under.
#
# A template is chosen by the pressure's kind (pressures.yaml), or by the pressure's own `template:` when it names one. A pressure may
# also fix slots with `words:` (creature: wolf, wild: greywood); every other slot is filled from the place. With no pressure behind
# the situation (a town with none), a kind is drawn from kind_weights.
#
# A kind has several SHAPES (f341): the base template keyed by the kind (threat, nature, ...) and any number more that name it with
# `kind:` (threat_tribute, threat_missing, threat_road). The engine draws among the shapes whose `needs` the place can fill, by
# `weight:` (1 when unset), with the seeded rng, so the same seed still builds the same situation; a shape whose needs fail is simply
# not drawn, and when none fits the base template's `fallback` chain is followed as before. A pressure's `template:` names one shape
# outright. Every titles, news, stage-lines and fallout list must hold at least one line that needs only the slots every place has
# (town, place, region, season, about, role, role2, good) or the template's own needs: engine/data_check.py refuses the rest, because a
# town with no road, no neighbour or no creature could otherwise build nothing.
#
# SLOTS, written {slot} in any line (the engine fills them; a capitalised slot name capitalises the first letter):
#   town, place, wild, neighbour, road, region, season      names; wild is the nearest dangerous place, neighbour the nearest other town
#   creature, creatures                                      one of the wild's own creatures, singular and plural
#   role, role2                                              two of the town's people by their trade ("shepherd", "innkeeper")
#   about                                                    one clause of the pressure's description ("a caravan is robbed"), or one of abouts
#   good                                                     a herb or a food (data/world/goods.yaml), for gather contracts
# In an effect, place/npc/other/target name a slot: place: wild, npc: role, other: role2, target: creature. A slot the place cannot fill
# (no wild, no creature, no second trade) drops the effect, the path or the clue that needs it; a template whose `needs` cannot be met
# falls back to its `fallback` template.
#
# value and days are [low, high]; value is then scaled by severity_scale[severity] and tier_scale[tier], and clamped by pulse.yaml.
# Effect kinds are the ones the pulse applies (llm/contracts.py WorldEffect); engine/data_check.py refuses any other.
#
# (f359) THE TOWN ANSWERS THE STRANGER. Templates marked `consequence: true` are never drawn by chance: engine/consequences.py builds
# them from data/rules/consequences.yaml when the player's own deeds call for them.
#
# (f358) WHAT FOLLOWS. A template's `then` says what may come of a situation at the same place once it ends: `ignored` (left to its
# fallout) and `settled` (by the town's own people, or by the player), each a weighted list of templates with a severity shift. The
# pulse queues one by pulse.yaml chains (a chance, a delay) and starts it at the next tick after the delay, with the pressure's heat
# (up one each time it is ignored, down one when settled) added to the severity. Ignore the wolves and the deep sends something larger;
# settle a feud and a fair follows.
#
# (f357) THE STREETS. A stage may also say what it looks like where the player walks (engine/threads.py street_now, scenes/world.py
# refresh_present): `doings` sets what people are doing while the stage runs, as a moment does (all: everyone at the situation's own
# place; role / role2: the cast, anywhere in the town); `at` puts a cast person at a kind of place in the town for the stage (the
# shepherd at the square, asking who will come) through the routines (engine/routines.py); `scene` names a moment shape
# (data/rules/moments.yaml) the moments machinery plays, owned by this situation, when the player walks in while the stage is on and
# the situation's door is a scene. All slots as above; what the place cannot fill is simply not done.

severity_scale: {0: 0.4, 1: 0.6, 2: 0.8, 3: 1.0, 4: 1.3, 5: 1.6}
tier_scale: {normal: 1.0, uncommon: 1.25, rare: 1.5}
# who hears of it first, by the pressure's scope (locals is the place's own group); news then travels the roads as it always has
scope:
  individual: {groups: [locals]}
  local:      {groups: [locals, everyone]}
  regional:   {groups: [everyone]}
  national:   {groups: [everyone]}
  kingdom:    {groups: [everyone]}
  global:     {groups: [everyone]}
kind_weights: {threat: 4, social: 4, economic: 2, natural: 2, nature: 2, trade: 2, work: 2, politics: 1, mystery: 2, fortune: 2}

# (f356) SIGNS, by kind: what a situation looks like in the streets on its second day and after, one line a day in turn, so HAPPENING HERE
# is not the stage's first line for two days running. Slots as above; a line a place cannot fill is skipped.
signs:
  threat:
    - "The outlying pens of {town} stand empty, and the talk is all of the hunt."
    - "Nobody from {town} goes toward {wild} alone now; they wait at the gate for company."
    - "A {role} of {town} has been asking round for anyone who will go into {wild} with them."
    - "The {creatures} were heard again last night, nearer than before."
  social:
    - "The talk at {town} has gone round to the same thing again, and people take sides over it."
    - "Two of {town}'s people were heard arguing it out in the street, and neither gave way."
    - "The {role} of {town} will not say what they think of it, which everyone takes as an answer."
  economic:
    - "Shutters are down early in {town}; coin is short and everybody knows whose."
    - "The {role} of {town} is counting stock twice and selling none of it on credit."
    - "People in {town} are trading favours instead of coin this week."
  natural:
    - "The fields about {town} are being watched the way people watch a sick child."
    - "{Town} smells of smoke and wet ash, and nobody says why."
    - "The {role} of {town} has been up since before light, and it shows."
  nature:
    - "Those who go toward {wild} from {town} come back early and say little."
    - "The game has gone quiet about {town}; the {role} says so to anyone who asks."
    - "There is a new path worn to the edge of {wild}, and nobody will say who made it."
  trade:
    - "Carts stand loaded in {town} with nowhere to go, and the drivers play dice on the tailboards."
    - "The {role} of {town} is asking every traveller what they saw on {road}."
    - "Prices in {town} have gone the way they go when a road is bad."
  work:
    - "Every pair of hands in {town} is wanted, and the {role} is paying for them."
    - "{Town} is up before dawn and does not stop; the inn is empty until dark."
    - "The {role} of {town} has taken on more than they can do and is saying so."
  politics:
    - "The notable people of {town} are being seen together more than they like."
    - "There is a notice on the door of {town}'s hall that everyone has read and nobody discusses."
    - "The {role} of {town} has started choosing their words with care."
  mystery:
    - "People in {town} look twice at a stranger now, and at each other."
    - "Someone has been leaving a lamp lit all night in {town}, and the talk is why."
    - "The {role} of {town} has a theory about it and will tell it to anyone who stands still."
  fortune:
    - "{Town} is in a good humour; the inn is loud by afternoon."
    - "The {role} of {town} has new boots and a way of mentioning it."
    - "There is a feast being talked of in {town}, and the arguing is only over the day."
clues_most: 3
never_roles: [prisoner, guild_clerk, guild_master, monarch, chamberlain, royal_guard]   # trades that are nobody's quarrel: the protected and the kept
telling: {retry_hours: 12}        # a re-telling the model failed is tried again after this long

templates:
  threat:
    then: {ignored: [{template: threat_tribute, weight: 2, severity: 1}, {template: threat, weight: 1, severity: 1}, {template: nature, weight: 1, severity: 1}], settled: [{template: fortune, weight: 1, severity: -1}, {template: social, weight: 1}]}
    needs: [wild, creature]
    fallback: social
    abouts: ["{creatures} have been taking stock", "something has been killing in {wild}", "travellers on {road} have been set upon"]
    titles: ["{Creatures} out of {wild}", "Trouble from {wild}", "The {creatures} of {wild}", "{Creatures} at the edge of {town}", "A hunt for the {creatures}", "Lost stock at {town}", "{Road} is not safe"]
    news: ["{Creatures} have come down out of {wild}; {town} has lost stock to them.", "Word from {town}: {about}.",
           "A {role} from {town} swears the {creatures} in {wild} are bolder than any year they remember.",
           "A {role} on {road} came in white-faced, talking of {creatures}.", "Hunters out of {town} want company before they go into {wild} again."]
    stages:
      - lines: ["{Creatures} have been seen at the edge of {wild}, closer to {town} than anyone likes; a {role} has lost animals to them.",
                "Tracks of {creatures} run right up to the fields of {town}, and a {role} is keeping a lamp lit all night.",
                "The {creatures} of {wild} have begun taking what they can from the edge of {town}; nobody walks {road} alone after dark."]
        effects:
          - {kind: danger, place: wild, value: [20, 40], days: [3, 6]}
          - {kind: mood, npc: role, text: ["uneasy since the {creatures} came down from {wild}", "short of sleep; the {creatures} keep coming"]}
        doings: {all: "talking in twos and threes about the {creatures}, and looking toward {wild}", role: "asking anyone who will listen to come and look at the tracks"}
        at: {role: square}
        scene: commotion
      - lines: ["The {creatures} have grown bold: a {role2} was hurt on {road}, and {town} is talking of a hunt.",
                "A pack of {creatures} was driven off the very edge of {town} at dawn; the watch wants it dealt with.",
                "Two more losses to the {creatures}, and the people of {town} are arguing over who should go into {wild}."]
        doings: {all: "arguing over who should go into {wild} after the {creatures}", role2: "showing anyone who asks where the {creatures} got them"}
        scene: quarrel
        effects:
          - {kind: danger, place: wild, value: [20, 40], days: [4, 8]}
          - {kind: prices, place: town, value: [5, 15], days: [4, 8]}
          - {kind: relation, npc: role, other: role2, value: [-12, -5], text: ["blames them for doing nothing about the {creatures}"]}
      - lines: ["The {creatures} rule {road} by night now; carts wait for daylight and go in company.",
                "{Town} has drawn in on itself: gates shut early, flocks penned in the yards, the {creatures} heard from the walls."]
        doings: {all: "keeping close to the walls and listening for the {creatures}"}
        effects:
          - {kind: danger, place: road, value: [30, 60], days: [5, 10]}
          - {kind: closed, place: wild, days: [2, 4], text: ["the {creatures}: nobody goes in"]}
    fallout:
      lines: ["The {creatures} had their fill and drew back into {wild}, leaving {town} poorer and warier.",
              "In the end the people of {town} gave up the outlying pens to the {creatures} and kept to the walls."]
      effects:
        - {kind: mark, place: town, text: ["empty pens at the edge of town, torn by {creatures}", "a burned-out hide at the edge of {wild}"]}
        - {kind: prices, place: town, value: [8, 20], days: [6, 12]}
    resolution: ["Thin the {creatures} in {wild}, or find what drew them down.", "Hunt the {creatures} back into {wild}."]
    truth: ["The {creatures} came down because something larger moved into the deep of {wild} and pushed them out; killing enough of them will send the rest back, but the deep is not empty.",
            "A hard {season} emptied {wild} of easy prey, and the {creatures} learned that {town} is easier. They will keep coming until enough of them die."]
    clues:
      - {holder: role, lines: ["I've kept animals by {wild} all my life, and I never saw {creatures} come this close. Something's moved them.",
                               "Count the tracks: more {creatures} than there were, and bigger. They didn't breed that fast. They came from deeper in."]}
      - {holder: role2, lines: ["Nobody from {town} has gone into {wild} in weeks. The {creatures} know it, too.",
                                "A hunter would tell you: when {creatures} come to the fields, it's because the woods have gone wrong."]}
    paths:
      - {kind: kill, target: creature, name: "Thin the {creatures}", how: "Kill enough of the {creatures} of {wild} that the rest draw back."}
      - {kind: contract}
    contract: {kind: hunt, what: creature, count: [2, 4]}
    reveal: ["The {creatures} are thin and scarred, driven, not hunting: something in the deep of {wild} has been at them.",
             "One of the {creatures} wears a collar of braided cord. Someone keeps them."]

  nature:
    then: {ignored: [{template: threat, weight: 2, severity: 1}, {template: mystery, weight: 1}], settled: [{template: nature_bounty, weight: 1}]}
    needs: [wild]
    fallback: natural
    abouts: ["{wild} is not what it was", "the land itself has turned", "the {season} has been strange in {wild}"]
    titles: ["{Wild} turns", "A strange {season} in {wild}", "The land about {town}", "Something wrong in {wild}", "A {season} nobody remembers in {wild}", "The ground under {town}"]
    news: ["Word from {town}: {about}.", "Travellers on {road} say {wild} has changed; nobody will say how, exactly.",
           "A {role} from {town} came back from {wild} and would not go again.",
           "Those who know {wild} say the {season} there is wrong, and will not say more.", "A {role} from {town} came back from {wild} and has not slept since."]
    stages:
      - lines: ["Something is wrong in {wild}: the game has gone quiet, the water runs the wrong colour, and the people of {town} keep to {road}.",
                "{Wild} has turned strange this {season}; a {role} from {town} says the paths they know are not where they were.",
                "Those who go into {wild} from {town} come back uneasy: the {creatures} are gone from their usual haunts, and something else is there."]
        doings: {all: "looking toward {wild} more than at their work", role: "telling anyone who will listen what they saw in {wild}"}
        at: {role: inn}
        scene: gathering
        effects:
          - {kind: danger, place: wild, value: [15, 35], days: [3, 7]}
          - {kind: mark, place: wild, text: ["the trees at the edge stripped bare on one side", "a dead stretch of water, nothing moving in it"]}
      - lines: ["The strangeness has spread to the edge of {town}: a well gone foul, animals restless, a {role2} sick from the water.",
                "{Wild} presses on {town} now; {road} is washed or blocked by it, and carts wait."]
        effects:
          - {kind: closed, place: road, days: [2, 5], text: ["the way is blocked by what {wild} has done"]}
          - {kind: prices, place: town, value: [5, 15], days: [4, 8]}
          - {kind: mood, npc: role2, text: ["sickly since the water went bad"]}
      - lines: ["{Town} has learned to live with it: {wild} is left alone, and the land about it is given up for the season."]
        effects:
          - {kind: danger, place: wild, value: [25, 50], days: [6, 12]}
    fallout:
      lines: ["{Wild} settled, in the end, as such things do; but the paths {town} knew are changed, and the old ways in are not trusted.",
              "The {season} turned and {wild} went quiet again. {Town} does not speak of it."]
      effects:
        - {kind: mark, place: wild, text: ["a changed stretch of {wild}, the old path gone"]}
    resolution: ["Find what turned {wild}, or clear what came into it.", "Go into {wild} and find the cause."]
    truth: ["The cause is in {wild} itself: a thing that was buried there has worked its way to the air, and the land about it sickens until it is found and dealt with.",
            "Something in the deep of {wild} has died, or been killed, and what fed on it is loose. The {creatures} fled first; the people of {town} are only now feeling it."]
    clues:
      - {holder: role, lines: ["I've walked {wild} forty years and I'm telling you the stream runs backwards for a stretch. Go and see if you don't believe me.",
                               "Start where the {creatures} used to den. They left for a reason, and whatever it is, it's there."]}
      - {holder: role2, lines: ["The water went bad the same week the hunters stopped going into {wild}. That's not two things.",
                                "My {role} neighbour says the birds have left {wild}. Birds know."]}
    paths:
      - {kind: find, target: wild, name: "Find the cause in {wild}", how: "Search {wild} for what turned it: it is there to be found."}
      - {kind: kill, target: creature, name: "Clear {wild}", how: "Kill what has made {wild} its own."}
      - {kind: contract}
    contract: {kind: hunt, what: creature, count: [2, 3]}
    reveal: ["Deep in {wild}, a clearing where nothing grows, and at its heart something that was dug up and should not have been.",
             "The {creatures} are not gone: they are dead, in heaps, killed by something that did not eat them."]

  natural:
    then: {ignored: [{template: economic, weight: 2, severity: 1}], settled: [{template: fortune, weight: 1}]}
    needs: []
    fallback: social
    abouts: ["the weather has turned against the fields", "the {season} came hard and early", "the harvest is in doubt"]
    titles: ["A hard {season} at {town}", "The weather turns on {town}", "Lean days in {town}", "The {season} comes early to {town}", "Empty stores at {town}", "A {role}'s ruined year"]
    news: ["The {season} has come down hard on {town}: {about}.", "A {role} from {town} says they have never seen a {season} like it.",
           "Prices in {town} are climbing with the weather.",
           "In {town} they are counting stores and finding them short.", "The {role} of {town} is selling what they can before the {season} bites."]
    stages:
      - lines: ["The weather has gone against {town}: the fields are hurt, and a {role} is counting what is left.",
                "A hard turn of {season} weather at {town}; the roads are heavy and the stores are being watched."]
        doings: {all: "out in the fields seeing what can be saved", role: "counting what is left and not liking the count"}
        scene: commotion
        effects:
          - {kind: prices, place: town, value: [8, 20], days: [4, 10]}
          - {kind: mood, npc: role, text: ["worried about the stores", "grim about the {season}"]}
      - lines: ["It is lean at {town} now: the market is thin, tempers thinner, and a {role2} is accused of hoarding.",
                "{Town} tightens its belt; the poorest are going to {neighbour} to see if it is better there."]
        effects:
          - {kind: prices, place: town, value: [10, 25], days: [6, 12]}
          - {kind: relation, npc: role, other: role2, value: [-10, -4], text: ["says they are holding back grain"]}
      - lines: ["{Town} is hungry; what the weather spared is being sold dear, and {neighbour} is sending what it can spare.",
                "{Town} is hungry; what the weather spared is being sold dear, and the {role} has shut the door on anyone asking for credit."]
        effects:
          - {kind: prices, place: town, value: [15, 30], days: [8, 14]}
          - {kind: prices, place: neighbour, value: [5, 12], days: [6, 10]}
    fallout:
      lines: ["The {season} passed and {town} came through thinner. It will be a year before the fields forgive it.",
              "{Town} got by, as it always does, and will not forget who shared and who did not."]
      effects:
        - {kind: prices, place: town, value: [5, 15], days: [10, 20]}
    resolution: ["Bring in food, or make the hoarders open their stores.", "See {town} through the lean time."]
    truth: ["There is grain enough in {town} to see it through; a {role2} is holding theirs back to sell dear when the hunger bites, and a word in the right ear would open the store.",
            "The weather did its part, but the real hurt is that {neighbour} has stopped sending; a quarrel between traders, not the sky, is starving {town}."]
    clues:
      - {holder: role, lines: ["We've had bad {season}s before. We never had the market empty by midday. Someone's selling it out the back.",
                               "Ask the {role2} how their store is so full while the rest of us scrape."]}
      - {holder: role2, lines: ["I'm not hoarding, I'm keeping back what I'm owed. Let them pay what it's worth.",
                                "The carts from {neighbour} stopped a fortnight back. That's not weather."]}
    paths:
      - {kind: persuade, target: role2, name: "Open the store", how: "Talk the {role2} into selling what they hold at a fair price."}
    contract: {kind: gather, what: good, count: [4, 8]}
    reveal: []

  social:
    then: {ignored: [{template: politics, weight: 2}, {template: social, weight: 1, severity: 1}], settled: [{template: fortune, weight: 1}]}
    needs: []
    fallback: economic
    abouts: ["a quarrel has split {town}", "an old grievance has come up again", "a wedding has set the town talking"]
    titles: ["A quarrel in {town}", "Bad blood in {town}", "Talk in {town}", "The {role} and the {role2}", "A grudge at {town}", "Sides taken in {town}"]
    news: ["In {town}: {about}.", "The {role} and the {role2} of {town} are not speaking; everyone has a side.",
           "There is a quarrel in {town} that the whole place has taken up.",
           "Nobody in {town} will sit at the same table as the {role} now.", "A quarrel in {town} has got to where the watch is called."]
    stages:
      - lines: ["A quarrel has broken out in {town} between the {role} and the {role2}; what began over a small thing has the whole place taking sides.",
                "The {role} of {town} has accused the {role2} of a wrong, in public, and the town is talking of nothing else."]
        doings: {all: "taking sides over the quarrel between the {role} and the {role2}", role: "telling their side of it to whoever is nearest", role2: "pointedly not looking across the street"}
        scene: quarrel
        effects:
          - {kind: relation, npc: role, other: role2, value: [-20, -8], text: ["wronged, and says so to anyone"]}
          - {kind: relation, npc: role2, other: role, value: [-15, -6], text: ["will not forgive the accusation"]}
          - {kind: mood, npc: role, text: ["sore about the quarrel", "angry, and enjoying it a little"]}
      - lines: ["The quarrel in {town} has hardened: friends of the {role} will not buy from the {role2}, and the watch has been called twice.",
                "Blows nearly came of it in {town}; the {role} and the {role2} were pulled apart in the street."]
        effects:
          - {kind: mood, npc: role2, text: ["bitter about the whole town"]}
          - {kind: prices, place: town, value: [3, 8], days: [3, 6]}
      - lines: ["{Town} is two camps now, and a stranger is asked which one they are for before they are sold a drink."]
        effects:
          - {kind: mark, place: town, text: ["a door painted over where someone wrote a name on it"]}
    fallout:
      lines: ["The quarrel in {town} burned down to a coldness that will last years; the {role} and the {role2} pass each other without a word.",
              "It ended as such things end in {town}: nobody won, and nobody forgot."]
      effects:
        - {kind: relation, npc: role, other: role2, value: [-10, -5], text: ["an old coldness"]}
    resolution: ["Get the {role} and the {role2} to hear each other out.", "Find what really started it."]
    truth: ["Neither of them is lying: a third person, who stands to gain from the two of them at odds, told each a different story, and the quarrel is that story's doing.",
            "The {role} is in the right and knows it, and the {role2} knows it too, and cannot say so in front of the town; pride is all that keeps it going."]
    clues:
      - {holder: role, lines: ["I'll tell you what I told everyone: I was lied to, and I know who by. The {role2} can say what they like.",
                               "Ask who was first to carry the tale across town. That's your quarrel, right there."]}
      - {holder: role2, lines: ["I'd settle it tomorrow if they'd take back what they said in front of everyone. They won't.",
                                "The {role} and I were friends before this {season}. That's what nobody says."]}
    paths:
      - {kind: persuade, target: role, name: "Talk the {role} round", how: "Get the {role} to make the first move."}
      - {kind: persuade, target: role2, name: "Talk the {role2} round", how: "Get the {role2} to take back what was said."}
    contract: null
    reveal: []

  economic:
    then: {ignored: [{template: economic, weight: 1, severity: 1}, {template: politics, weight: 1}], settled: [{template: trade, weight: 1}]}
    needs: []
    fallback: social
    abouts: ["a merchant's coin has gone missing", "the market has turned", "a debt has come due"]
    titles: ["Coin trouble in {town}", "The market at {town}", "Debts in {town}", "The price of {good} in {town}", "A {role}'s debt", "Hard bargains at {town}"]
    news: ["The talk of {town}: {about}.", "Traders on {road} say {town} is not paying its debts.", "There is money trouble in {town}; the {role} is at the heart of it.",
           "The {role} of {town} owes more than the town can lend.", "Coin is short in {town}; {good} sells for what the seller likes."]
    stages:
      - lines: ["Coin is tight in {town}: a {role} cannot pay what is owed, and the ones owed are getting loud.",
                "Something has gone wrong with the money in {town}; the {role} says they were cheated, and the {role2} says they were not."]
        doings: {all: "talking of debts, and who owes whom", role: "avoiding the people they owe"}
        scene: quarrel
        effects:
          - {kind: prices, place: town, value: [5, 15], days: [4, 8]}
          - {kind: relation, npc: role, other: role2, value: [-12, -5], text: ["is owed, and says so"]}
      - lines: ["Debts are being called in across {town}; a shop has shut its door, and the {role2} has gone quiet.",
                "The money trouble in {town} has reached the market: stalls empty, credit gone, the {role} selling off tools."]
        effects:
          - {kind: prices, place: town, value: [8, 20], days: [6, 10]}
          - {kind: mood, npc: role2, text: ["cornered about money"]}
      - lines: ["{Town} is poorer for it; what was a shop is a shut door, and the ones who lost are talking of leaving for {neighbour}.",
