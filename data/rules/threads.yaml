  mystery:
    needs: [wild]
    fallback: social
    abouts: ["lights have been seen where there should be none", "someone has gone missing", "an old story has started coming true"]
    titles: ["Lights in {wild}", "What walks by {town}", "The matter of {wild}"]
    news: ["What they say in {town}: {about}.", "Something has been seen at night between {town} and {wild}; nobody agrees on what.",
           "A {role} from {town} saw something in {wild} and has not been the same since."]
    stages:
      - lines: ["There are lights in {wild} at night, seen from {town}, and footprints in the morning that lead nowhere; a {role} will not go out after dark.",
                "Something has been taken from {town}, something nobody would want, and the tracks lead toward {wild}."]
        effects:
          - {kind: mark, place: wild, text: ["a ring of stones at the edge, newly set", "scorch marks where no fire was built"]}
          - {kind: mood, npc: role, text: ["frightened, and not saying of what"]}
      - lines: ["The strangeness has come closer: a {role2} in {town} woke to find the door open and the hearth cold, and the lights in {wild} were nearer.",
                "The {creatures} have fled {wild}; whatever is there has emptied it, and {town} hears it at night."]
        effects:
          - {kind: danger, place: wild, value: [20, 45], days: [4, 8]}
          - {kind: fact, text: ["There is something in {wild} that the people of {town} will not name."], groups: [locals]}
      - lines: ["{Town} has stopped speaking of {wild} at all, which is how you know how bad it is."]
        effects:
          - {kind: closed, place: wild, days: [2, 5], text: ["nobody from {town} will go in, or let you"]}
    fallout:
      lines: ["The lights in {wild} stopped as suddenly as they began. {Town} has agreed to say they were never there.",
              "Whatever it was had what it wanted from {town} and went back into {wild}. The door it used is still open."]
      effects:
        - {kind: mark, place: wild, text: ["a place in {wild} the animals go round"]}
    resolution: ["Go into {wild} at night and find what makes the lights.", "Find what was taken and where it went."]
    truth: ["The lights are a person: someone from {town}, long thought gone, living in {wild} and taking what they need; the fear is doing more harm than they are.",
            "There is a thing in {wild} that was sealed, and the seal is breaking; the lights are its first reaching out, and the {creatures} fled it. It can be found and dealt with, if someone goes."]
    clues:
      - {holder: role, lines: ["I saw it. A light, low down, moving the wrong way for a lantern. I'm not going back out there.",
                               "The {creatures} are gone from {wild}. In my lifetime that never happened. Something they fear is there."]}
      - {holder: role2, lines: ["It took the old things. Not the coin, the old things. What wants old things?",
                                "Someone in {town} knows more than they say. Watch who doesn't look toward {wild}."]}
    paths:
      - {kind: find, target: wild, name: "Find what is in {wild}", how: "Go into {wild} and find the maker of the lights."}
      - {kind: kill, target: creature, name: "Kill what haunts {wild}", how: "Whatever emptied {wild} must be put down."}
      - {kind: contract}
    contract: {kind: hunt, what: creature, count: [1, 2]}
    reveal: ["Among the beasts you killed, one is wrong: no eyes, and a brand on its flank in letters nobody in {town} reads.",
             "The den is a camp, and the camp has a bed in it, slept in last night."]

