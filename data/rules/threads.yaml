        - {kind: prices, place: town, value: [5, 12], days: [8, 14]}
        - {kind: mark, place: road, text: ["a new cut through {wild} where the old road was lost"]}
    resolution: ["Find a way through {wild}.", "Clear what {wild} has put across {road}."]
    truth: ["There is a way through {wild}: an old track above the road that the {role} knows and will not say, because they want the town to pay them to cut it.",
            "{Wild} crossed the road because something in it was disturbed: the {creatures} drove the earth or the water down, and until they are thinned it will keep coming."]
    clues:
      - {holder: role, lines: ["There's a track above the road. Old. I walked it as a boy. I could find it again, for a price.",
                               "The road's not lost, only buried. Hands would do it. Nobody here has the stomach."]}
      - {holder: role2, lines: ["I sold what I had to those who could pay. That's not a crime. Starving would be.",
                                "It came down the week the {creatures} started moving. Mark that."]}
