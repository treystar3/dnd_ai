           "Three people in {town} who went to {wild} have started saying the same words, together.",
           "There is a voice in {wild}, they say in {town}; those who hear it go back.", "A {role} in {town} walked out at night toward {wild} and had to be brought home tied."]
    stages:
      - lines: ["A {role} from {town} came back from {wild} different: quiet, sleepless, standing at the window at night facing the wood.",
                "Two who went into {wild} from {town} have come back speaking the same words, and they have never met."]
        effects:
          - {kind: mood, npc: role, text: ["far away, since {wild}", "listening to something nobody else hears"]}
          - {kind: mark, place: wild, text: ["a place at the edge where the ground is bare in a circle"]}
      - lines: ["More of {town} has caught it: a {role2} walked toward {wild} at midnight and was stopped at the gate, and the ones already changed are gathering.",
                "The changed in {town} are going back to {wild} by night in twos and threes; the {role2} who followed them came home and will not say what they saw."]
        effects:
          - {kind: mood, npc: role2, text: ["frightened of what they followed to {wild}"]}
          - {kind: danger, place: wild, value: [15, 35], days: [4, 8]}
          - {kind: fact, text: ["Something in {wild} calls people from {town}, and the ones who hear it go."], groups: [locals]}
      - lines: ["{Town} bars its doors at dusk now, from the inside and the outside both; the changed walk to {wild} at night and come back at dawn with nothing to say.",
                "Half of {town} will not look at {wild}, and the other half cannot stop."]
        effects:
          - {kind: closed, place: wild, days: [2, 5], text: ["the changed go in; nobody else dares"]}
          - {kind: mark, place: town, text: ["doors with bars on the outside, where a family keeps someone in"]}
    fallout:
      lines: ["It passed, as a fever passes; the changed of {town} woke one morning themselves again and could not say where they had been.",
              "{Town} buried two who walked into {wild} and did not come back, and the rest came slowly home to themselves."]
      effects:
        - {kind: mark, place: wild, text: ["a path worn to a place in {wild} by many feet, all going one way"]}
    resolution: ["Go into {wild} and find what calls.", "Find what the changed heard, and silence it."]
    truth: ["There is something in {wild} that speaks to those who come near it; it wants to be dug out, and the changed are its hands. Found and broken, it will stop.",
            "The changed have found something in {wild} and are keeping it to themselves: a hoard, or a door, and the silence is theirs, not a spell's."]
    clues:
      - {holder: role, lines: ["It isn't words. It's a want. You'll hear it too if you go past the bare ground. Go past it anyway.",
                               "We dig. At night. I don't know for what. I know where."]}
      - {holder: role2, lines: ["I followed them to a hollow in {wild}. They were on their knees. Something under them was humming.",
                                "They're not mad. They answer when they're spoken to. They're just elsewhere."]}
    paths:
      - {kind: find, target: wild, name: "Find what calls in {wild}", how: "Follow the changed into {wild} and find what they go to."}
      - {kind: persuade, target: role, name: "Reach the {role}", how: "Get the {role} to say what they hear."}
      - {kind: kill, target: creature, name: "Kill what waits in {wild}", how: "Whatever has made {wild} its own: put it down."}
    contract: null
    reveal: []

