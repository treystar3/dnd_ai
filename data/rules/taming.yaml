# TAMING - a companion class can bind a wild creature it has beaten down, as another companion.
# Only the engine rolls this. The model reads "tame the wolf" and describes the moment.

# Creature categories that can be tamed. People, lycanthropes and the like cannot.
categories: [beast, monstrosity, dragon, elemental, fey, celestial, plant, construct, ooze, undead]

# The target must be at or below this share of its health (a creature fights free of you while it is strong).
max_health_share: 0.35
# The creature may be at most this many levels above you.
level_margin: 5
# Bosses and uniques cannot be bound.
refuse_ranks: [boss]

# Chance: base + per point of the better of wisdom and charisma, minus the creature's rarity and size.
base_chance: 0.30
per_attribute: 0.002
rarity_penalty: {common: 0, uncommon: 0.08, rare: 0.18, legendary: 0.40}
size_penalty: {Tiny: 0, Small: 0, Medium: 0, Large: 0.04, Huge: 0.10, Gargantuan: 0.20}
min_chance: 0.10
max_chance: 0.90

# How many tamed companions a character can keep: base, plus one for every this-many levels.
cap: {base: 1, per_levels: 30}

# How many companions can fight at once: base, plus one for every this-many levels. The strongest answer the call.
active: {base: 1, per_levels: 50}
