# PASSIVE MECHANICS - passives that change how things work, not just a percentage.
# The skill generator picks from this list and gives each a name and description in the class's own theme.
# The engine runs them (engine/combat.py for combat, scenes/world.py for world).
#
# kind:     combat | world
# values:   [light, moderate] - the strength at each tier. Use the same number twice for on/off mechanics.
# text:     what it does, shown to the player and the generator. {value} is replaced by the tier's value.
# companion_only: only offered to classes that rely on companions
# suits:    fit tags for character creation, same as stats.yaml

