    - {text: "hammering a horseshoe, four blows and a turn", when: [morning, midday, afternoon]}
    - "quenching something in the trough with a hiss and a cloud of steam"
    - {text: "filing the edge off a hinge at the bench", when: [afternoon, evening]}
    - "shoeing a horse that keeps shifting its weight"
    - {text: "raking the forge down for the night", when: [evening, night]}
