# DOINGS (f348, engine/doings.py): what a person is doing when the player sees them. The engine picks one for each person present from
# their role's list, by the time of day, no two people in a place doing the same thing, and picks again when the period of the day
# turns (dawn, morning, midday, afternoon, evening, night...) and on another day. The model is never asked what someone is doing: it
# writes only the look. Before this, every armed person in a town was sharpening a blade, for good, because a model asked for "what they
# are doing" reaches for the same thing and nothing ever changed it.
#
# (f375) Each entry is a plain fact of two to five words, the way a passer-by would name it: "shoeing a horse", "fletching arrows". No
# second clause, no figure of speech, no pronoun. The first set were little pieces of prose ("fletching an arrow with a goose feather
# held in the teeth", "hammering a horseshoe, four blows and a turn"); the narrator, told not to reuse wording, paraphrased them and
# scrambled their parts ("binds a goose feather to a shaft between her teeth", "holds a restless horse steady against an anvil").
# A doing reaches only the narrator (and its frames), the person themselves as RIGHT NOW, and the reader of the player's words, so a
# line like "the man shoeing the horse" finds him; nobody else who speaks is told what others are doing.
#
# An entry is a phrase in the present participle with no subject, or {text, when, weight}: `when` lists the periods it may be chosen in
# (any, when absent), `weight` its share (1 when absent).

# by_person (f380): a person the world was written around keeps doings of their own, ahead of their role's: Maren carries a greatsword
# and waits on her own party, and the contractors' list had her counting a handful of arrows. Keyed by the person's id.

anyone:                       # for a role with no list of its own, and when a role's list is spent
  - "talking with a neighbour"
  - "carrying a basket"
  - "mending a fence"
  - "eating bread"
  - "watching the road"
  - "shouting at a dog"
  - "sitting on a step"

