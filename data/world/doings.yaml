# DOINGS (f348, engine/doings.py): what a person is doing when the player sees them. The engine picks one for each person present from
# their role's list, by the time of day, no two people in a place doing the same thing, and picks again when the period of the day
# turns (dawn, morning, midday, afternoon, evening, night...) and on another day. The model is never asked what someone is doing: it
# writes only the look. Before this, every armed person in a town was sharpening a blade, for good, because a model asked for "what they
# are doing" reaches for the same thing and nothing ever changed it.
#
# An entry is a phrase in the present participle with no subject ("checking a carter's papers at the gate"), or {text, when, weight}:
# `when` lists the periods it may be chosen in (any, when absent), `weight` its share (1 when absent). Keep them concrete and small: a
# thing a passer-by would see. The same wording reaches the narrator, the frames and the person's own replies as RIGHT NOW.

anyone:                       # for a role with no list of its own, and when a role's list is spent
  - "talking with a neighbour across a fence"
  - "carrying a basket somewhere in a hurry"
  - "mending something that will not stay mended"
  - "eating with one hand and working with the other"
  - "watching the road with nothing better to do"
  - "shouting at a dog that is not listening"
  - "sitting on a step with a mug, done for now"

by_role:
  farmer:
    - {text: "yoking an ox that would rather not", when: [dawn, morning]}
    - {text: "walking a furrow, head down, looking for what the birds left", when: [morning, midday]}
    - {text: "eating bread and cheese on the headland of the field", when: [midday]}
    - {text: "mending a gate that a cow went through", when: [afternoon]}
    - {text: "driving a cart of muck out to the fields", when: [morning, afternoon]}
    - {text: "arguing with the miller's boy over a short sack", when: [afternoon, evening]}
    - "scraping mud off a boot with a stick"
  shepherd:
    - {text: "counting a flock through a gap in the wall", when: [dawn, morning, evening]}
    - "whistling a dog round to the far side of the flock"
    - {text: "holding a ewe down to look at a bad foot", when: [morning, midday, afternoon]}
    - "leaning on a crook, looking at the hills as if they owed him money"
    - {text: "shearing in a pen, wool to the elbows", when: [midday, afternoon]}
    - "carrying a lamb under one arm"
  hunter:
    - {text: "coming in with a brace of birds on a cord", when: [morning, midday]}
    - "fletching an arrow with a goose feather held in the teeth"
    - {text: "skinning a hare on a stump", when: [afternoon, evening]}
    - "reading tracks in the mud at the edge of the road and not liking them"
    - {text: "greasing a bowstring by a fire", when: [evening, night]}
    - "arguing the price of a pelt with someone who does not want it"
  herbalist:
