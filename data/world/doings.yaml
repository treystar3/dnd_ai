    - "tying bunches of something green to a rafter to dry"
    - "grinding roots in a mortar, lips moving over a count"
    - {text: "pouring a dark syrup into little bottles", when: [afternoon, evening]}
    - "smelling a handful of leaves and throwing half of them away"
    - "writing a label with a pen that keeps blotting"
