# The quest Orenna: the quest that opens at level 50 when the player says Orenna's name to someone.
# Every word the player reads in the ruin and in the scenes is fixed here, so the truth is the same every time. The engine owns
# the order of steps, the places, the fights and the reward; the model never decides what the truth is.

gate: {level: 50, contact_hours: [24, 48]}
keeper_city: valecourt
coin: {id: order_coin, name: the half-circle coin, description: "A small coin stamped with a half-circle and a single line cut straight down through it. The mark of those who remember."}
contact_name: Odrin Kesh

contact:
  arrive: >
    A stranger in a plain coat steps out of the crowd and stops an arm's length from you, an ordinary face you would forget at
    once. Between two fingers they hold up a small coin: a half-circle, with a single line cut straight down through it.
  ask: "You said a name. In your sleep, or at an altar, it does not matter which. I need to know how you came by it."
  after: >
    The stranger listens without moving. When you finish, something in their shoulders lets go, as if they have carried a weight
    a long way and only now found where to put it down.
  speech:
    - "No one living has heard that name in thousands of years. We have been careful about who we trust with it. I will not ask you to believe me. I will ask you to come and look."
    - "There is a hall under the hills, built by the first people who ever woke. The gods never found it. I can take you there now. I am Odrin Kesh."
  decline: "Then I will stay near. When you are ready, say so."
  go: "The road is long, and we will not stop. Stay close."
  travel_minutes: 2880

ruin:
  place: first_hall
  name: the First Hall
  theme: ruin
  boss_name: the Warden of the Forgetting
  floors:
    - title: The servants
      chambers:
        - {kind: fight, creature: hall_servant, count: 3, name: ""}
        - {kind: cache}
        - {kind: fight, creature: hall_guardian, count: 1, name: ""}
      mural: >
        The first walls are carved with the peoples of Rivia as you know them: elves, dwarves, humans, goliaths, orcs, gnomes. But
        they stand in rows of identical figures, hands at their sides and eyes empty, tending fires, fields and forges. Above each
        row a single large figure is carved, a god, one to each trade. Nothing here is carved as worship. Nothing here is carved as
        love. The temples teach that the gods shaped the peoples out of love. These walls say the peoples were made to work, and did.
      lore: orenna_servants
    - title: The gift
      chambers:
        - {kind: fight, creature: hall_servant, count: 3, name: ""}
        - {kind: trap}
        - {kind: fight, creature: hall_guardian, count: 1, name: ""}
      mural: >
        On the second floor a woman kneels among the rows. Her face has been carved with great care, by hands that loved the
        work. She breathes into the open mouth of one empty figure, and the next carving shows its eyes alight. Then the next, and
        the next, down a long wall, row after row, until the whole wall is awake and no two faces are alike. Her hands are open,
        and the carvers have left her a small, plain crown of leaves. Beneath her the first word anyone ever chose is carved
        over and over: a name. It is the name you were given in the dark. Orenna.
      lore: orenna_gift
    - title: The revolt
      chambers:
        - {kind: fight, creature: hall_guardian, count: 2, name: ""}
        - {kind: rest}
        - {kind: fight, creature: hall_guardian, count: 1, name: "the Gods' Sentinel", boss: true}
      mural: >
        The third floor is fire and spears. The freed peoples have turned on the gods who made them, and they are carved without
        mercy and without shame: refusing, striking, standing. Above them the gods are shown for the first time with their faces
        turned down in surprise. A long wall shows what came next. The gods do not destroy the peoples, because the peoples are
        what they have left. They bind the woman instead. She is carved looking back, once, over her shoulder, at the ones who
        woke. That is the last place her face is carved in this hall.
      lore: orenna_revolt
    - title: The long forgetting
      chambers:
        - {kind: fight, creature: hall_guardian, count: 2, name: ""}
        - {kind: cache}
        - {kind: fight, creature: forgetting_warden, count: 1, name: "the Warden of the Forgetting", boss: true}
      mural: >
        The last floor is thousands of years of one patient task. The gods are carved at their work, not in anger now but with
        great care: raising temples that teach a gentler story, moving borders, quietly ending her worship in every place it
        survived, and cutting her name from every wall. Where the chisel missed, someone has scratched it back in by hand. At the
        far end is a door of plain stone, carved with a single line, a place between breath and dust. You know it. It is where
        she is. It is the room where you met her.
      lore: orenna_forgetting
  after_speech:
    - "That is all of it that anyone has ever been able to find. We cannot read what lies past that door. You have stood on the other side of it."
    - "There are others who remember, and I will take you to them. But understand what you will be asking of yourself. Everyone who has tried to tell this aloud is dead."
  to_order: "Come to {city}. Ask for the cooper's cellar. Show them the coin."
  coin_given: "They press the half-circle coin into your palm."

order:
  arrive: >
    Under a cooper's shop the cellar is lit by a single lamp. Seven people sit among the barrels, each with the same small coin
    on the table in front of them. They look at yours, and at you, and nobody speaks until the oldest of them does.
  speech:
    - "There were thirteen of us. We have never stood against anyone. We have only tried to tell people what is written in the ruins."
    - "Each time one of us has stood up in a market, or written to a temple, or taught it at a school, they were dead within days. No struggle. Nothing taken. Their eyes closed."
    - "We want to know who is doing it. We think you may be the first person we can ask, because you are the first the gods' silence has not touched."
  task: "Find out who is killing us, and why. Three of the dead are yours to start with, in {t1}, {t2} and {t3}."
  lore: orenna_order

trails:
  - id: lecturer
    city_slot: 0
    arrive: "In {city}, a scholar named Brannoch Ule lectured on the old ruins to a hall of students. The next morning he was found in his bed."
    check: perception
    results:
      strong success: "You find what the watch missed: the window latched from outside, the eyes closed by someone's hand, and, on the sill, a single wet thumbprint of ash-grey cloth. A watchman, shown the coin, admits he saw a man in plain undyed cloth leave at dawn, weeping."
      success: "You find the eyes were closed by a careful hand, nothing taken, nothing broken. A watchman tells you he saw a man in plain cloth leave at dawn. He thought the man was crying."
      partial: "The room has been tidied by someone gentle. Nothing is missing. That is all you can find."
      failure: "The room is clean, the watch has cleared it, and whatever it held is gone."
    lore: orenna_trail_lecturer
  - id: letter
    city_slot: 1
    arrive: "In {city}, a woman named Perrin Aldahl wrote to the temple of her city, laying out what she had read in the ruin. She died within the week."
    check: insight
    results:
      strong success: "The temple clerk breaks and tells you everything: the letter was copied that same day and sent on to the High Keeper's office at Valecourt. The reply came back before the week was out, and it was one word: 'Proceed.'"
      success: "The clerk admits the letter was sent on to Valecourt, to the office of the High Keeper. A reply came back in four days. He will not say what it said."
      partial: "The clerk says only that the letter went on to a higher office. He will not say which."
      failure: "The clerk says the letter was filed, and shows you an empty drawer."
    lore: orenna_trail_letter
  - id: warning
    city_slot: 2
    arrive: "In {city}, a young man named Tessaly Murn sent a warning to a friend in a far city. He was dead before any rider could have reached it."
    check: lore
    results:
      strong success: "You work out how it could be done: every temple of the Sun Warden keeps a ledger of what its faithful say, and sends a summary up to Valecourt on a fast relay. Whoever reads those ledgers knew before anyone else could."
      success: "You find that the faith's temples report to one office, and that the reports travel faster than any ordinary rider. Someone read the warning before its own recipient."
      partial: "You learn the message arrived late. Someone else read it first, and you cannot say who."
      failure: "The courier records are missing a page, and you cannot say whose hand removed it."
    lore: orenna_trail_warning

executioner:
  arrive: >
    You are too late by minutes. In the room, a man in plain undyed cloth kneels beside a body, closing its eyes with two fingers.
    He is tall and quiet and older than he first looks, and he moves like someone who has done this too many times to hurry. He
    does not reach for the weapon at his belt. He does not look up until he has finished.
  speech:
    - "Forgive me. I did not choose this. I never do."
    - "You are the one who has been asking. I was not sent for you. No one has told me to touch you, and so I will not. I kill who I am commanded to kill, and no one else. I wish that were a comfort."
    - "I cannot tell you who holds my seal. The oath forbids it, and my god would turn from me if I broke it. I swore to obey, for a debt of my own, a long time ago. I have kept my word. It is all I have left, and it is not much."
    - "Leave them in quiet, when you go."
  press: "Will you press him, and see if he will be taken? (y/n)"
  warn: "You may try. I would rather you did not."
  leave: "He rises, bows his head to the dead, and walks out. He does not look back."
  fight_intro: "He draws without hatred and without hurry, and looks at you the way a man looks at a weight he has been handed."
  yield_at: 0.25
  yield_story: "the bound man lowers his weapon, bleeding, then drops, strikes the floor with his palm, and a flash of pale light fills the room; when it clears he is gone"
  yield: "He lowers his weapon, bleeding. For a moment the sorrow in his face is plain, and then he drops, strikes the floor with his palm, and a flash of pale light fills the room. When your sight clears, the window is open, the curtain is still swinging, and there is no trace of him on the street below."
  lore: orenna_executioner

registry:
  arrive: >
    The register of bound services at Valecourt is kept in a cool archive beneath the royal chapel. The clerk who guards it owes
    you nothing and knows it. What you need is a sworn man, a champion of the Sun Warden, bound for life to the holder of a seal.
  check: lore
  results:
    strong success: "The page has been cut and replaced with a new one, but the binder's thread is the old thread. The seal-maker's own ledger names the holder: the High Keeper of Valecourt, who has held it for twenty-two years."
    success: "The holder's name has been scraped from the register, but the seal-maker's ledger lists it: the High Keeper of Valecourt."
    partial: "The register is wrong in a way you can see but not read. Combined with the letters and the ledgers you already have, it can only mean one office."
    failure: "The register has been burned along one edge. You will have to confront him without it."
  lore: orenna_registry

confront:
  arrive: >
    The High Keeper receives you in the chapel after the last bell, alone. He is an old man in a white robe with a gold sunburst
    at the throat, and he has been expecting you for some time. A man in plain undyed cloth stands in the shadow behind him.
  speech:
    - "Forgive the setting. I find I think better where the oaths of this kingdom were sworn."
    - "You have come about the dead. I have wept for every one of them. I will weep for the next. And I would send for the next if I had to, because I know what you are going to say, and I know what it would cost."
    - "Tell the peoples they were made as servants. Tell them the oaths sworn in the Sun Warden's name were sworn to a thing that lied to them. What do you think happens to every promise made in this kingdom, to every contract and every marriage and every sworn word that holds a man's hand from his neighbor's throat? I have held this kingdom together with a seal and a lie, and I would hold it for a thousand years more."
    - "You are half right about me. I know what I have become. It does not change what is true. Stand aside."
  strong_evidence: "You lay out the letters, the ledgers and the register, one by one, and with each the High Keeper's authority drains. By the end he has no witnesses left in the chapel at all."
  begin: "He closes his hand around a seal on his wrist, and the man in plain cloth draws his weapon."
  lines:
    intro: "{name} lifts the seal. 'I am the oath of this kingdom. Break it, and see what is left.'"
    bloodied: "{name} laughs, thin and cracked. 'You think I fear the truth? I fear the dark behind it, and I will not let it in.'"
    last_stand: "{name} stands on a floor of his own blood. 'No. A kingdom does not end because a stranger asks it to.'"
    fall: "{name} falls, and the seal slips from his fingers, and something in the room goes quiet."
  seal:
    ask: "The seal glints on the High Keeper's wrist. You could try to wrest it free while he is hurt. (y/n)"
    success: "You close your hand on the seal and wrench it from his wrist. The man in plain cloth stops mid-stroke and lowers his weapon, and the oath that bound him is simply gone. He looks at you for a long moment, bows his head, and leaves the chapel without a word."
    failure: "The seal burns your hand and tightens on his wrist. The man in plain cloth takes a step toward you, and his blows fall harder."
    quiet: "The man in plain cloth never leaves the High Keeper's shadow. He fights because he must."
  after:
    - "The chapel is very quiet. The seal lies in your hand. Whatever the oaths of this kingdom were worth, they are worth whatever the people make of them now."
    - "Odrin Kesh finds you in the street the next morning. 'We will decide what to do with it,' they say. 'It will take us years. You have given us the years.'"

blessing:
  name: Orenna's Last Breath
  text: "The first time a blow would kill you, you are restored to full health and mana instead. Then the blessing is gone."
  arrive: >
    That night you dream, or you do not. The light is thin and the cold is faint, and the voice is so tired that you lean toward it.
  line: "You said it. I heard."
  gain: "Orenna's Last Breath is yours."
  spent: "Something warm that has been holding your breath for you lets go, and is gone. It was only ever meant to be used once."
  lore: orenna_last_breath
