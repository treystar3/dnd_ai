# Roles NPCs can hold. Used when places generate their residents.
#
# description:      what the role means here - guides generation of the person.
# buys:             what they will buy from the player: herb, food, consumable, hide, metal, cloth, wood, bone,
#                   weapon, armor, jewelry, or any. buy_rate overrides the default share of value they pay.
# stock:            gear they keep for sale, replaced every restock_days (families: metal, hide, cloth, wood)
# craft_skill:      how good their commissioned work is (0-100, like the player's crafting skill)
# commissions:      material families they will make gear from to order
# sells:            what they sell, at fixed prices in copper (100 copper = 1 silver). kind room lets the player
#                   sleep there; meal and drink restore a little stamina and health.
# knowledge_groups: what someone in this role knows, on top of "everyone" and their local group.
# hours:            [start, end] when they are at their place. End can pass 24 (25 = 1am).
#                   Outside these hours they are home and can't be found there.

- {id: farmer, hours: [6, 18],        description: Works the fields around the village.,                 knowledge_groups: []}
- {id: shepherd, hours: [6, 18],      description: Keeps sheep on the hills.,                           knowledge_groups: [shepherds]}
- {id: hunter, hours: [5, 17],        description: Hunts and traps at the forest edge.,                 knowledge_groups: [hunters],
   buys: [hide, bone, food],
   stock: {families: [hide], count: 4, restock_days: 4},
   craft_skill: 30, commissions: [hide]}
- {id: herbalist, hours: [8, 17],     description: Gathers plants and makes remedies.,                  knowledge_groups: [],
   sells: [{id: healing_draught, name: a healing draught, price: 150, kind: item, item: healing_draught},
           {id: mana_tonic, name: a mana tonic, price: 150, kind: item, item: mana_tonic},
           {id: bandage, name: a bandage, price: 20, kind: item, item: bandage}],
   buys: [herb, consumable]}
- {id: smith, hours: [7, 18],         description: Works the forge - tools, hinges, horseshoes, the odd blade., knowledge_groups: [],
   buys: [metal, weapon, armor],
   sells: [{id: bronze, name: a bronze bar, price: 40, kind: material, item: bronze},
           {id: iron, name: an iron bar, price: 90, kind: material, item: iron}],
   stock: {families: [metal], count: 8, restock_days: 3},
   craft_skill: 40, commissions: [metal]}
- {id: miller, hours: [7, 18],        description: Runs the mill on the river.,                         knowledge_groups: []}
- {id: baker, hours: [5, 14],         description: Bakes bread for the village and travelers.,          knowledge_groups: [],
   sells: [{id: trail_ration, name: a trail ration, price: 15, kind: item, item: trail_ration}],
   buys: [food, herb]}
- {id: chandler, hours: [8, 17],      description: Sells candles, rope, oil and sundries.,              knowledge_groups: [merchants],
   sells: [{id: bandage, name: a bandage, price: 20, kind: item, item: bandage},
           {id: trail_ration, name: a trail ration, price: 15, kind: item, item: trail_ration}],
   buys: [cloth, wood]}
- {id: tinker, hours: [8, 17],        description: Mends pots and small goods; travels the road between towns., knowledge_groups: [merchants],
   buys: [any], buy_rate: 0.25,
   stock: {families: [wood], count: 4, restock_days: 5},
   craft_skill: 30, commissions: [wood]}
- {id: watch_captain, hours: [7, 19], description: Commands the village watch.,                         knowledge_groups: [guards]}
- {id: guard, hours: [0, 24],         description: Serves in the village watch.,                        knowledge_groups: [guards]}
