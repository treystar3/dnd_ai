    Villagers have long paid a hidden tribute of livestock, then coin, to something in the hills. A go-between profits and a drake
    demands more each year. Break the arrangement by learning who set it up and facing what takes the tithe.
  contacts: [shepherd, farmer, elder, merchant, hunter, innkeeper]
  mix: {contact: 3, site: 1, lair: 1}
  leaders: [lesser_drake, drake, wyvern, elder_drake, young_red_dragon]
  minions: [kobold, bandit, lizardfolk]
  minion_name: tribute guard
  lair_desc: a go-between's guarded cache
  boss_desc: the drake's lair
  site_desc: a tithe-stone or a stripped pasture
  effect: {kind: danger, value: 20}

- id: silent_forest
  board: "Investigate: {subject}, near {place}"
  subjects: ["birdsong gone from a forest", "animals fleeing a woodland", "a hunt that finds nothing"]
  subject_kind: matter
  truth: >
    The animals are fleeing a woodland because of three things: poachers, a fouled spring, and something old and hungry stirring beneath it.
    Trappers and wardens have pieces of the story; the heart of it lies at the spring.
  contacts: [hunter, trapper, lumberjack, elven_warden, herbalist, scout]
  mix: {contact: 2, site: 2, lair: 1}
  site_checks: [perception, lore]
  leaders: [green_hag, awakened_tree, shambling_mound, treant, hydra]
  minions: [worg, awakened_shrub, giant_rat]
  minion_name: stricken beast
  lair_desc: a poachers' camp
  boss_desc: the fouled spring and what stirs beneath
  site_desc: a stripped glade, spoor or a poisoned pool
  effect: {kind: danger, value: 15}

- id: broken_wardstones
  board: "Investigate: {subject}, near {place}"
  subjects: ["standing stones found toppled", "ward-stones knocked down one by one", "an old line of stones broken at night"]
  subject_kind: matter
  truth: >
    The standing stones that kept monsters from the roads are being toppled by saboteurs working for something that wants the way open.
    The player must find the saboteurs and re-light the stones before the line breaks.
  contacts: [elder, priest, stonemason, scout, water_priest, hunter]
  mix: {contact: 2, site: 3, lair: 1}
  site_checks: [lore, perception]
  leaders: [cult_fanatic, berserker, ogre, troll, oni]
  minions: [goblin, bandit, orc]
  minion_name: saboteur
  lair_desc: a camp of saboteurs
  boss_desc: the place where the saboteurs' master works
  site_desc: a toppled ward-stone to be raised and re-lit
  effect: {kind: danger, value: 20}

- id: storm_caller
  board: "Investigate: {subject}, over {place}"
  subjects: ["freak storms ruining the harvest", "hail in high summer", "lightning that follows a road"]
  subject_kind: matter
  truth: >
    A hermit with a stolen artifact is calling storms - at first by accident, now to punish those who wronged him.
    Farmers, fishers and priests see the pattern; the hermit's tower lies at its centre.
  contacts: [fisher, farmer, elder, water_priest, bargeman, priest]
  mix: {contact: 3, site: 1, lair: 1}
  site_checks: [perception, lore]
  leaders: [druid, air_elemental, djinni]
  minions: [sprite, dust_mephit, steam_mephit]
  minion_name: storm-sprite
  lair_desc: a place where the weather turns wild
  boss_desc: the hermit's storm-wracked tower
  site_desc: a scorched field or a lightning-struck stone
  effect: {kind: prices, value: 20}

- id: wyrm_hoard_map
  board: "Investigate: {subject}, said to be near {place}"
  subjects: ["a treasure map torn in four", "four pieces of a map to a dragon's hoard", "a hoard-map shared among rivals"]
  subject_kind: object
  truth: >
    A map to a dragon's hoard was torn in four, each piece held by a rival with their own reasons. The player must win the pieces by bargain, theft or
