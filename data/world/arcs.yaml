  subjects: ["a hired company that stopped defending the pass", "sellswords who changed sides", "a garrison that opened the gate"]
  subject_kind: matter
  truth: >
    A mercenary company hired to hold a pass has been bought by a rival and now lets raiders through. Some of its sworn
    soldiers are loyal and unhappy, and a paymaster holds the proof. Their captain can be shamed or beaten.
  contacts: [guard, watch_captain, scout, innkeeper, quartermaster, merchant]
  mix: {contact: 3, lair: 2}
  finale: confront
  confront_checks: [intimidation, persuasion, insight]
  leaders: [veteran, knight, gladiator]
  minions: [bandit, berserker]
  minion_name: sellsword
  lair_desc: a sellsword picket
  boss_desc: the mercenary captain's keep
  effect: {kind: danger, value: 25}

- id: siege_breaker
  tags: [raider]
  board: "Help wanted: {subject}, near {place}"
  subjects: ["a besieged town needs relief", "a border town under siege", "a hold cut off by a besieging host"]
  subject_kind: matter
  truth: >
    A town is besieged and its lord's calls for help were intercepted. The player must win allies in several towns - a
    caravan master's grain, a captain's riders, a priest's blessing - and bring them to break the siege, ending with a battle at the siege lines.
  contacts: [noble, elder, watch_captain, caravan_master, priest, merchant, quartermaster]
  mix: {contact: 5, lair: 1}
  leaders: [bugbear, ogre, ettin, hill_giant, stone_giant, frost_giant]
  minions: [goblin, hobgoblin, orc, gnoll, bugbear]
  minion_name: besieger
  lair_desc: a besiegers' picket
  boss_desc: the siege lines of the besieging host
  effect: {kind: danger, value: 20}

- id: succession_murders
  board: "Protect: {subject}, last at {place}"
  subjects: ["the last living heir of a minor house", "the youngest of three heirs", "a noble's only surviving child"]
  truth: >
    Heirs of a great house are dying one after another and the last living one is in danger. The killer works through
    servants and hired blades and is protecting an inheritance that is not theirs. The player must find who is behind it before the last heir falls.
  contacts: [courtier, noble, guard, royal_guard, priest, server]
  mix: {contact: 4, site: 1}
  site_in: town
  site_checks: [perception, insight]
  leaders: [assassin, spy]
  minions: [thug, bandit]
  minion_name: hired blade
  lair_desc: a killers' safe house
  boss_desc: the killer's hidden retreat
  site_desc: the scene of a murder
  effect: {kind: none, value: 0}
  start: "{name}, {looks}, is in danger and was last seen near {place}. Start there."
  end: "{name} was kept safe and the killer is stopped. {premise}"

# ---------------------------------------------------------------- monsters and nature
