# Story templates for arcs: 30 of them. A template says WHAT kind of story it is, how its steps are mixed, how it ends,
# and which creatures stand against the player. The engine fixes the shape; the model supplies names, clues and colour once.
#
# board:      the contract as posted ({subject}, {place}).        subjects: phrases the engine picks from for {subject}.
# truth:      the real story, given to the model so its clues fit one plot.     subject_kind: person | object | matter
# contacts:   roles of the people in towns who know something.                   mix: weights for the steps between first and last
# finale:     fight (the last step is a battle) or confront (evidence first; if it fails they fight).
# leaders / minions: creature ids (scaled to the player's level; people yield, monsters fight on).
# effect:     what the story does to the world while it runs: danger (roads), prices (towns) or none.
# Anything left out takes template_defaults in rules/arcs.yaml.

# ---------------------------------------------------------------- crime and conspiracy
- id: smuggling_ring
  board: "Missing: {subject}, last seen near {place}"
  subjects: ["a miller's daughter", "a courier", "a merchant's apprentice", "a young scholar", "a herder's son", "a ferryman's wife"]
  truth: >
    The missing person saw something they should not have - a shipment, a ledger, a face - and was taken by a smuggling ring
    that moves contraband along the roads between the great cities, paying off a few officials. The ring is run by one
    person who is not at the first camp. Every camp and contact on the trail knows only the next link.
  contacts: [merchant, innkeeper, dockhand, caravan_master, courtier, guard, bargeman]
  minion_name: smuggler
  lair_desc: a smugglers' camp hidden off the road
  boss_desc: the ring leader's stronghold
  tags: [smuggl, outlaw, bandit]

- id: counterfeit_mint
  board: "Investigate: {subject}, first noticed near {place}"
  subjects: ["false coins in the market", "clipped and plated silver", "counterfeit crowns passing in trade"]
  subject_kind: matter
  truth: >
    Counterfeit coin is flooding the markets. It is struck at a hidden mint in a ruined keep by a gang with a skilled
    engraver, and carried out through merchants who do not know what they pass on. Each town holds a link: who passed it,
    who sold the metal, who supplies the dies.
  contacts: [merchant, innkeeper, smith, guard, courtier, caravan_master]
  mix: {contact: 3, site: 1, lair: 1}
  site_checks: [perception, insight]
  leaders: [bandit_captain]
  minions: [thug, bandit]
  minion_name: coiner
  lair_desc: a workshop of coiners behind a false front
  boss_desc: a hidden mint under a ruined keep
  site_desc: a cache of bad coin, or a smith's back room
  effect: {kind: prices, value: 15}

- id: poisoned_wells
  board: "Investigate: {subject}, starting near {place}"
  subjects: ["villages falling sick one after another", "a fever that follows the wells", "a sickness spreading along the roads"]
  subject_kind: matter
  truth: >
    The wells of several villages are being fouled on purpose by a cult-backed alchemist testing a poison. The sickness
    follows a trail of buyers and carriers, and the poison is made in a hidden workshop by fanatics.
  contacts: [herbalist, priest, elder, farmer, merchant, water_priest]
  mix: {contact: 3, site: 2, lair: 1}
  site_in: town
  site_checks: [lore, perception]
  leaders: [cult_fanatic]
  minions: [cultist, thug]
  minion_name: poisoner
  lair_desc: a cult's hidden workshop
  boss_desc: the alchemist's stronghold
  site_desc: a fouled well or a sick-house
  effect: {kind: prices, value: 20}

- id: forged_writs
  board: "Investigate: {subject}, reported near {place}"
  subjects: ["guild writs that do not match the ledgers", "forged contracts bearing real seals", "falsified deeds turning up in court"]
  subject_kind: matter
  truth: >
    Writs, deeds and guild contracts are being forged to defraud and to cover thefts. Clerks and scribes were bribed or
    blackmailed in several towns. Behind it is one organiser who holds a hidden office where the originals are kept.
  contacts: [guild_clerk, courtier, merchant, noble, watch_captain, loremaster]
  mix: {contact: 4, site: 1}
  site_in: town
  site_checks: [insight, lore]
  finale: confront
  confront_checks: [insight, persuasion, deception]
  leaders: [spy, assassin]
  minions: [thug]
  minion_name: hired blade
  lair_desc: a scribes' den where forged seals are kept
  boss_desc: the forger-lord's hidden office
  site_desc: a registry or a clerk's records
  effect: {kind: none, value: 0}

- id: slaver_pipeline
  tags: [outlaw, bandit]
  board: "Missing: {subject}, last seen near {place}"
  subjects: ["three villagers from a border hamlet", "a shepherd and her brothers", "a family of river folk", "a travelling troupe's youngest"]
  truth: >
    People are being taken from lonely places and sold on a chain of buyers that stretches from the border to the great cities.
    Each stage - the takers, the carters, the dealers - knows only the next. The chain ends at a fortress where the captives are held.
  contacts: [dockhand, caravan_master, merchant, bargeman, guard, innkeeper]
  mix: {contact: 3, lair: 2}
  leaders: [bandit_captain]
  minions: [bandit, thug]
  minion_name: slaver
  lair_desc: a slavers' holding camp
  boss_desc: the slaver fortress
  effect: {kind: danger, value: 30}

- id: assassins_ledger
  board: "Investigate: {subject}, found near {place}"
  subjects: ["a dead man's book of names", "a ledger of paid-for killings", "a coded book taken from a murdered fence"]
  subject_kind: object
  truth: >
    A ledger of contracted killings, found on a dead man, lists names and payments. Each lead is a person who paid, a person
    who carried messages, or a victim's kin. The last name in the book is the player's. The one behind it is a master
    assassin who is cleaning up loose ends.
  contacts: [innkeeper, merchant, noble, watch_captain, courtier, guard]
  mix: {contact: 4, site: 1}
  site_checks: [perception, insight]
  leaders: [assassin, spy]
  minions: [thug, bandit]
  minion_name: cutthroat
  lair_desc: a killers' safe house
  boss_desc: the master assassin's hideaway
  effect: {kind: none, value: 0}

# ---------------------------------------------------------------- cults and the unseen
