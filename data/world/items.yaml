# BASE ITEMS - the kinds of equipment that exist. Every actual item is built from one of these.
#
# slot:       main_hand | off_hand | head | body | hands | feet | neck | ring
# hands:      2 for two-handed weapons (they take main_hand and off_hand)
# reach:      melee | extended | ranged  (weapons only)
# attribute:  what drives the weapon; a list means whichever is higher
# damage:     physical or magical (weapons only)
# base:       damage for weapons, armor or ward for the rest - before rarity and item level
# weight:     light | medium | heavy (armor and shields)
# requires:   minimum attributes to equip, e.g. {strength: 40}
# tags:       what abilities can require (spear, shield, bow, focus, blade...)
# price:      in copper, for a common item of level 1
# family:     which materials it is made from (materials.yaml): metal, hide, cloth or wood. None means it has no material.
# label:      how it is named with a material, e.g. 'bronze' + 'helm'. Defaults to name.

