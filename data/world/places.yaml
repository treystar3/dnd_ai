  name: the Lakeview Rest
  type: inn
  region: royal_vales
  parent: kingsmere
  visible:
    - A white-painted inn with a long veranda over the water.
    - The best rooms face the drowned palace, and cost accordingly.
  residents: {innkeeper: 1}
