- id: frontier_garrison
  name: Frontier Garrison
  type: town
  region: eastern_frontier
  visible:
    - "A vast war camp on the western edge of the Cracked Plains: pavilions of every city's colours behind a stake palisade, with catapults and trebuchets between the tents."
    - Banners from Valecourt, Ironvein, Eldervale, Frostholm, Sunspire and more hang side by side, and the old rivalries show in every mess line.
    - At dusk the camp reads the Frontier Rolls aloud, the names of the dead since the last season.
    - The Frontier Road runs north to Redstone; the Supply Road runs west to Riverhaven. A dashed track leads into the Cracked Plains.
    - Within the camp you can find the garrison guild post, the Soldiers' Mess, the quartermaster's tent and the siege smithy.
  peoples: {human: 45, dwarf: 20, elf: 10, orc: 10, goliath: 5, half_elf: 5, halfling: 5}
  biome: urban
  locals_group: frontier_locals
  connects: {redstone: 2400, riverhaven: 2600, cracked_plains: 90}
  residents: {guard: 3, watch_captain: 1, scout: 2, land_agent: 1}
  storage: true
  trade_level: [41, 68]

