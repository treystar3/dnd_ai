# --- the drowned coast (west of the royal vales) ---

- id: dunmarrow_temple
  name: the silent chapel
  type: temple
  region: deep_roads
  parent: dunmarrow
  visible:
    - A dark, unlit chapel cut into the rock for Nythra the Deep Watcher, where no one speaks above a whisper.
    - Worshippers leave a secret, whispered into a stone basin, and a tithe box sits below it.
  residents: {priest: 1}

- id: brinewatch
