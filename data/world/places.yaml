- id: valecourt
  name: Valecourt
  type: city
  region: royal_vales
  visible:
    - The royal capital - towers, palaces and great houses over rolling valleys of vineyards and estates.
    - Everything is grander, cleaner and better kept than in the countryside; the gap is plain to see.
    - Magic is everywhere in the great houses and nearly nowhere in the streets below them.
    - The Royal Road runs east to Parth.
    - Within the Valecourt streets you can find the Valecourt guild hall, the Gilded Stag, the Valecourt mercantile, the court atelier, the Royal Curiosity House and the royal chapel.
  peoples: {human: 85, half_elf: 8, elf: 4, dwarf: 3}
