- id: greyhollow_foothills
  name: the Greyhollow foothills
  type: hills
  region: northern_hills
  biome: hills
  danger: [5, 18]
  visible:
    - Rocky foothills and mixed woodland, scarred with old workings and abandoned quarries.

- id: blackpine_forest
  name: the Blackpine Forest
  type: forest
  region: blackpine
  biome: forest
  danger: [12, 30]
  connects: {greyhollow: 480, eldervale: 480}
  visible:
    - Immense, ancient pines and older trees between them; the light is green and dim even at noon.
    - The road here is half swallowed by moss and root.

- id: eldervale
  name: Eldervale
  type: city
  region: blackpine
  visible:
    - An ancient elven city woven into the Blackpine - homes, halls and walkways grown into the living forest.
    - Lights that are plainly magic hang among the branches, and no one remarks on them.
    - Blackpine Road leads southeast to Greyhollow; the Old Forest Trail leads north toward Frostholm.
    - Within the Eldervale streets you can find the Eldervale guild hall, the Silverleaf Rest, the Greenleaf apothecary, the Moonthread workshop and the Elder Keep curios.
  peoples: {elf: 70, half_elf: 25, human: 5}
  biome: urban
  locals_group: eldervale_locals
  connects: {frostholm: 2880, elderwild: 130}
  residents: {elven_warden: 2, land_agent: 1, loremaster: 1}
  storage: true
  trade_level: [15, 40]

- id: ironvein
  name: Ironvein
  type: city
  region: grey_mountains
  visible:
    - A great dwarven city carved into the Grey Mountains and the deep places beneath them.
    - Vast halls, forge-light, lifts and machinery; magic worked into stone and steel like any other craft.
    - The King's Pass descends southwest to Parth; the Frostpass climbs north toward Frostholm.
    - Within the Ironvein streets you can find the Ironvein guild hall, the Cinder Mug, the Ironvein trading house, the Ironvein forge, the Ironvein engineers' hall, the Deeprune workshop and the Ironvein curio vault.
  peoples: {dwarf: 75, gnome: 15, human: 10}
