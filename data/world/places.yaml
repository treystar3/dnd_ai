    - Glassmakers use the lake's fine sand; the old summer palace lies drowned at the bottom.
    - The Lakeshore Road runs south to Riverhaven and joins the Valley Road.
    - Within the Kingsmere streets you can find the Lakeview Rest and the Mirror Glassworks.
