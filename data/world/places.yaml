  type: underground
  region: deep_roads
  biome: deep_underground
  danger: [84, 139]
  connects: {lightless_deep: 700}
  visible:
    - A cavern-gallery of impossible scale, its walls carved with scenes from before the first dwarf.
    - The dark is not empty. It listens, and it has been listening a very long time.

