- id: thalassor
  name: Thalassor
  type: city
  region: gloaming_coast
  visible:
    - A harbour city built on stilts and the hulls of ships it has outlived, wrapped in sea-fog and the sound of bells.
    - Streets are gangplanks that rise and fall with the tide, so an address is given as a tide-mark.
    - "Above the quays a shelf of grey rock juts out from the cliff like a stone roof: the Overhang, with the Hanging College on top of it."
    - The Gull Road runs south to Brinewatch and north along the coast to Cairnholt.
    - Within the Thalassor streets you can find the Thalassor guild hall, the Low Tide Inn, the Salvage Exchange, the Anchor Forge, the Bellwrights' foundry, the Wreck-Rights Office, the Bell-house and the Hanging College.
  peoples: {elf: 35, human: 30, half_elf: 15, gnome: 10, halfling: 10}
  biome: urban
  locals_group: thalassor_locals
  connects: {brinewatch: 1600, cairnholt: 900, stormbreak_cape: 130}
  residents: {guard: 2, land_agent: 1, watch_captain: 1}
  storage: true
  trade_level: [83, 138]

- id: thalassor_guild
  name: the Thalassor guild hall
  type: guild
  region: gloaming_coast
  parent: thalassor
  visible:
    - A tall hall on pilings over the water, with the guild's sign hung from a bell-rope.
    - Inside, a board of pinned contracts and a clerk's desk, and a floor that sways a little with the tide.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: thalassor_temple
  name: the Bell-house
  type: temple
  region: gloaming_coast
  parent: thalassor
  visible:
    - A narrow temple of white-washed wood hung with bells of every size, rung by hand and by wind.
    - Sailors and bellwrights leave bells and wicks for Vessa the Bellkeeper; a bell rung out of turn is a warning.
  residents: {priest: 1}

- id: thalassor_inn
  name: the Low Tide Inn
  type: inn
  region: gloaming_coast
  parent: thalassor
  visible:
    - A creaking inn half under the Overhang, always dim and always warm.
    - The lamps are fogbell-glass and the rooms smell of tar and cedar.
  residents: {innkeeper: 1}
  storage: true

- id: thalassor_exchange
  name: the Salvage Exchange
  type: shop
  region: gloaming_coast
  parent: thalassor
  visible:
    - A hall of lots and tags where the wreck-rights are auctioned and the salvage is sold.
    - Everything here has been in the sea at least once.
  residents: {merchant: 1}
  trade_level: [83, 138]

- id: thalassor_forge
  name: the Anchor Forge
  type: smithy
  region: gloaming_coast
  parent: thalassor
  visible:
    - A forge cut into the cliff foot, hammering out chain and fittings for the harbour.
    - The sparks hiss in the sea-mist.
  residents: {smith: 1}
  trade_level: [83, 138]
  stations: {forge: {fee: 90, owner: smith}}

- id: thalassor_foundry
  name: the Bellwrights' foundry
  type: workshop
  region: gloaming_coast
  parent: thalassor
  visible:
    - A foundry where the fog bells are cast, hung with moulds and tuning-forks.
    - Every bell is struck once before it leaves, and the apprentices listen to the note.
  residents: {enchanter: 1}
  trade_level: [83, 138]

- id: thalassor_curios
  name: the Wreck-Rights Office
  type: shop
  region: gloaming_coast
  parent: thalassor
  visible:
    - A cramped office of ledgers and a locked cabinet of things the sea gave back.
    - The clerk can tell you which ship each of them came from.
  residents: {relic_dealer: 1}
  trade_level: [83, 138]

- id: hanging_college
  name: the Hanging College
  type: workshop
  region: gloaming_coast
  parent: thalassor
  visible:
    - The largest school of magic in Rivia, on top of the Overhang and slung beneath it on chains and rope bridges.
    - Founded and run by elves who teach magic as a gift. Counterweighted lifts called the Tide Lifts climb the cliff and stop at slack water.
  residents: {loremaster: 1, enchanter: 1, guild_instructor: 1}
  trade_level: [83, 138]

- id: cairnholt
  name: Cairnholt
  type: village
  region: gloaming_coast
  visible:
    - A grey village of stone-tenders on the edge of the moor, every garden wall topped with a small cairn.
    - Every family keeps a cairn on the moor for an ancestor, and restacks it in spring.
    - Folk speak in short phrases; on open ground words carry too far.
    - The Bell Road runs west to Thalassor; the Cairn Road runs east toward Whitehaven.
  peoples: {human: 60, goliath: 15, dwarf: 15, half_elf: 10}
  biome: urban
  locals_group: thalassor_locals
  connects: {whitehaven: 1000, wraithmoor: 100, whispering_cairns: 140}
  residents: {stonemason: 2, shepherd: 2, hunter: 1, elder: 1, innkeeper: 1}
  storage: true
  trade_level: [70, 117]

- id: whitehaven
  name: Whitehaven
  type: village
  region: gloaming_coast
  visible:
    - A bridge village on the one dry road between the coast and Frostholm, hung with cords and weather-vanes.
    - The Weathermongers read gulls, knotted cord and the smell of the wind, and sell the day's forecast.
    - The Weather Road climbs east to Frostholm; the Cairn Road runs west along the moors.
  peoples: {human: 55, halfling: 20, gnome: 15, half_elf: 10}
  biome: urban
  locals_group: thalassor_locals
  connects: {frostholm: 900}
  residents: {merchant: 1, innkeeper: 1, scout: 1, elder: 1, farmer: 1}
  storage: true
  trade_level: [57, 94]

- id: stormbreak_cape
  name: Stormbreak Cape
  type: coast
  region: gloaming_coast
  visible:
    - A headland where gales are born; wind has carved the cliffs into pipes that howl at night.
    - A lighthouse on the point has no keeper and is lit every dusk anyway.
  biome: coast
  danger: [85, 141]

- id: wraithmoor
  name: the Wraithmoor
  type: hills
  region: gloaming_coast
  visible:
    - A wet peat moor where the ground keeps what falls into it.
    - "On foggy mornings old soldiers stand up out of the bog, whole and unrotted: the Kept."
  biome: hills
  danger: [72, 120]

- id: whispering_cairns
  name: the Whispering Cairns
  type: ruins
  region: gloaming_coast
  visible:
    - A field of about two hundred cairns, each said to hold a secret someone whispered to the stone and buried.
    - Put an ear to one and you hear it.
  biome: ruins
  danger: [80, 133]

- id: skarnhelm
  name: Skarnhelm
  type: city
  region: rimelands
  visible:
    - A stepped city carved into a glacier-fed crag by goliath clans, its districts named for the great stones lifted at the yearly Reckoning.
    - Smoke and steam rise from long halls under hanging ice; every doorway has a stone lintel that guests are told to touch.
    - Guests are protected under the lintel for a week and a day; breaking guest-right is the gravest crime in the city.
    - The Glimmer Way runs southwest toward Glimmerfrost; the Ash Road runs south to Cinderhold.
    - Within the Skarnhelm streets you can find the Skarnhelm guild hall, the Lintel Hall, the Stone Market, the Reckoning forge, the Glacier Vault and the Stair-hall.
  peoples: {goliath: 60, human: 20, orc: 10, dwarf: 10}
  biome: urban
  locals_group: skarnhelm_locals
  connects: {glimmerfrost: 1000, cinderhold: 2800, rimewood: 140, aurora_fields: 120}
  residents: {guard: 2, land_agent: 1, elder: 1}
  storage: true
  trade_level: [95, 158]

- id: skarnhelm_guild
  name: the Skarnhelm guild hall
  type: guild
  region: rimelands
  parent: skarnhelm
  visible:
    - A long hall of cut stone under a roof of heavy turf, the guild's sign carved into the lintel.
    - Inside, a board of pinned contracts and a clerk's desk, and a fire that is never allowed to go out.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: skarnhelm_temple
  name: the Stair-hall
  type: temple
  region: rimelands
  parent: skarnhelm
  visible:
    - A hall at the top of the city's great stair, bare stone around a bowl of coals, for Orrun the Longwinter.
    - Every worshipper carries a small stone up the stair and leaves it on the pile.
  residents: {priest: 1}

- id: skarnhelm_inn
  name: the Lintel Hall
  type: inn
  region: rimelands
  parent: skarnhelm
  visible:
    - A great timber hall where guests sleep in rows under fur and are fed from a single pot.
    - Guests are asked their name and their road, and nothing more.
  residents: {innkeeper: 1}
  storage: true

- id: skarnhelm_trading
  name: the Stone Market
  type: shop
  region: rimelands
  parent: skarnhelm
  visible:
    - A terraced market of stalls under hanging ice, selling furs, rope, salt and iron.
    - Prices are agreed by lifting a stone, which nobody explains.
  residents: {merchant: 1}
  trade_level: [95, 158]

- id: skarnhelm_forge
  name: the Reckoning forge
  type: smithy
  region: rimelands
  parent: skarnhelm
  visible:
    - A forge of goliath-sized hammers, making iron for the clans' great stones.
    - The anvils are lifted by two people at a time.
  residents: {smith: 1}
  trade_level: [95, 158]
  stations: {forge: {fee: 120, owner: smith}}

- id: skarnhelm_curios
  name: the Glacier Vault
  type: shop
  region: rimelands
  parent: skarnhelm
  visible:
    - A cold cellar cut into the glacier, where things are kept that the ice gave up.
    - The vault keeper has a lamp that never needs oil.
  residents: {relic_dealer: 1}
  trade_level: [95, 158]

- id: glimmerfrost
  name: Glimmerfrost
  type: village
  region: rimelands
  visible:
    - A mining village on a ridge above a field of crevasses, its windows lit by lamps that never need oil.
    - The miners harvest glimmer, a crystal that holds daylight and gives it back slowly. Ropes hung by every door carry a knot for each pair that did not come back.
    - Folk say glimmer dims when someone nearby is lying.
    - The Glimmer Way runs northeast to Skarnhelm; the Rime Road runs southwest to Dunmarrow.
  peoples: {dwarf: 40, human: 30, goliath: 15, gnome: 15}
  biome: urban
  locals_group: skarnhelm_locals
  connects: {dunmarrow: 1400, giants_ladder: 120}
  residents: {miner: 3, engineer: 1, innkeeper: 1, guard: 1, elder: 1}
  storage: true
  trade_level: [81, 135]

- id: giants_ladder
  name: the Giant's Ladder
  type: mountains
  region: rimelands
  visible:
    - A staircase of steps too tall for any person, hewn up a cliff to a door no one has opened.
    - Skarnhelm claims the stair and will not say who built it.
  biome: highpeaks
  danger: [83, 138]

- id: rimewood
  name: the Rimewood
  type: forest
  region: rimelands
  visible:
    - A frozen pine forest where the trees ring like glass in the cold.
    - Each winter the trees shift a few paces, so no path is walked twice. Guides tie red cord to the branches.
  biome: arctic
  danger: [107, 178]

- id: aurora_fields
  name: the Aurora Fields
  type: tundra
  region: rimelands
  visible:
    - A flat plain of ice where the northern lights come to ground in storms and leave shards of sky-glass behind.
    - Creatures are drawn to the light.
  biome: arctic
  danger: [106, 177]

- id: kelpmoor
  name: Kelpmoor
  type: town
  region: saltmarches
  visible:
    - A shipwright and weaving town where gnome and halfling families outnumber the humans, strung along a harbour of kelp-beds and slipways.
    - A ropewalk a quarter mile long runs down the middle of town. A newborn gets a ship-knot tied on their wrist, untied only on the day they leave.
    - The Salt Road runs northeast to Parth; the Coast Road runs east to Riverhaven and west to Saltmarsh Landing.
    - Within the Kelpmoor streets you can find the Knotted Rope, the ropewalk and the slipway smithy.
  peoples: {gnome: 35, halfling: 35, human: 30}
  biome: urban
  locals_group: kelpmoor_locals
  connects: {riverhaven: 1100, saltmarsh_landing: 300, shipwreck_shoals: 70}
  residents: {guard: 1, fisher: 2, bargeman: 1, chandler: 1, land_agent: 1}
  storage: true
  trade_level: [5, 8]

- id: kelpmoor_inn
  name: the Knotted Rope
  type: inn
  region: saltmarches
  parent: kelpmoor
  visible:
    - A low inn built from a ship's hull, hung with every knot the Guild of Knots teaches.
    - Sailors pay for a bed with a tale or a knot.
  residents: {innkeeper: 1}
  storage: true

- id: kelpmoor_ropewalk
  name: the ropewalk
  type: shop
  region: saltmarches
  parent: kelpmoor
  visible:
    - A long open shed where rope, sailcloth and kelp bread are sold side by side.
    - The walk is a quarter mile of spinners, and it smells of tar and hemp.
  residents: {merchant: 1}
  trade_level: [5, 8]

- id: kelpmoor_smithy
  name: the slipway smithy
  type: smithy
  region: saltmarches
  parent: kelpmoor
  visible:
    - A smithy beside the slipways, forging nails, fittings and fish-hooks.
    - The smith will mend a blade between launches.
  residents: {smith: 1}
  trade_level: [5, 8]
  stations: {forge: {fee: 50, owner: smith}}

- id: saltmarsh_landing
  name: Saltmarsh Landing
  type: village
  region: saltmarches
  visible:
    - A fishing hamlet on a tidal flat whose houses stand on sledges.
    - As the marsh creeps, the whole village drags itself inland, an event called the Drag that every household attends.
    - Eels are the staple, and eels are also served at funerals.
    - The Landing Track runs east to Kelpmoor.
  peoples: {human: 70, halfling: 25, half_elf: 5}
  biome: urban
  locals_group: kelpmoor_locals
  connects: {tidepool_caves: 60}
  residents: {fisher: 3, elder: 1, innkeeper: 1, cook: 1}
  storage: true
  trade_level: [7, 12]

- id: tidepool_caves
  name: the Tidepool Caves
  type: coast
  region: saltmarches
  visible:
    - Caves that flood twice a day, with a second beach of glowing tidepools behind the first chamber.
    - A hermit lives in the dry chamber and will tell you when the water turns.
  biome: coast
  danger: [1, 18]

- id: shipwreck_shoals
  name: the Shipwreck Shoals
  type: coast
  region: saltmarches
  visible:
    - A graveyard of hulls where false lights draw ships onto the sand.
    - The fishermen blame lantern-crabs. A careful watcher notices the lights burn on a schedule.
  biome: coast
  danger: [1, 13]

- id: elmshade
  name: Elmshade
  type: village
  region: blackpine
  visible:
    - A village of elves who left Eldervale and planted their own grove on purpose, a little vulgar in the eyes of the old city.
