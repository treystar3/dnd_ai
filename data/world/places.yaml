# Places in Rivia.
#
# visible:   what anyone can see there. The narrator only describes these (plus what's happening).
# residents: roles the engine fills with generated NPCs the first time the place is entered.
#            Names, looks and personalities are generated then; the role list is yours.
# peoples:   population mix (relative weights). Child places inherit from their parent.
# connects:  extra places reachable from here, with walking minutes: {greywood: 30}.
#            Parent, children and siblings are always reachable, 5 minutes apart.
# locals_group: knowledge group residents here belong to. Child places inherit it.
# biome:     what kind of land this is (see world.yaml). Decides which creatures can live here.
# danger:    [min, max] creature levels found here. No danger means no wild creatures appear.
# storage:   true if the player's item box can be reached here.
# trade_level: [min, max] item levels merchants here stock and make.
# stations:  workstations here for crafting gear, who owns each (they must be at work) and the fee to use it.
# anchors:   creatures that always live here, whatever else is rolled - use this to keep the roster true to
#            your lore (the Greywood has wolves because the villagers say so).

- id: parth
  name: Parth
  type: town
  region: wend_vale
  visible:
    - Timber-and-stone houses gathered where the trade road crosses the river Wend.
    - Grain fields and low sheep hills on every side but the north.
    - To the north, the dark edge of the Greywood.
    - Hearths and ovens are lit by flint and tinder; nothing here is kindled by magic.
    - Roads leave in every direction - the Old Quarry Road north, the King's Pass northeast, the Red Road east,
      the King's Road south and the Salt Road southwest to the sea.
  peoples: {human: 85, halfling: 6, dwarf: 5, half_elf: 4}
  biome: urban
  locals_group: parth_locals
  connects: {greywood: 30, willowmead: 480, greyhollow: 600, eldervale: 1320, ironvein: 800, redstone: 1200, kelpmoor: 520}
  residents: {farmer: 6, shepherd: 2, hunter: 1, herbalist: 1, smith: 1, miller: 1, land_agent: 1}
  trade_level: [1, 6]
  stations: {forge: {owner: smith, fee: 50}, tanning_rack: {owner: hunter, fee: 20}}

- id: south_fields
  name: the south fields
  type: fields
  region: wend_vale
  biome: farmland
  danger: [1, 3]
  connects: {parth: 15}
  visible:
    - Rows of grain, a dirt track between them, and the roofs of Parth a short walk north.
    - A low stone wall, a scarecrow, birds startling up from the stalks.

- id: trading_square
  name: the trading square
  type: square
  region: wend_vale
  parent: parth
  visible:
    - A cobbled square with a stone well at its center.
    - A weathered notice post covered in layers of nailed-up paper.
    - A few permanent stalls; on market day, carts and traveling merchants fill the rest.
  residents: {baker: 1, chandler: 1, tinker: 1}
  trade_level: [1, 6]
  stations: {workbench: {owner: tinker, fee: 20}, loom: {owner: chandler, fee: 20}}

- id: watch_tower
  name: the watch tower
  type: guardpost
  region: wend_vale
  parent: parth
  visible:
    - A squat stone tower by the road, a bell hung under its eaves.
    - A bench by the door where a guard is usually sitting.
  residents: {watch_captain: 1, guard: 4}

- id: guild_house
  name: the adventurers' guild house
  type: guild
  region: wend_vale
  parent: parth
  visible:
    - A converted granary with the guild's sign over the door.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 3, butcher: 1, quartermaster: 1}

- id: tilted_plough
  name: the Tilted Plough          # invented
  type: inn
  region: wend_vale
  parent: parth
  visible:
    - A long, low inn with a crooked painted plough on its sign.
    - A front room of locals at their usual tables; stairs up to rooms for travelers.
  residents: {innkeeper: 1, server: 1, cook: 1}
  storage: true

- id: parth_temple
  name: the temple of Parth
  type: temple
  region: wend_vale
  parent: parth
  visible:
    - A small stone temple, plainly much older than the houses around it.
    - Several altars; the largest, to the Sun Warden, is hung with harvest offerings and a gilded sunburst.
  residents: {priest: 1, acolyte: 1}

- id: greywood
  name: the Greywood               # invented
  type: forest
  region: wend_vale
  biome: forest
  danger: [1, 6]
  anchors: [wolf]
  visible:
    - Old, close-grown forest. Light fails quickly past the first trees.
    - Woodcutters' stumps along the edge; few paths lead deeper.

- id: cracked_plains
  name: the Cracked Plains           # invented; the Frontier Garrison holds the line at its western edge
  type: wasteland
  region: cracked_plains_region
  biome: cracked_plains
  danger: [60, 700]
  hide_max: true
  visible:
    - Grey earth split into endless plates by cracks too deep to see the bottom of.
    - Scorched rock, old bones and broken weapons scattered as far as the eye can see.
    - A low red haze on the horizon that never lifts.

# --- the wider kingdom and beyond (from the world writeup) ---

- id: willowmead
  name: Willowmead
  type: village
  region: great_river
  visible:
    - A quiet farming village of humans and halflings among orchards, grazing fields and slow streams.
    - To the south, the land softens into the wetlands of the Great River.
    - The King's Road runs north to Parth; the River Road runs south to Riverhaven.
  peoples: {human: 60, halfling: 40}
  biome: urban
  locals_group: willowmead_locals
  connects: {riverhaven: 960, willowmead_wetlands: 45}
  residents: {farmer: 2, orchard_keeper: 1, fisher: 1, herbalist: 1, innkeeper: 1}
  storage: true
  trade_level: [1, 6]

- id: willowmead_wetlands
  name: the Willowmead wetlands
  type: wetland
  region: great_river
  biome: swamp
  danger: [3, 10]
  visible:
    - Reed beds, black pools and slow channels where the Great River's waters spread out.
    - Herons, frogsong, and the smell of mud and rot.

- id: greyhollow
  name: Greyhollow
  type: town
  region: northern_hills
  visible:
    - A rough, busy mining and lumber town where the farmland gives way to hills and rocky foothills.
    - Spoil heaps, timber yards and the ring of picks; humans, dwarves and halflings work side by side.
    - The Old Quarry Road runs south to Parth; Blackpine Road climbs northwest toward Eldervale.
    - Within the Greyhollow streets you can find the Pickaxe and Pint and the Greyhollow smithy.
  peoples: {human: 50, dwarf: 30, halfling: 20}
  biome: urban
  locals_group: greyhollow_locals
  connects: {eldervale: 900, greyhollow_foothills: 40, hollow_barrows: 110}
  residents: {guard: 1, lumberjack: 2, miner: 3, stonemason: 1}
  storage: true
  trade_level: [4, 14]

- id: greyhollow_foothills
  name: the Greyhollow foothills
  type: hills
  region: northern_hills
  biome: hills
  danger: [5, 10]
  visible:
    - Rocky foothills and mixed woodland, scarred with old workings and abandoned quarries.

- id: blackpine_forest
  name: the Blackpine Forest
  type: forest
  region: blackpine
  biome: forest
  danger: [9, 15]
  connects: {greyhollow: 480, eldervale: 480}
  visible:
    - Immense, ancient pines and older trees between them; the light is green and dim even at noon.
    - The road here is half swallowed by moss and root.

- id: eldervale
  name: Eldervale
  type: city
  region: blackpine
  visible:
    - An ancient elven city woven into the Blackpine - homes, halls and walkways grown into the living forest.
    - Lights that are plainly magic hang among the branches, and no one remarks on them.
    - Blackpine Road leads southeast to Greyhollow; the Old Forest Trail leads north toward Frostholm.
    - Within the Eldervale streets you can find the Eldervale guild hall, the Silverleaf Rest, the Greenleaf apothecary, the Moonthread workshop, the Elder Keep curios and the heartwood shrine.
  peoples: {elf: 70, half_elf: 25, human: 5}
  biome: urban
  locals_group: eldervale_locals
  connects: {frostholm: 2880, elderwild: 130}
  residents: {elven_warden: 2, land_agent: 1, loremaster: 1}
  storage: true
  trade_level: [15, 40]

- id: ironvein
  name: Ironvein
  type: city
  region: grey_mountains
  visible:
    - A great dwarven city at the foot of the Grey Mountains, its gates opening on mines where dwarves cut copper and iron from the mountain's heart.
    - Vast halls, forge-light, lifts and machinery; magic worked into stone and steel like any other craft.
    - The King's Pass descends southwest to Parth; the gates in the mountain's foot open on the mines, where the dwarves cut copper and iron.
    - Within the Ironvein streets you can find the Ironvein guild hall, the Cinder Mug, the Ironvein trading house, the Ironvein forge, the Ironvein engineers' hall, the Deeprune workshop, the Ironvein curio vault and the anvil-hall.
  peoples: {dwarf: 75, gnome: 15, human: 10}
  biome: urban
  locals_group: ironvein_locals
  connects: {grey_mountains: 60, ironcrown_peaks: 150, ironvein_mines: 45}
  residents: {guard: 2, land_agent: 1, miner: 2}
  storage: true
  trade_level: [15, 45]

- id: grey_mountains
  name: the Grey Mountains
  type: mountains
  region: grey_mountains
  biome: mountains
  danger: [7, 12]
  visible:
    - Bare grey peaks, scree slopes and narrow passes where the wind never stops.

- id: frostholm
  name: Frostholm
  type: city
  region: far_north
  visible:
    - A hard northern city in a valley of snow and ice, built for endurance against the cold.
    - Goliaths, humans, orcs and dwarves share long halls and fires; the community is everything here.
    - The Frostpass leads east to Dunmarrow; the North Road runs south to Valecourt; the Old Forest Trail leads southwest toward Eldervale.
    - Within the Frostholm streets you can find the Frostholm guild hall, the Frozen Flagon, the Frostholm forge, the Frostholm curio house and the hearth-hall of the marshal.
  peoples: {goliath: 30, human: 30, orc: 25, dwarf: 15}
  biome: urban
  locals_group: frostholm_locals
  connects: {northern_tundra: 60, rimewind_barrens: 140}
  residents: {elder: 1, guard: 1, hunter: 1, land_agent: 1, trapper: 2}
  storage: true
  trade_level: [20, 45]

- id: northern_tundra
  name: the northern tundra
  type: tundra
  region: far_north
  biome: arctic
  danger: [45, 75]
  visible:
    - Open tundra and glacier under a white sky; snow to the horizon and nothing to break the wind.

- id: riverhaven
  name: Riverhaven
  type: city
  region: great_river
  visible:
    - A great trading city on the Great River - wharves, warehouses, barges and a crowd from everywhere.
    - Fine houses on the rise above the docks, where the wealthy keep magic close; the docks below rarely see it.
    - The River Road runs north to Willowmead; the southern trade routes run on toward the Sunscar.
    - Within the Riverhaven streets you can find the Riverhaven guild hall, the Drowned Lantern, the Riverhaven chandlery, the wharfside trading house, the tide-glass workshop, the Riverhaven curio shop and the river temple.
  peoples: {human: 55, halfling: 15, half_elf: 10, dwarf: 8, elf: 5, dragonborn: 4, gnome: 3}
  biome: urban
  locals_group: riverhaven_locals
  connects: {sunspire: 4320, great_river_reaches: 45, mirewater_fens: 100}
  residents: {bargeman: 1, dockhand: 2, guard: 2, land_agent: 1}
  storage: true
  trade_level: [10, 35]

- id: great_river_reaches
  name: the Great River reaches
  type: river
  region: great_river
  biome: freshwater
  danger: [12, 20]
  visible:
    - Wide brown water, sandbars and drowned woods along the Great River below the city.

- id: redstone
  name: Redstone
  type: town
  region: eastern_frontier
  visible:
    - A frontier town of red stone and dust where the grassland runs out into scrub and red hills.
    - Caravans resting and refitting; humans, orcs and dragonborn trading in the same yards.
    - The Red Road runs west to Parth; the Sun Road runs east into the Sunscar.
    - Within the Redstone streets you can find the Red Mile Inn, the Redstone caravan yard and the Redstone smithy.
  peoples: {human: 50, orc: 25, dragonborn: 25}
  biome: urban
  locals_group: redstone_locals
  connects: {sunspire: 3600, red_badlands: 45}
  residents: {guard: 1, scout: 1}
  storage: true
  trade_level: [8, 22]

- id: red_badlands
  name: the red badlands
  type: badlands
  region: eastern_frontier
  biome: hills
  danger: [10, 17]
  visible:
    - Red hills, dry gullies and wind-cut rock under a hard sky.

- id: sunspire
  name: Sunspire
  type: city
  region: sunscar
  visible:
    - A vast desert city raised around one of the Sunscar's great waters, its towers bright in the sun.
    - Magic is everywhere here, part of worship and daily life alike, and no one hides it.
    - The Sun Road leads west to Redstone; the southern trade routes lead northwest toward Riverhaven.
    - Within the Sunspire streets you can find the Sunspire guild hall, the Shaded Oasis, the Sunspire spice house, the Silk Row emporium, the Sunspire caravan yard, the sun-glass workshop, the bazaar of lost things and the water temple.
  peoples: {dragonborn: 40, human: 30, genasi: 30}
  biome: urban
  locals_group: sunspire_locals
  connects: {sunscar_desert: 90, sunken_vaults: 120}
  residents: {guard: 2, land_agent: 1}
  storage: true
  trade_level: [20, 50]

- id: sunscar_desert
  name: the Sunscar
  type: desert
  region: sunscar
  biome: desert
  danger: [59, 98]
  visible:
    - Sand, salt flats and mesas to every horizon; heat that shimmers the air.

- id: valecourt
  name: Valecourt
  type: city
  scale: capital                   # the royal capital: the truth layer's crowds and the town profile's quarters are the capital's (f318)
  region: royal_vales
  visible:
    - The royal capital - towers, palaces and great houses over rolling valleys of vineyards and estates.
    - Everything is grander, cleaner and better kept than in the countryside; the gap is plain to see.
    - Magic is everywhere in the great houses and nearly nowhere in the streets below them.
    - The Valley Road runs south to Riverhaven, the North Road to Frostholm, the Marrow Road to Dunmarrow and the Sunken Road west to Brinewatch.
    - Within the Valecourt streets you can find the palace, the Valecourt guild hall, the Gilded Stag, the Valecourt mercantile, the court atelier, the Royal Curiosity House and the royal chapel.
  peoples: {human: 85, half_elf: 8, elf: 4, dwarf: 3}
  biome: urban
  connects: {howling_downs: 130, riverhaven: 600, dunmarrow: 3200, frostholm: 1800}
  locals_group: valecourt_locals
  residents: {courtier: 1, land_agent: 1, noble: 2, royal_guard: 2}
  storage: true
  trade_level: [20, 60]

- id: eldervale_guild
  name: the Eldervale guild hall
  type: guild
  region: blackpine
  parent: eldervale
  visible:
    - An elven hall grown into the living wood, with the guild's sign carved into a living trunk.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: eldervale_temple
  name: the heartwood shrine
  type: temple
  region: blackpine
  parent: eldervale
  visible:
    - A shrine of living wood where branches have been coaxed into an archway, hung with wind-chimes, for Nhaelis the Green Huntress.
    - Hunters leave the first cut of a kill at the roots, and a tithe box of carved oak stands by the arch.
  residents: {priest: 1}

- id: ironvein_guild
  name: the Ironvein guild hall
  type: guild
  region: grey_mountains
  parent: ironvein
  visible:
    - A dwarven hall cut into the stone, with a stone door with the guild's sign beaten into iron.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: ironvein_temple
  name: the anvil-hall
  type: temple
  region: grey_mountains
  parent: ironvein
  visible:
    - A low stone hall around a great anvil that has never been moved, sacred to Kharun the Mountain Smith.
    - Smiths strike one blow on it before beginning any large work, and a tithe box of black iron is bolted to the wall.
  residents: {priest: 1}

- id: frostholm_guild
  name: the Frostholm guild hall
  type: guild
  region: far_north
  parent: frostholm
  visible:
    - A long, low hall with a roaring fire, with a hide banner with the guild's sign by the door.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: frostholm_temple
  name: the hearth-hall of the marshal
  type: temple
  region: far_north
  parent: frostholm
  visible:
    - A long hall kept warm against the cold for Isrenna the Frost Marshal, with a bare stone floor, because her faithful hold comfort should be earned.
    - Wintered-out travelers are given broth at the door, and a tithe box stands beside it.
  residents: {priest: 1}

- id: riverhaven_guild
  name: the Riverhaven guild hall
  type: guild
  region: great_river
  parent: riverhaven
  visible:
    - A hall on the waterfront, with the guild's sign hung over the river quay.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: sunspire_guild
  name: the Sunspire guild hall
  type: guild
  region: sunscar
  parent: sunspire
  visible:
    - A sandstone hall in the shade of the spire, with the guild's sign painted in red on the lintel.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

- id: valecourt_palace
  name: the palace
  type: palace
  region: royal_vales
  parent: valecourt
  visible:
    - The crown's house - pale stone, a great gate with the royal guard on it, and courts within courts beyond.
    - A hall where petitioners wait on benches under the eye of the chamberlain's clerks; the throne room lies past doors that do not open for everyone.
  residents: {monarch: 1, chamberlain: 1, courtier: 2, royal_guard: 2}
  audience: {keeper: chamberlain, sees: [monarch]}      # (f320) the crown is seen only when admitted; the chamberlain keeps the door

- id: valecourt_guild
  name: the Valecourt guild hall
  type: guild
  region: royal_vales
  parent: valecourt
  visible:
    - A grand hall of the guild, with the guild's sign in gilt over great doors.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

# =====================================================================================================
# THE FAR LANDS - beyond the settled map. Each is a long road from its gateway city; creature levels ~75-190.
# =====================================================================================================

# --- the Ashen Reach (beyond the Sunscar) ---

- id: cinderhold
  name: Cinderhold
  type: city
  region: ashen_reach
  visible:
    - A city of black stone and bright forges raised on the lip of an old caldera, its streets lit red from below.
    - Dragonborn and genasi smiths, flamekeepers and caravan masters; everyone here works a fire, and nobody wastes it.
    - Ash falls like snow. Shutters, awnings and cloaks are all the same grey.
    - The Ember Road runs northwest across the desert to Sunspire; the ash plains lie to the east.
    - Within the Cinderhold streets you can find the Cinderhold guild hall, the Ember Hearth, the Cinderhold trading house, the slag-glass emporium, the Cinderhold forge, the Cinderhold rune-forge, the Cinderhold caravan yard, the Cinderhold curio house and the shrine of the ash.
  peoples: {dragonborn: 40, genasi: 35, human: 15, dwarf: 10}
  biome: urban
  locals_group: cinderhold_locals
  connects: {sunspire: 2900, ash_wastes: 90, smoulder_fields: 120}
  residents: {guard: 2, land_agent: 1}
  storage: true
  trade_level: [95, 150]

- id: ash_wastes
  name: the ash wastes
  type: wasteland
  region: ashen_reach
  biome: volcanic
  danger: [94, 157]
  visible:
    - Black ash plains drifting in dunes, split by rivers of slow orange light.
    - Hot wind, sulphur and the far boom of the caldera.

- id: cinder_caldera
  name: the Cinder Caldera
  type: wasteland
  region: ashen_reach
  biome: volcanic
  danger: [111, 185]
  connects: {ash_wastes: 480}
  visible:
    - A crater miles across with a lake of molten rock at its heart and fortress-sized obsidian ribs at its edge.
    - The air itself sags with heat. Things that live here were made for it.

- id: cinderhold_guild
  name: the Cinderhold guild hall
  type: guild
  region: ashen_reach
  parent: cinderhold
  visible:
    - A black basalt hall lit by a forge-fire that has not gone out in a century, the guild's sign hammered in copper above it.
    - Inside, a long board of pinned contracts, many of them marked with the red seal of the highest ranks, and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

# --- the Stormcrown (beyond the northern snows) ---

- id: hrimgard
  name: Hrimgard
  type: city
  region: stormcrown
  visible:
    - A fortress-city of massive timber and stone on a ridge in the clouds, built by people who live beside giants.
    - Goliaths, orcs and mountain humans in long halls with enormous doors, so the biggest guests can come in.
    - Lightning walks the peaks at night. The city keeps iron rods on every roof and sings to the storm.
    - The Cloud Stair leads south through the snow to Frostholm; the high peaks begin at the gates.
    - Within the Hrimgard streets you can find the Hrimgard guild hall, the Rimed Tankard, the Hrimgard trading hall, the Hrimgard forge, the Trophy House and the judgment ring.
  peoples: {goliath: 45, orc: 25, human: 15, dwarf: 15}
  biome: urban
  locals_group: hrimgard_locals
  connects: {frostholm: 3300, stormcrown_heights: 100, windbreak_ridge: 150}
  residents: {elder: 1, guard: 2, hunter: 1, land_agent: 1, trapper: 1}
  storage: true
  trade_level: [105, 165]

- id: stormcrown_heights
  name: the Stormcrown Heights
  type: mountains
  region: stormcrown
  biome: highpeaks
  danger: [91, 152]
  visible:
    - Bare spires and glacier shelves above the cloud line, scoured by wind that never drops.
    - Giant-sized stairs cut into the rock, long abandoned or not abandoned at all.

- id: thunder_spires
  name: the Thunder Spires
  type: mountains
  region: stormcrown
  biome: highpeaks
  danger: [98, 163]
  connects: {stormcrown_heights: 500}
  visible:
    - The highest peaks of the Stormcrown, each topped by a halo of constant lightning.
    - Halls in the rock too large for human hands, and a sky that feels close enough to touch.

- id: hrimgard_guild
  name: the Hrimgard guild hall
  type: guild
  region: stormcrown
  parent: hrimgard
  visible:
    - A vast timbered hall with a roof of iron plates and a door three times a man's height, the guild's sign carved into its beam.
    - Inside, a board of contracts for hunts no one else would put a price on, and a clerk's desk on a platform.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

# --- the Deep Roads (beneath the Grey Mountains) ---

- id: hrimgard_temple
  name: the judgment ring
  type: temple
  region: stormcrown
  parent: hrimgard
  visible:
    - An open ring of standing stones under the sky, iron-roded, where disputes are laid before Throndar the Storm Judge.
    - A verdict is spoken in the open so the storm may confirm it, and a tithe box of hammered iron stands at the gate.
  residents: {priest: 1}

- id: dunmarrow
  name: Dunmarrow
  type: city
  region: deep_roads
  visible:
    - A dwarven city carved down through the roots of the mountains, terrace under terrace, lit by glowing crystal and forges.
    - The gates open on the Deep Stair; below is the old road, and below that, the dark.
    - Rune-masters, miners and tunnel-wardens, all of whom are armed and none of whom tell you what they have seen.
    - A great bell tolls the watch. When it tolls twice in a row, the gates close.
    - Within the Dunmarrow streets you can find the Dunmarrow guild hall, the Deepdelve Rest, the Dunmarrow trading house, the Dunmarrow forge, the Dunmarrow engineers' hall, the Dunmarrow curio vault and the silent chapel.
  peoples: {dwarf: 80, gnome: 10, human: 5, orc: 5}
  biome: urban
  locals_group: dunmarrow_locals
  connects: {frostholm: 1500, deep_roads_tunnels: 80, delvers_deep: 130}
  residents: {elder: 1, guard: 2, land_agent: 1, miner: 2, stonemason: 1}
  storage: true
  trade_level: [65, 110]

- id: deep_roads_tunnels
