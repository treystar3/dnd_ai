# Places in Rivia.
#
# visible:   what anyone can see there. The narrator only describes these (plus what's happening).
# residents: roles the engine fills with generated NPCs the first time the place is entered.
#            Names, looks and personalities are generated then; the role list is yours.
# peoples:   population mix (relative weights). Child places inherit from their parent.
# connects:  extra places reachable from here, with walking minutes: {greywood: 30}.
#            Parent, children and siblings are always reachable, 5 minutes apart.
# locals_group: knowledge group residents here belong to. Child places inherit it.
# biome:     what kind of land this is (see world.yaml). Decides which creatures can live here.
# danger:    [min, max] creature levels found here. No danger means no wild creatures appear.
# storage:   true if the player's item box can be reached here.
# trade_level: [min, max] item levels merchants here stock and make.
# stations:  workstations here for crafting gear, who owns each (they must be at work) and the fee to use it.
# anchors:   creatures that always live here, whatever else is rolled - use this to keep the roster true to
#            your lore (the Greywood has wolves because the villagers say so).

- id: parth
  name: Parth
  type: town
  region: wend_vale
  visible:
    - Timber-and-stone houses gathered where the trade road crosses the river Wend.
    - Grain fields and low sheep hills on every side but the north.
    - To the north, the dark edge of the Greywood.
    - Hearths and ovens are lit by flint and tinder; nothing here is kindled by magic.
    - Roads leave in every direction - the Old Quarry Road north, the King's Pass northeast, the Red Road east,
      the King's Road south and the Royal Road west.
  peoples: {human: 85, halfling: 6, dwarf: 5, half_elf: 4}
  biome: urban
  locals_group: parth_locals
  connects: {greywood: 30, willowmead: 480, greyhollow: 600, eldervale: 1320, ironvein: 1440, redstone: 1200, valecourt: 1680}
  residents: {farmer: 6, shepherd: 2, hunter: 1, herbalist: 1, smith: 1, miller: 1, land_agent: 1}
  trade_level: [1, 6]
  stations: {forge: {owner: smith, fee: 50}, tanning_rack: {owner: hunter, fee: 20}}

- id: south_fields
  name: the south fields
  type: fields
  region: wend_vale
  biome: farmland
  danger: [1, 3]
  connects: {parth: 15}
  visible:
    - Rows of grain, a dirt track between them, and the roofs of Parth a short walk north.
    - A low stone wall, a scarecrow, birds startling up from the stalks.

- id: trading_square
  name: the trading square
  type: square
  region: wend_vale
  parent: parth
  visible:
    - A cobbled square with a stone well at its center.
    - A weathered notice post covered in layers of nailed-up paper.
    - A few permanent stalls; on market day, carts and traveling merchants fill the rest.
  residents: {baker: 1, chandler: 1, tinker: 1}
  trade_level: [1, 6]
  stations: {workbench: {owner: tinker, fee: 20}, loom: {owner: chandler, fee: 20}}

- id: watch_tower
  name: the watch tower
  type: guardpost
  region: wend_vale
  parent: parth
  visible:
    - A squat stone tower by the road, a bell hung under its eaves.
    - A bench by the door where a guard is usually sitting.
  residents: {watch_captain: 1, guard: 4}

- id: guild_house
  name: the adventurers' guild house
  type: guild
  region: wend_vale
  parent: parth
  visible:
    - A converted granary with the guild's sign over the door.
    - Inside, a board of pinned contracts and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 3, butcher: 1, quartermaster: 1}

- id: tilted_plough
  name: the Tilted Plough          # invented
  type: inn
  region: wend_vale
  parent: parth
  visible:
    - A long, low inn with a crooked painted plough on its sign.
    - A front room of locals at their usual tables; stairs up to rooms for travelers.
  residents: {innkeeper: 1, server: 1, cook: 1}
  storage: true

- id: parth_temple
  name: the temple of Parth
  type: temple
  region: wend_vale
  parent: parth
  visible:
    - A small stone temple, plainly much older than the houses around it.
    - Several altars; the largest is hung with harvest offerings.
    - In a side alcove, a worn shrine to a figure whose face has been rubbed smooth.
  residents: {priest: 1, acolyte: 1}

- id: greywood
  name: the Greywood               # invented
  type: forest
  region: wend_vale
  biome: forest
  danger: [1, 10]
  anchors: [wolf]
  visible:
    - Old, close-grown forest. Light fails quickly past the first trees.
    - Woodcutters' stumps along the edge; few paths lead deeper.

- id: cracked_plains
  name: the Cracked Plains           # invented; not connected to anywhere yet
  type: wasteland
  region: cracked_plains_region
  biome: cracked_plains
  danger: [60, 700]
  visible:
    - Grey earth split into endless plates by cracks too deep to see the bottom of.
    - Scorched rock, old bones and broken weapons scattered as far as the eye can see.
    - A low red haze on the horizon that never lifts.

# --- the wider kingdom and beyond (from the world writeup) ---

