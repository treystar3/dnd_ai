# =====================================================================================================
# THE FAR LANDS - beyond the settled map. Each is a long road from its gateway city; creature levels ~75-190.
# =====================================================================================================

# --- the Ashen Reach (beyond the Sunscar) ---

- id: cinderhold
  name: Cinderhold
  type: city
  region: ashen_reach
  visible:
    - A city of black stone and bright forges raised on the lip of an old caldera, its streets lit red from below.
    - Dragonborn and genasi smiths, flamekeepers and caravan masters; everyone here works a fire, and nobody wastes it.
    - Ash falls like snow. Shutters, awnings and cloaks are all the same grey.
    - The Ember Road runs northwest across the desert to Sunspire; the ash plains lie to the east.
    - Within the Cinderhold streets you can find the Cinderhold guild hall, the Ember Hearth, the Cinderhold trading house, the slag-glass emporium, the Cinderhold forge, the Cinderhold rune-forge, the Cinderhold caravan yard, the Cinderhold curio house and the shrine of the ash.
  peoples: {dragonborn: 40, genasi: 35, human: 15, dwarf: 10}
  biome: urban
  locals_group: cinderhold_locals
  connects: {sunspire: 2900, ash_wastes: 90, smoulder_fields: 120}
  residents: {guard: 2, land_agent: 1}
  storage: true
  trade_level: [95, 150]

- id: ash_wastes
  name: the ash wastes
  type: wasteland
  region: ashen_reach
  biome: volcanic
  danger: [75, 125]
  visible:
    - Black ash plains drifting in dunes, split by rivers of slow orange light.
    - Hot wind, sulphur and the far boom of the caldera.

- id: cinder_caldera
  name: the Cinder Caldera
  type: wasteland
  region: ashen_reach
  biome: volcanic
  danger: [105, 160]
  connects: {ash_wastes: 480}
  visible:
    - A crater miles across with a lake of molten rock at its heart and fortress-sized obsidian ribs at its edge.
    - The air itself sags with heat. Things that live here were made for it.

- id: cinderhold_guild
  name: the Cinderhold guild hall
  type: guild
  region: ashen_reach
  parent: cinderhold
  visible:
    - A black basalt hall lit by a forge-fire that has not gone out in a century, the guild's sign hammered in copper above it.
    - Inside, a long board of pinned contracts, many of them marked with the red seal of the highest ranks, and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

# --- the Stormcrown (beyond the northern snows) ---

- id: hrimgard
  name: Hrimgard
  type: city
  region: stormcrown
  visible:
    - A fortress-city of massive timber and stone on a ridge in the clouds, built by people who live beside giants.
    - Goliaths, orcs and mountain humans in long halls with enormous doors, so the biggest guests can come in.
    - Lightning walks the peaks at night. The city keeps iron rods on every roof and sings to the storm.
    - The Cloud Stair leads south through the snow to Frostholm; the high peaks begin at the gates.
    - Within the Hrimgard streets you can find the Hrimgard guild hall, the Rimed Tankard, the Hrimgard trading hall, the Hrimgard forge and the Trophy House.
  peoples: {goliath: 45, orc: 25, human: 15, dwarf: 15}
  biome: urban
  locals_group: hrimgard_locals
  connects: {frostholm: 3300, stormcrown_heights: 100, windbreak_ridge: 150}
  residents: {elder: 1, guard: 2, hunter: 1, land_agent: 1, trapper: 1}
  storage: true
  trade_level: [105, 165]

- id: stormcrown_heights
  name: the Stormcrown Heights
  type: mountains
  region: stormcrown
  biome: highpeaks
  danger: [85, 140]
  visible:
    - Bare spires and glacier shelves above the cloud line, scoured by wind that never drops.
    - Giant-sized stairs cut into the rock, long abandoned or not abandoned at all.

- id: thunder_spires
  name: the Thunder Spires
  type: mountains
  region: stormcrown
  biome: highpeaks
  danger: [110, 160]
  connects: {stormcrown_heights: 500}
  visible:
    - The highest peaks of the Stormcrown, each topped by a halo of constant lightning.
    - Halls in the rock too large for human hands, and a sky that feels close enough to touch.

- id: hrimgard_guild
  name: the Hrimgard guild hall
  type: guild
  region: stormcrown
  parent: hrimgard
  visible:
    - A vast timbered hall with a roof of iron plates and a door three times a man's height, the guild's sign carved into its beam.
    - Inside, a board of contracts for hunts no one else would put a price on, and a clerk's desk on a platform.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

# --- the Deep Roads (beneath the Grey Mountains) ---

- id: dunmarrow
  name: Dunmarrow
  type: city
  region: deep_roads
  visible:
    - A dwarven city carved down through the roots of the mountains, terrace under terrace, lit by glowing crystal and forges.
    - The gates open on the Deep Stair; below is the old road, and below that, the dark.
    - Rune-masters, miners and tunnel-wardens, all of whom are armed and none of whom tell you what they have seen.
    - A great bell tolls the watch. When it tolls twice in a row, the gates close.
    - Within the Dunmarrow streets you can find the Dunmarrow guild hall, the Deepdelve Rest, the Dunmarrow trading house, the Dunmarrow forge, the Dunmarrow engineers' hall and the Dunmarrow curio vault.
  peoples: {dwarf: 80, gnome: 10, human: 5, orc: 5}
  biome: urban
  locals_group: dunmarrow_locals
  connects: {ironvein: 1900, deep_roads_tunnels: 80, delvers_deep: 130}
  residents: {elder: 1, guard: 2, land_agent: 1, miner: 2, stonemason: 1}
  storage: true
  trade_level: [115, 175]

- id: deep_roads_tunnels
  name: the Deep Roads
  type: underground
  region: deep_roads
  biome: deep_underground
  danger: [80, 135]
  visible:
    - Broad tunnels cut by hands long gone, lined with fallen statues and rails of rusted bronze.
    - Water ticks in the dark. Somewhere, something much bigger than you moves in the rock.

- id: lightless_deep
  name: the Lightless Deep
  type: underground
  region: deep_roads
  biome: deep_underground
  danger: [115, 165]
  connects: {deep_roads_tunnels: 400}
  visible:
    - Caverns beyond any map, vast enough to hold weather, lit only by fungus and the eyes of things that watch.
    - The silence is total and pressing. Lamps burn dim here, and some go out for no reason.

- id: dunmarrow_guild
  name: the Dunmarrow guild hall
  type: guild
  region: deep_roads
  parent: dunmarrow
  visible:
    - A stone vault near the lowest gate, the guild's sign cut in a slab of black iron, a war-bell hanging beside it.
    - Inside, a board of deep contracts with warding-runes at every corner, and a clerk's desk.
  residents: {guild_clerk: 1, guild_master: 1, guild_instructor: 1, guild_contractor: 2, quartermaster: 1}

# --- the drowned coast (west of the royal vales) ---

- id: brinewatch
  name: Brinewatch
  type: city
  region: drowned_coast
  visible:
    - A free port stacked up a sea-cliff above a bay of broken masts, run by captains and wreck-brokers.
    - Salvage is the city's only trade. Whatever the tide uncovers is auctioned by dawn.
    - Lanterns burn on every quay all night, to keep the drowned from walking up the stairs.
    - Within the Brinewatch streets you can find the Salt Gull, the Brinewatch ship's chandlery, the fish-wharf trading house, the tidewright's workshop, the salvage house and the sea-shrine.
  peoples: {human: 45, half_elf: 15, dragonborn: 10, halfling: 10, orc: 10, gnome: 10}
  biome: urban
  locals_group: brinewatch_locals
  connects: {valecourt: 3300, drowned_shore: 80, sepulchre_fields: 1700, wreck_coast: 110}
  residents: {dockhand: 2, fisher: 2, guard: 2, land_agent: 1}
  storage: true
  trade_level: [85, 140]

- id: drowned_shore
  name: the drowned shore
  type: coast
  region: drowned_coast
  biome: drowned
  danger: [90, 160]
  visible:
    - Reefs, tidal flats and the roofs of sunken halls, slick with weed, half under water at every tide.
    - Wrecks lie where they fell, some of them lit from within.

# --- the Jade Maw (south of the Great River) ---

