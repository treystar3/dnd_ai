    - "Everything here is damp and growing: moss on the walls, vines on the market stalls, flowers in the guards' helms."
    - Within the Amaranth streets you can find the Evergreen Rest, the Amaranth trading post, the Evergreen outfitters, the Amaranth apothecary, the Amaranth caravan camp, the Amaranth curio house and the grove shrine.
