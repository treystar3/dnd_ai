  name: the Grey Mountains
  type: mountains
  region: grey_mountains
  biome: mountains
  danger: [20, 45]
  visible:
    - Bare grey peaks, scree slopes and narrow passes where the wind never stops.

- id: frostholm
  name: Frostholm
  type: city
  region: far_north
  visible:
    - A hard northern city in a valley of snow and ice, built for endurance against the cold.
    - Goliaths, humans, orcs and dwarves share long halls and fires; the community is everything here.
    - The Frostpass leads south to Ironvein; the Old Forest Trail leads southwest toward Eldervale.
    - Within the Frostholm streets you can find the Frostholm guild hall, the Frozen Flagon, the Frostholm forge and the Frostholm curio house.
  peoples: {goliath: 30, human: 30, orc: 25, dwarf: 15}
  biome: urban
  locals_group: frostholm_locals
  connects: {northern_tundra: 60, rimewind_barrens: 140}
