# What CAN happen here - not what is happening. Nothing is in motion when the player wakes.
# The pulse system rolls against these over time; whatever comes up becomes a thread.
#
# weight:   relative chance of being chosen when a pulse lands on this place.
# severity: range of severities (0 invisible .. 5 catastrophic) it can produce.
# scope:    widest scope it normally reaches.

- id: greywood_predators
  place: greywood
  kind: threat
  description: Predators from the Greywood go after livestock or travelers. Usually wolves; occasionally something worse.
  weight: 3
  severity: [1, 4]
  scope: local

- id: seeker_arrives
  place: parth
  kind: social
  description: A Seeker from Riverhaven arrives to test the village's children for the gift.
  weight: 1
  severity: [2, 4]
  scope: local

- id: gift_shows
  place: parth
  kind: social
  description: A child in or near Parth shows signs of magic. The family must decide whether to report it.
  weight: 2
  severity: [1, 3]
  scope: individual

- id: road_brings_strangers
  place: parth
  kind: economic
  description: Travelers, merchants or strangers arrive on the trade road, bringing goods, news or trouble.
  weight: 4
  severity: [0, 3]
  scope: local

- id: caravan_trouble
  place: wend_vale
  kind: economic
  description: A caravan on the trade road is delayed, robbed or lost, and someone in Parth feels it.
  weight: 2
  severity: [1, 3]
  scope: regional
  campaign: true
  reward: [mount, deed]

- id: harvest_and_weather
  place: wend_vale
  kind: natural
  description: Weather turns for or against the crops and flocks.
  weight: 2
  severity: [0, 4]
  scope: regional

- id: watch_guild_tension
  place: parth
  kind: social
  description: The old friction between the watch and the guild flares over who handles a problem.
  weight: 1
  severity: [1, 2]
  scope: local

- id: inn_trouble
  place: tilted_plough
  kind: social
  description: A quarrel, a debt, a cheat at dice, or a stranger who draws attention at the inn.
  weight: 3
  severity: [0, 2]
  scope: individual

