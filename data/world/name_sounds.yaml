    male:
      - weight: 1
        first: [Al, Ald, Bal, Ber, Bran, Bren, Cad, Col, Cor, Dun, Ed, Fen, Gar, God, Gus, Hal, Har, Ing, Jor, Ken, Mar, Os, Ran, Rob, Sig,
                Tam, Wal, Wil, Hum, Lam, Aug, Ced, Dor, Ever, Ul]
