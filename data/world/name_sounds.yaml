# SOUND RULES for building names (f346): npc/names.py build().
#
# A built name is pieces joined: one from `first`, then none or more from `middle` (how many is drawn from `middles`, count: weight),
# then one from `last`. A vowel that ends one piece and starts the next is said once ("ala" + "aric" is "Alaric"). Each kind of name
# (male, female, family) is a list of forms; a form is drawn by its weight, so a people can have more than one shape of name: most
# peoples have a short form, an opening sound and an ending that make one syllable ("Br" + "om" is "Brom"). A piece may be "" (empty).
# Family names are built the same way as first names; only humans (and half-elves, who take human family names) and gnomes join
# whole words ("Thorn" + "dale", "Kettle" + "pop").
#
# Every built name must then keep the rules below: its length, how many vowels or consonants may run together, the people's own
# `avoid` patterns (sounds the people never makes) and the shared ones, and at least `min_syllables` if the people has one. Names
# that fail are thrown away and built again. A people with a `syllables` table (count: weight, the last count meaning that many or
# more) draws how many syllables a name will have first and builds until a name has that many: its share of short and long names
# is set there, and the forms' weights only shape which names of that length come up. There is no list of names that may never be
# built: each kind can make thousands of names, so any one name - an ordinary word, a name from another story - is very unlikely,
# and if one does turn up it is fine.
#
# These are first draft, written fresh for Meravia: add, cut or rewrite any piece. tools/name_samples.py prints what they make.
# The one shared `avoid` that names words keeps slurs and swearing from being spelled by chance.

length: [3, 10]                 # the shortest and longest name, in letters, unless a people says otherwise
max_vowels: 2                   # vowels that may run together ("ae" yes, "aea" no)
max_consonants: 3               # consonants that may run together ("ldr" in Baldric yes, four no)

avoid:                          # a name that matches any of these is drawn again (patterns on the lower-case name)
  - "q[^u]"
  - "(fuk|fuc|shit|cunt|dick|cock|piss|twat|wank|nig|fag|slut|whor|rape|anus|penis|tits|kkk|nazi|porn)"
  - "(.{2,})\\1"                # no piece said twice running ("dordor")
  - "^(wop|homo|nude|dago)$"    # only as the whole name: inside a longer one they are just sounds ("Thomo")
  - "^(anal|shag)"              # never to open a name; later in one they are fine ("Vanalith", "Dushagmok")



peoples:

  # Old English and Norman: solid two-part names, short ones like Bram or Bess now and then, a softer -a / -ine / -wyn for women,
  # and family names from trades and places.
  human:
    length: [3, 9]
    syllables: {1: 30, 2: 60, 3: 8, 4: 2}   # in 100 names: 30 like Brom, 60 like Aldric, 8 like Everard, 2 like Amalaric or longer
    male:
      - weight: 10
        first: [Al, Ald, Bal, Ber, Bran, Bren, Cad, Col, Cor, Dun, Ed, Fen, Gar, God, Gus, Hal, Har, Ing, Jor, Ken, Mar, Os, Ran, Rob, Sig,
                Tam, Wal, Wil, Hum, Lam, Aug, Ced, Dor, Ever, Ul]
        middle: [a, e, i, o]
        middles: {0: 8, 1: 2}
        last: [ric, win, ram, stan, ard, mund, bert, wick, ley, mer, ton, ulf, gar, ran, rin, ford, wyn, nard, mon, rich, fred, dan, wald]
      - weight: 3
        first: [B, Br, C, D, Dr, G, Gr, H, J, K, L, M, N, R, St, T, Th, W]
        last: [am, an, en, ed, ick, olm, orn, ulk, yle, ade, ock, ent, ude, ald, unn, orm]
      - weight: 1 # old long names: Amalaric, Theodemar, Adalbert
        first: [Ama, Atha, Erma, Theo, Ada, Ala, Hilde, Ode, Wili, Gunde, Ebe, Wala, Sige, Ere, Ever]
        middle: [la, na, de, do, ri, le, ra]
        middles: {1: 1}
        last: [ric, mar, mund, bert, win, gar, hard, wulf, wald]
    female:
      - weight: 10
        first: [Ad, Al, Av, Bea, Bren, Bry, Cec, Clar, Cor, Ed, El, Em, Eu, Fen, Gis, Gwen, Hed, Hil, Hes, Im, Is, Jes, Mar, Mil, Ros, Win,
                Mat, Ag, Ber, Mer, Od, Sib]
        middle: [a, e, i, o, li, ri]
        middles: {0: 6, 1: 4}
        last: [a, la, ella, ine, ys, ith, ly, da, wyn, ora, ice, beth, en, ette, ina, sa, na, ilde, ana, lyn, wen, ta]
      - weight: 3
        first: [B, Br, D, G, Gw, H, J, M, N, R, T, W]
        last: [ess, ell, aud, oan, enn, ys, eth, ild, ane, ith, ynn, ilde]
      - weight: 1 # long names: Adelina, Aurelia, Isabella
        first: [Ade, Ame, Ange, Ceci, Eme, Rosa, Isa, Vale, Aure, Gise, Mari, Ota, Leo, Ama, Ali, Ele]
        middle: [li, ri, ne, la, na, le]
        middles: {1: 1}
        last: [a, na, ne, lla, tta, sa]
    family:
      - weight: 5
        first: [Ash, Black, Bright, Brook, Fair, Green, Hay, Hart, Lang, Mill, Moor, North, Red, Rush, Thorn, West, White, Wood, Cole, Hol,
                Ald, Brad, Crom, Dun, Har, Pen, Stan, Thorp, Wick, Ling, Bar, Brom, Elm, Fen, Hamp, Lock, Mar, Oak, Rad, Sal, Wal, Wyn, Bur,
                Kings, Shep, Ather, Hey, Lin, Mor, Ox]
        last: [by, ford, wood, well, ton, ley, more, field, ham, worth, dale, wick, ridge, shaw, combe, low, stead, cote, wright, mere,
               hurst, bury, borne, thwaite, croft, gate, hope, stow, thorpe, ster, den, ling, wade, hold]
      - weight: 2 # short English surnames, whole
        first: [Kemp, Crane, Hart, Marsh, Wolfe, Gale, Stone, Wood, Lamb, Bell, Cross, Ford, Fox, Hale, Hill, Hunt, Lane, Moss, Nash, Page,
                Pike, Reed, Rowe, Shaw, Webb, West, Wren, Brook, Cole, Frost, Grey, Keane, Lowe, Mead, Pratt, Rook, Thorpe, Vane, Burke,
                Clay, Dale, Finch, Birch, Kerr, Tull, Voss, Platt, Fenn, Ames, Bain, Blythe, Bond, Booth, Bray, Brett, Bryce, Burr, Cade, Carr,
                Chase, Cope, Croft, Dove, Dunn, Flint, Gage, Garth, Glass, Hayes, Holme, Hoyle, Hume, Knox, Lisle, Lyle, Mott, Neale, Nye,
                Orme, Pell, Penn, Poole, Rhodes, Royce, Sharpe, Stroud, Tate, Trask, Vail, Wace, Weir, Yorke, Blake, Brand, Locke]
        last: [""]
      - weight: 1 # longer ones: Amberley, Osterby, Waterbury
        first: [Water, Otter, Haver, Amber, Elder, Ever, Ather, Ember, Under, Hazel, Ellis, Ashen, Alder, Raven, Oster, Aber]
        last: [bury, ley, by, ton]

