# SOUND RULES for building names (f346): npc/names.py build().
#
# A built name is pieces joined: one from `first`, then none or more from `middle` (how many is drawn from `middles`, count: weight),
# then one from `last`. A vowel that ends one piece and starts the next is said once ("ala" + "aric" is "Alaric"). Each kind of name
# (male, female, family) is a list of forms; a form is drawn by its weight, so a people can have two styles of name (an elf family is
# sometimes flowing syllables, sometimes two words of the woods run together).
#
# Every built name must then keep the rules below: its length, how many vowels or consonants may run together, the people's own
# `avoid` patterns and the shared ones, and never be one of the `taken` names. Names that fail are thrown away and built again.
#
# These are first draft, written fresh for Meravia: add, cut or rewrite any piece. tools/name_samples.py prints what they make.

length: [3, 10]                 # the shortest and longest name, in letters, unless a people says otherwise
max_vowels: 2                   # vowels that may run together ("ae" yes, "aea" no)
max_consonants: 3               # consonants that may run together ("ldr" in Baldric yes, four no)

avoid:                          # never inside any name (patterns on the lower-case name)
  - "q[^u]"
  - "(fuk|fuc|shit|cunt|dick|cock|piss|twat|wank|nig|fag|slut|whor|rape|anus|penis|tits|kkk|nazi)"
  - "(.{2,})\\1"                # no piece said twice running ("dordor")
  - "ordor"                     # too near Mordor

