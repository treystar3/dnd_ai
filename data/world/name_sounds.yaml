        first: [Ae, Bri, Cal, Dar, El, Fay, Gwen, Is, Jes, Kai, Lio, Mir, Nim, Pe, Rhos, Ser, Tam, Vai, Wil, Ys, Ali, Cel, Ei]
        middle: [a, e, i, la, ri]
