# GOODS - things that stack: herbs, food, consumables, books and (f545) trade goods.
#
# kind:       herb | food | consumable | book | codex | trade
# rank:       for a book (f397): the spell rank it teaches (data/rules/spells.yaml books)
# price:      value in copper (100 copper = 1 silver). Merchants buy at a fraction of this.
# stack:      how many fit in one pack slot
# restores:   for consumables and food - percent of each pool restored when used
# feeds:      for food - how much hunger eating it clears (0-100)
# cures:      statuses a consumable removes (bleeding, slowed, frightened...)
# combat:     true if it can be used mid-fight (one a turn; it does not use up your action)
# grows_in:   for herbs - biomes where foraging can find it, with a chance per forage
# drops_from: for food - creatures that can yield it when killed
# mass:       (f545's review) said as a mass, never counted: "some salt", not "three salts" (a gift of several in words)

- {id: silverleaf,   name: silverleaf,   kind: herb, price: 15, stack: 10, grows_in: {forest: 0.5, farmland: 0.2},
   description: "A pale, silver-backed leaf that steeps into a healing draught."}
- {id: moonpetal,    name: moonpetal,    kind: herb, price: 25, stack: 10, grows_in: {forest: 0.3},
   description: "A blue-white flower that closes by day; the base of mana tonics."}
- {id: yarrow,       name: yarrow,       kind: herb, mass: true, price: 8,  stack: 10, grows_in: {farmland: 0.5, forest: 0.3},
   description: "A feathery wound-herb; packed into a bandage it stanches bleeding."}
- {id: wild_garlic,  name: wild garlic,  kind: herb, mass: true, price: 5,  stack: 10, grows_in: {forest: 0.4, farmland: 0.4},
   description: "Pungent and plentiful; it keeps travel food edible."}

- {id: venison,      name: venison,      kind: food, mass: true, price: 20, stack: 10, drops_from: [deer, elk],
   feeds: 40, restores: {health: 8, stamina: 10}, description: "Lean deer meat."}
- {id: boar_meat,    name: boar meat,    kind: food, mass: true, price: 20, stack: 10, drops_from: [boar, giant_boar],
   feeds: 40, restores: {health: 8, stamina: 10}, description: "Dark, fatty boar meat."}
- {id: wolf_meat,    name: wolf meat,    kind: food, mass: true, price: 12, stack: 10, drops_from: [wolf, dire_wolf, worg, winter_wolf],
   feeds: 35, restores: {health: 6, stamina: 8}, description: "Tough, gamey meat; better stewed than roasted."}
- {id: hearty_meal,  name: hearty meal,  kind: food, price: 30, stack: 5, feeds: 60, restores: {stamina: 20, health: 10},
   description: "Meat seared over a fire with whatever the pack had to spare: a proper meal, hot and filling."}

- {id: healing_draught, name: healing draught, kind: consumable, price: 150, stack: 5, combat: true,
   restores: {health: 30}, description: "A bitter green draught that knits wounds closed."}
- {id: mana_tonic,      name: mana tonic,      kind: consumable, price: 150, stack: 5, combat: true,
   restores: {mana: 30}, description: "A cold, faintly glowing tonic that refills spent magic."}
- {id: bandage,         name: bandage,         kind: consumable, price: 20,  stack: 10, combat: true,
   restores: {health: 10}, cures: [bleeding], description: "A yarrow-packed linen bandage."}
- {id: torch,          name: torch,           kind: consumable, price: 8,   stack: 10, combat: false,
   description: "A pitch-soaked brand; burns for a long delve."}
- {id: trail_ration,    name: trail ration,    kind: consumable, price: 15,  stack: 10, combat: false,
   feeds: 35, restores: {stamina: 30, health: 5}, description: "Dried meat and hard bread, seasoned to keep."}

# (f397) Spell books: each teaches one rank of one of your spells, once your level allows that rank (engine/spells.py).
- {id: tome_second_circle,  name: tome of the second circle,  kind: book, rank: 2, price: 600,    stack: 5,
   description: "A thumbed primer of the second circle: how a first spell is driven harder."}
- {id: tome_third_circle,   name: tome of the third circle,   kind: book, rank: 3, price: 3000,   stack: 5,
   description: "A journeyman's workbook of the third circle, its margins thick with corrections."}
- {id: tome_fourth_circle,  name: tome of the fourth circle,  kind: book, rank: 4, price: 12000,  stack: 5,
   description: "A bound treatise of the fourth circle, clasped in brass."}
- {id: tome_fifth_circle,   name: tome of the fifth circle,   kind: book, rank: 5, price: 45000,  stack: 5,
   description: "A master's grimoire of the fifth circle, its ink still faintly warm."}
- {id: tome_sixth_circle,   name: tome of the sixth circle,   kind: book, rank: 6, price: 140000, stack: 5,
   description: "A heavy codex of the sixth circle, written in three hands across three lifetimes."}
- {id: tome_seventh_circle, name: tome of the seventh circle, kind: book, rank: 7, price: 400000, stack: 5,
   description: "A sealed codex of the seventh circle; few who open it can read it."}

# (f397) A codex: one named spell, sealed in it when it is found (the item carries the spell; engine/spells.py named).
- {id: codex, name: sealed codex, kind: codex, price: 50000, stack: 1,
   description: "A codex bound in something older than leather, holding one great working."}

# (f545) Trade goods: what a town makes, eats, burns and builds with, carried by the sack, bolt and jar. A situation turns on these
# (data/rules/situations.yaml goods); merchants and the trades that make them sell them (data/world/roles.yaml), and anyone who buys
# "any" buys them. They are carried and traded, never used: none grows wild or drops from a creature, so no forage, garden or kill
# draws them.
- {id: salt,        name: salt,        kind: trade, mass: true, price: 12, stack: 10, description: "Coarse grey salt in a waxed sack; meat and fish keep with it."}
- {id: grain,       name: grain,       kind: trade, mass: true, price: 6,  stack: 10, description: "A sack of threshed barley and rye."}
- {id: flour,       name: flour,       kind: trade, mass: true, price: 8,  stack: 10, description: "Milled flour, sacked against the damp."}
- {id: cloth,       name: cloth,       kind: trade, mass: true, price: 30, stack: 10, description: "A bolt of plain woven cloth, undyed."}
- {id: sawn_planks, name: sawn planks, kind: trade, price: 20, stack: 10, description: "A bundle of sawn planks, roped for carrying."}
- {id: dried_fish,  name: dried fish,  kind: trade, mass: true, price: 10, stack: 10, description: "A string of split and dried fish, stiff as bark."}
- {id: wine,        name: wine,        kind: trade, mass: true, price: 25, stack: 10, description: "A stoppered jar of red wine."}
- {id: lamp_oil,    name: lamp oil,    kind: trade, mass: true, price: 10, stack: 10, description: "A sealed flask of lamp oil."}
- {id: rope,        name: rope,        kind: trade, mass: true, price: 12, stack: 10, description: "A coil of hemp rope, fifty feet of it."}
- {id: candles,     name: candles,     kind: trade, price: 6,  stack: 10, description: "A bundle of tallow candles tied by their wicks."}
