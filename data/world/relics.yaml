# NAMED RELICS - fixed, hand-made legendary items sold in the great cities by a relic dealer. This is the POOL: each new
# campaign draws one relic per dealer town from it (engine/property.stock), so every run has a different shelf. One of each
# in a run; once bought, a relic is gone from the shelf for good. Prices are in copper (10,000 = 1 gold).
# base/material/effect must exist in the catalog, materials and legendary_effects. Properties are fixed, not rolled.

