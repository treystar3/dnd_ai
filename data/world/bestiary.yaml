# BESTIARY - every kind of creature that can exist in Rivia.
#
# Imported once from the D&D 5e System Reference Document 5.1 (see CREDITS.md) and classified for Rivia.
# D&D's stat blocks are NOT used: the engine builds every creature's stats from its level and profile
# with the same rules as the player. Edit or delete freely - this file is yours now.
#
# category:    what kind of thing it is
# challenge:   the SRD's danger rating, kept for reference; levels were derived from it
# levels:      [min, max] level range this creature normally appears at. Edit to rebalance.
# biomes:      where it lives. A zone only rolls creatures whose biomes match the zone's biome.
#              primeval and cracked_plains are special: nothing appears there unless a place has that biome.
# rarity:      common | uncommon | rare | legendary - how often it is rolled for a zone
# temperament: passive (avoids you) | territorial (attacks if you come close) | aggressive (hunts you)
# group:       [min, max] how many appear together. Missing means alone.
# colonies:    monstrous races that can form camps and settlements of their own. Never friendly.
# unique:      at most one in the world; never rolled for a zone, only placed deliberately
# roster:      false means it never appears as wildlife (person templates)
# attacks:     attack names from the SRD, for flavor; the engine decides damage
# profile:     the SRD's six ability scores, used only as PROPORTIONS for how this creature's stats are split
# notes:       why it was classified this way, or things to review

