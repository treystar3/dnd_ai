# ARMOR SETS - wearing several pieces of the same material gives a bonus.
#
# Only armor counts: head, body, hands, feet and a shield. Weapons, rings and amulets never do, so a ring never has to
# be passed over for the sake of a set. Two matching pieces give the `two` bonus, four give `four` (and keep `two`).
#
# A set is a reward for finishing an outfit, never a reason to keep a worse one: every bonus is small beside what a newer or
# rarer piece gives by itself, and the numbers climb with the material's era (see `caps`; engine tests enforce them).
# No set depends on what you are fighting.
#
# effects:  [stat, trigger, magnitude]   a stat bonus, like any property
# fight:    {mechanic: value}            combat mechanics (the same ones legendary armor uses)
# world:    {mechanic: value}            things the world answers to, away from combat
# Descriptions are written from these by the engine.

thresholds: [2, 4]

# Strength ceilings by the material's first level: a stat bonus may not exceed `stat`; a mechanic may not exceed this share of
# the value the same mechanic has on a legendary item.  (Flags with no value - sanctified, unyielding - need `flags: true`.)
caps:
  - {from: 1,   stat: 5,  share: 0.30, flags: false}
  - {from: 40,  stat: 8,  share: 0.45, flags: sanctified}
  - {from: 120, stat: 11, share: 0.65, flags: sanctified}
  - {from: 300, stat: 15, share: 0.90, flags: true}

