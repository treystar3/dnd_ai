# Facts about Rivia, tagged by who knows them.
# The Taking is a southern human custom: Riverhaven and Amaranth send out Seekers who take magic-sensitive children from the smaller
# settlements around them (Parth, Willowmead, Greyhollow, Kelpmoor). The crown at Valecourt thinks it unbecoming and takes no child
# itself, but will not police another house's customs; its people look down on the south for it and keep that to themselves with
# strangers. The further north, the more open the disdain. Eldervale, Ironvein, Frostholm, Sunspire and the far lands each see magic
# their own way, and know the Taking only as a southern custom.
#
# known_by: knowledge groups (from world.yaml) whose members know this fact.
#           An NPC knowing a fact doesn't mean they'll share it - personality decides that.
# found_at: places where the player can discover it in the world (a notice, a record, a carving).

- id: magic_rare_daily
  text: In Parth, magic is known but almost never part of ordinary life - the gifted are taken young, so folk light fires with flint and heal with herbs.
  known_by: [parth_locals]

- id: the_taking
  text: >
    Children who show signs of magic must be reported. Seekers sent by the noble houses of
    Riverhaven and Amaranth test the children of the smaller settlements and take the gifted away to be trained and placed in noble houses.
    Officially it is the Summons; common folk call it the Taking.
  known_by: [parth_locals, willowmead_locals, greyhollow_locals, kelpmoor_locals, riverhaven_locals, amaranth_locals]
  found_at: [trading_square]

- id: taking_payment
  text: A family whose child is taken receives a payment from the house that takes them.
  known_by: [parth_locals, willowmead_locals, greyhollow_locals, kelpmoor_locals, riverhaven_locals, amaranth_locals]

- id: taking_is_southern
  text: The Taking is the south's custom - it is Riverhaven and Amaranth that send the Seekers. The crown at Valecourt has never sent one and takes no child.
  known_by: [valecourt_locals, nobility, scholars, merchants, riverhaven_locals, amaranth_locals, parth_locals, willowmead_locals, greyhollow_locals, kelpmoor_locals]

- id: crown_tolerates_taking
  text: The crown thinks the Taking unbecoming and says so only in private; in public it leaves the southern houses to their own customs, for the sake of peace, and will not police them.
  known_by: [valecourt_locals, nobility, scholars]

- id: valecourt_looks_down
  text: People of Valecourt think less of the south for the Taking, and would not say so to a traveller they had just met.
  known_by: [valecourt_locals, nobility, merchants]

- id: north_scorns_taking
  text: The further north one goes, the less patience there is for the Taking - spoken of with disgust in Greyhollow, barely believed in Ironvein and Frostholm, where a Seeker would not be made welcome.
  known_by: [greyhollow_locals, ironvein_locals, frostholm_locals, eldervale_locals, hrimgard_locals, skarnhelm_locals, merchants]

- id: taken_rarely_return
  text: Children who are taken almost never come home again.
  known_by: [parth_locals, willowmead_locals, greyhollow_locals, riverhaven_locals, redstone_locals, merchants]

- id: hiding_is_crime
  text: Hiding a gifted child is a crime. Families caught doing it are punished.
  known_by: [parth_locals, willowmead_locals, greyhollow_locals, kelpmoor_locals, riverhaven_locals, amaranth_locals]
  found_at: [trading_square]

- id: seekers_visit
  text: Seekers travel the countryside every few years. Nobody knows exactly when one will come.
  known_by: [parth_locals, willowmead_locals, greyhollow_locals, redstone_locals]

- id: mages_serve_nobles
  text: In noble houses, mages do daily work - keeping fires, preserving food, lighting halls.
  known_by: [nobility, mages, merchants]

- id: parth_on_trade_road
  text: Parth exists because the trade road crosses the Wend there; travelers keep it alive.
  known_by: [parth_locals, merchants]

- id: greywood_wolves
  text: Wolves come out of the Greywood after sheep, especially in winter.
  known_by: [parth_locals, shepherds, hunters]

- id: greywood_worse
  text: In hard winters, things worse than wolves come out of the Greywood. Few who say so have seen them.
  known_by: [shepherds, hunters, guild]

- id: watch_guild_friction
  text: The watch resents that villagers bring real trouble to the guild instead of to them.
  known_by: [guards, guild]

- id: temple_older_than_parth
  text: >
    Parth's temple is a rededicated roadside temple. Its lowest stones are older than the
    priest can explain, and he dislikes being asked. Today it serves the Sun Warden, as
    the whole kingdom does.
  known_by: [temple, scholars]

# --- the wider world (from the world writeup) ---

- id: parth_crossroads
  text: Parth sits where the roads of the south meet - north to Greyhollow, northeast to Ironvein, east to Redstone, south to Willowmead and southwest to Kelpmoor and the sea.
  known_by: [everyone]

- id: taking_seen_from_outside
  text: The southern cities of Riverhaven and Amaranth take their magically gifted children into the service of their nobles. Outsiders find the custom strange, cruel, or simply foolish.
  known_by: [eldervale_locals, ironvein_locals, frostholm_locals, sunspire_locals, thalassor_locals, skarnhelm_locals, frontier_locals, redstone_locals, merchants]

- id: willowmead_slow
  text: Willowmead is a slow, rural place of farms and orchards, one of the region's important farming villages. Magic stays outside village life there.
  known_by: [willowmead_locals, parth_locals, merchants]

- id: greyhollow_trades
  text: Greyhollow grew up around what lies under its hills - mining, timber and stonework - and sends its ore and wood south to Parth.
  known_by: [greyhollow_locals, parth_locals, merchants]

- id: greyhollow_magic
  text: In Greyhollow, magic is thought of as something for the wealthy or the specialized, not for working folk.
  known_by: [greyhollow_locals]

- id: eldervale_ancient
  text: Eldervale is older than the kingdoms around it. Many of its traditions predate them entirely.
  known_by: [eldervale_locals, scholars]

- id: eldervale_magic
  text: In Eldervale, magic is simply part of existence, as natural as the forest - it belongs to no class of people.
  known_by: [eldervale_locals, mages]

- id: ironvein_craft
  text: Ironvein runs through the mountains and the vast deeps beneath them; its people live by mining, craft and engineering.
  known_by: [ironvein_locals, merchants]

- id: ironvein_magic
  text: In Ironvein, magic is a craft like any other - something to be studied, refined and built into the works of civilization.
  known_by: [ironvein_locals, mages]

- id: frostholm_endurance
  text: Frostholm's isolation and the harshness of the north have made its people value endurance, community and preparation above all.
  known_by: [frostholm_locals]

- id: frostholm_magic
  text: In Frostholm, powerful magic is rare and treated with suspicion and caution - long hardship taught them to.
  known_by: [frostholm_locals]

- id: frostpass_winter
  text: The Frostpass between Dunmarrow and Frostholm is far harder in winter, and some winters it cannot be crossed at all.
  known_by: [frostholm_locals, ironvein_locals, merchants]

- id: riverhaven_trade
  text: Riverhaven is one of the kingdom's great centers of trade, a meeting point for merchants and travelers from everywhere.
  known_by: [riverhaven_locals, merchants, everyone]

- id: riverhaven_divide
  text: In Riverhaven, the wealthy and the institutions know magic well; ordinary people hardly at all. The divide is like Parth's, but softer.
  known_by: [riverhaven_locals]

- id: redstone_frontier
  text: Redstone is the last real stop before the desert - caravans heading east refit and hire guards there.
  known_by: [redstone_locals, merchants, parth_locals]

- id: redstone_magic
  text: In Redstone, magical ability is uncommon, and where it appears it carries spiritual or cultural weight among its peoples.
  known_by: [redstone_locals]

- id: sunspire_water
  text: Sunspire is built around one of the Sunscar's great sources of water, and its whole culture turns on water.
  known_by: [sunspire_locals, merchants]

- id: sunspire_magic
  text: In Sunspire, magic is common and bound up with faith - seen as a gift of the natural and divine forces of the world, not a privilege of rank.
  known_by: [sunspire_locals, mages]

- id: valecourt_court
  text: Valecourt is the political heart of the kingdom - noble families, courts and institutions competing for influence.
  known_by: [valecourt_locals, nobility, merchants]

- id: valecourt_magic
  text: In Valecourt, magic is highly respected and almost wholly held by the nobility and institutions of power. The kingdom's magical hierarchy is plainest there.
  known_by: [valecourt_locals, nobility, mages]

- id: hollow_tales
  text: Travelers' tales speak of a place called the Hollow, somewhere beyond the known lands. A city, the remains of one, or something that only looks like one - no two tellings agree, and no road leads there.
  known_by: [everyone]

- id: hollow_no_magic
  text: Some say there is no magic at all in the Hollow.          # one of the conflicting accounts
  known_by: [frostholm_locals, greyhollow_locals]

- id: hollow_other_rules
  text: Some say magic in the Hollow obeys entirely different rules.   # one of the conflicting accounts
  known_by: [eldervale_locals, scholars, mages]

- id: great_halls_pay_more
  text: >
    The guild's halls are not equal. Those in the hard-edged cities (Frostholm and Sunspire above all, and Ironvein and
    Valecourt after them) post the biggest contracts, with expeditions to far, dangerous country, and pay a good deal
    more for the same work than the smaller halls do. The greatest halls of all are in the far lands - Cinderhold,
    Hrimgard and Dunmarrow - and they pay nearly double. Members who have outgrown the work at their home hall go there.
  known_by: [guild, merchants]

# --- the far lands ---

- id: far_lands_exist
  text: >
    Beyond the settled kingdom are five far lands, each reached by one long road from one great city: the Ashen Reach beyond
    Sunspire, the Stormcrown beyond Frostholm, the Deep Roads below Ironvein, the drowned coast west of Valecourt and the Jade Maw
    south of Riverhaven. The creatures there are not like the ones at home, and the guild's highest ranks work nowhere else.
  known_by: [guild, merchants, scholars]

- id: ember_road_danger
  text: The Ember Road to Cinderhold is two weeks of ash and salt flat; the only caravans that make it pay for escorts in dragonborn steel.
  known_by: [sunspire_locals, cinderhold_locals, merchants]

- id: cinderhold_fires
  text: Cinderhold's forges are fed from the caldera itself, and the smiths there work metal no other city can heat. Gear made there outlasts its makers.
  known_by: [cinderhold_locals, sunspire_locals, merchants, guild]

- id: hrimgard_storm_song
  text: Hrimgard sings to the storm each night. The song keeps the lightning off the roofs, and it is said to be a language the giants taught the first settlers.
  known_by: [hrimgard_locals, frostholm_locals, merchants]

- id: giants_halls
  text: The giants of the Stormcrown do not raid the city; they trade, and sometimes accept a challenge. Those who refuse a giant's challenge are not welcome at its feasts again.
  known_by: [hrimgard_locals, frostholm_locals, guild]

- id: dunmarrow_bell
  text: When Dunmarrow's war-bell tolls twice, the gates close, and nobody is let in till the bell tolls once. The gatekeepers do not say what comes up the stair on those nights.
  known_by: [dunmarrow_locals, ironvein_locals, guild]

- id: lightless_deep_madness
  text: Parties that go far into the Lightless Deep sometimes come back counting more than they set out with. The dwarves have a rite for it.
  known_by: [dunmarrow_locals, ironvein_locals, mages, scholars]

- id: brinewatch_lanterns
  text: Brinewatch keeps lanterns burning on every quay all night. The old sailors say the drowned will not climb a lit stair.
  known_by: [brinewatch_locals, valecourt_locals, merchants]

- id: drowned_kingdom
  text: The kingdom that sank off the western coast was called Ys-Calavar. Its bells can still be heard at low tide, and its salvage makes more fortunes than the sea takes.
  known_by: [brinewatch_locals, scholars, nobility, merchants]

- id: jade_maw_swallows
  text: The Jade Maw is said to have swallowed a whole army of the old empire. The temples under its roots are real, and so are the things that guard them.
  known_by: [amaranth_locals, riverhaven_locals, scholars, guild]

- id: sepulchre_dead_empire
  text: The Sepulchre Fields hold the burial grounds of an empire that predates every kingdom. The graves hold more than bones, and some of them hold armies.
  known_by: [brinewatch_locals, scholars, nobility, mages]
  found_at: [sepulchre_fields]

# --- the uttermost reaches ---

- id: tempest_throne_voice
  text: Above the Thunder Spires there is a hall where the storm answers questions. Hrimgard's skalds say it has given three true answers since the first thane, and that each was paid for.
  known_by: [hrimgard_locals, frostholm_locals, guild]
  found_at: [tempest_throne]

- id: storm_sovereign_oath
  text: The giants of the Stormcrown swore an oath to something in the lightning before they built their first hall. They will not say what they were promised, only that the oath is not finished.
  known_by: [hrimgard_locals, scholars]

- id: furnace_of_ages_forge
  text: Cinderhold's first smiths took their fire from a furnace under the caldera that was lit before there were smiths. They still send one apprentice a generation to feed it, and none have returned.
  known_by: [cinderhold_locals, sunspire_locals, guild]
  found_at: [furnace_of_ages]

- id: slag_titans
  text: The titans of the Furnace walk to the shore when the caldera sags. Caravan masters on the Ember Road say a thin black smoke on the horizon means turn back.
  known_by: [cinderhold_locals, sunspire_locals, merchants]

- id: abyssal_gallery_carvings
  text: Below the Lightless Deep is a gallery carved with scenes from before the first dwarf. The dwarves of Dunmarrow seal any copy of those scenes and will not say why.
  known_by: [dunmarrow_locals, ironvein_locals, scholars]
  found_at: [abyssal_gallery]

- id: first_dwarf_makers
  text: Dunmarrow's rune-masters teach that the dwarves did not make the Deep Roads. They found them, already finished, and learned their craft from the machines that still keep them.
  known_by: [dunmarrow_locals, mages, scholars]

- id: leviathan_trench_tide
  text: At the lowest tides a cleft opens off the drowned shore, a mile of black water between coral walls. Brinewatch's wreck-brokers say nothing that goes in at the ebb has ever come back before the flood.
  known_by: [brinewatch_locals, valecourt_locals, merchants]
  found_at: [leviathan_trench]

- id: drowned_goddess
  text: The kingdom that sank on the western coast was devoted to Maerith the Tide Caller, whom the coast still calls the Mother of Tides. The wrecks off Brinewatch are said to hum on the night she is remembered.
  known_by: [brinewatch_locals, temple, scholars]

- id: heartroot_sanctum_roots
  text: The oldest temple in the Jade Maw was never abandoned. The jungle grew around it, and what tends the roots there keeps the vines from the city, for a price Amaranth's herbalists will not discuss.
  known_by: [amaranth_locals, riverhaven_locals, scholars]
  found_at: [heartroot_sanctum]

- id: maw_serpent_god
  text: The jungle empire's last priest-kings did not die. Amaranth's guides say they gave themselves to something coiled under the temples, after trying to halt the turning of Ixmara the Cycle Keeper, and that the Maw has been quietly growing since.
  known_by: [amaranth_locals, scholars]

- id: throne_of_ashes_legion
  text: In the dead empire's last palace the armoured dead still stand at the gates. They have not been told the war is over, and guild veterans say they answer to a name, not a banner.
  known_by: [brinewatch_locals, guild, scholars]
  found_at: [throne_of_ashes]

- id: unburied_legion
  text: The legion of the Sepulchre Fields was buried standing, in ranks, with their spears. Barrow-delvers learn early not to dig where the rows are straight.
  known_by: [brinewatch_locals, guild, temple]

- id: worldfrost_wyrm_bones
  text: The ice miles thick on the Worldfrost Expanse is full of dragon bones. Frostholm's trappers say the wyrms there are not extinct, only sleeping, and a deep crack or a hard winter wakes one.
  known_by: [frostholm_locals, hrimgard_locals, hunters]
  found_at: [worldfrost_expanse]

- id: glass_sea_fire
  text: The Glass Sea was sand until something burned it to a mirror. Sunspire's scholars date the fire from the time of the dead empire, and cannot agree on who lit it.
  known_by: [sunspire_locals, redstone_locals, scholars]
  found_at: [glass_sea]

- id: glass_sea_singing
  text: Caravans that cross the Glass Sea at night hear it sing. Anyone who follows the sound is found at dawn, standing, facing the same direction.
  known_by: [sunspire_locals, redstone_locals, merchants]

- id: blackwater_deeps_lights
  text: Pale lights move under the black water of the Blackwater Deeps. Riverhaven's bargemen say the fens are older than the river, and that the lights are the drowned forest remembering.
  known_by: [riverhaven_locals, willowmead_locals, merchants]
  found_at: [blackwater_deeps]

- id: shattered_downs_battle
  text: The Shattered Downs are a giants' battlefield, and the weapons are still in the ground. Valecourt's heralds note that no noble house has ever claimed the land, and that the old giants' pact says nobody may.
  known_by: [valecourt_locals, greyhollow_locals, scholars]
  found_at: [shattered_downs]

- id: sunken_crown_capital
  text: The drowned capital of the lost western kingdom lies in a ring of cliffs, its towers still lit by wrecker's fires nobody lit. The tide goes out further every year.
  known_by: [brinewatch_locals, valecourt_locals, merchants]
  found_at: [sunken_crown]

- id: orenna_name
  text: The goddess who sent you back gave her name as Orenna. You have never heard anyone else say it.
  known_by: [nobody]

# --- faith and the old gods ---

- id: gods_gentle_origin
  text: >
    The temples teach that the gods shaped the peoples out of love, and that each people was given its place in the world.
  known_by: [everyone]

- id: gods_many_settlements
  text: >
    Each great city holds to its own god, and the villages around it follow the same. In Wend Vale and the lands near Parth, that is the Sun Warden.
  known_by: [everyone]

- id: kingdom_sun_warden
  text: >
    Valecourt's kingdom honors Aurelan the Sun Warden, keeper of oaths and of the crown. Parth, Willowmead, Greyhollow and Redstone keep his rites, and the crown is sworn on his name.
  known_by: [parth_locals, willowmead_locals, greyhollow_locals, redstone_locals, valecourt_locals, temple, scholars]

- id: god_aurelan
  text: >
    Aurelan the Sun Warden is the god of light, oaths and the crown. His faithful swear by his flame and keep their word because a broken oath is said to dim the sun a little.
  known_by: [valecourt_locals, temple, scholars]

- id: god_nhaelis
  text: >
    Nhaelis the Green Huntress rules wind and wood in Eldervale. Her faithful take only what they will use, and leave the first of any kill to the trees.
  known_by: [eldervale_locals, temple, scholars]

- id: god_kharun
  text: >
    Kharun the Mountain Smith is the god of stone and forge in Ironvein. His faithful hold a thing is worth what it takes to make, and bless the first hammer-blow of any work.
  known_by: [ironvein_locals, temple, scholars]

- id: god_nythra
  text: >
    Nythra the Deep Watcher is the god of the dark and the deep in Dunmarrow. Her faithful keep silence as devotion, and trust secrets to her before they trust them to people.
  known_by: [dunmarrow_locals, temple, scholars]

- id: god_isrenna
  text: >
    Isrenna the Frost Marshal is the god of cold and endurance in Frostholm. Her faithful do not complain of winter; they count enduring it as prayer.
  known_by: [frostholm_locals, temple, scholars]

- id: god_throndar
  text: >
    Throndar the Storm Judge is the god of lightning and verdicts in Hrimgard. The giants settle disputes under open sky so he may rule, and believe the storm falls on the guilty.
  known_by: [hrimgard_locals, temple, scholars]

- id: god_teluun
  text: >
    Teluun the River Steward is the god of rivers and trade in Riverhaven. Merchants pour a little water into the river before a deal, and call an honest scale his work.
  known_by: [riverhaven_locals, merchants, temple, scholars]

- id: god_maerith
  text: >
    Maerith the Tide Caller is the god of the sea in Brinewatch. Sailors leave a lit lantern for her before a voyage, and name the drowned aloud so she will carry them gently.
  known_by: [brinewatch_locals, temple, scholars]

- id: god_dahlira
  text: >
    Dahlira the Hearth Tender is the god of hearth, home and hospitality in Sunspire. Her faithful never turn a guest from the door, and keep a fire or a cup of water ready for one.
  known_by: [sunspire_locals, temple, scholars]

- id: god_ashkar
  text: >
    Ashkar the Pyre Herald is the god of fire and rebirth from ash in Cinderhold. Her faithful burn their dead and say that what is lost in fire is only waiting to return.
  known_by: [cinderhold_locals, temple, scholars]

- id: god_ixmara
  text: >
    Ixmara the Cycle Keeper tends growth, decay and renewal in Amaranth. Her faithful see no tragedy in rot, only the turning of one thing into the next.
  known_by: [amaranth_locals, temple, scholars]

- id: god_morrowen
  text: >
    Morrowen the Ferryman carries the dead across for a coin. The old burial cult of the Sepulchre Fields still lays a coin on the tongue so the passage is paid.
  known_by: [temple, scholars]

- id: ash_cults_burn
  text: >
    Some followers of fire have turned from Ashkar's rebirth to something hungrier. They are called the burning faithful, and are feared in Cinderhold.
  known_by: [cinderhold_locals, temple, scholars]

- id: tithe_boxes
  text: >
    Most temples keep a tithe box by the door. A coin dropped in is a gift to the god and is remembered by the priests.
  known_by: [everyone]

- id: chosen_commune
  text: >
    Temple lore holds that a chosen acolyte or a champion marked by a patron god can sometimes commune with them. Priests say it happens rarely and never on demand.
  known_by: [temple, scholars]

- id: peoples_one_god
  text: >
    Temple teaching traces each people to a single god who shaped them. Scholars note that the accounts agree a little too neatly, as though written by one hand.
  known_by: [temple, scholars]

- id: orenna_servants
  text: >
    The peoples of Rivia were made by the gods as servants: rows of figures that worked and did not choose. The temples' gentler story is not what the First Hall says.
  known_by: [nobody]

- id: orenna_gift
  text: >
    Orenna knelt among the gods' servants and breathed life and free will into them. Every people that is awake today is awake because of her.
  known_by: [nobody]

- id: orenna_revolt
  text: >
    The freed peoples turned on the gods. The gods spared them, because they had nothing else, and bound Orenna in their place.
  known_by: [nobody]

- id: orenna_forgetting
  text: >
    For thousands of years the gods have shaped the world from behind it, ending her worship and cutting her name from every wall. The door at the bottom of the First Hall is the place where you met her.
  known_by: [nobody]

- id: orenna_order
  text: >
    A small group who remember keep a half-circle coin cut through with a single line. Each time one of them has gone public, they were dead within days.
  known_by: [nobody]

- id: orenna_trail_lecturer
  text: >
    A lecturer was killed with no struggle, his eyes closed. A watchman saw a man in plain cloth leave at dawn, weeping.
  known_by: [nobody]

- id: orenna_trail_letter
  text: >
    A letter to a temple was sent on to the High Keeper's office at Valecourt, and a reply came back before the writer died.
  known_by: [nobody]

- id: orenna_trail_warning
  text: >
    The Sun Warden's temples report to one office at Valecourt on a fast relay. A private warning was read before its recipient ever saw it.
  known_by: [nobody]

- id: orenna_executioner
  text: >
    The killer is a man bound by oath to obey whoever holds his seal. He weeps for the dead, and he cannot name his holder.
  known_by: [nobody]

- id: orenna_registry
  text: >
    The register of bound services points to the High Keeper of Valecourt, who has held the seal of a champion of the Sun Warden for twenty-two years.
  known_by: [nobody]

- id: orenna_last_breath
  text: >
    Orenna's last breath is held in you. It will be spent the first time you would die.
  known_by: [nobody]

- id: valecourt_tolerates_taking
  text: >
    Valecourt's nobles disapprove of the Taking. They say a kingdom is kept at peace by tolerating everyone's customs, even the ones
    they disagree with, and the crown has never forbidden it.
  known_by: [valecourt_locals, nobility]

# --- the new lands ---

- id: thalassor_overhang
  text: Thalassor's Hanging College stands on a great shelf of rock, the Overhang, above the harbour. The rock is held up by keystone wards that the Fellows renew every year.
  known_by: [thalassor_locals, scholars, mages]

- id: thalassor_college
  text: >
    The Hanging College was founded and is still run by elves, who teach magic as a gift. Students of every people are welcome, and no Seeker has any
    standing there.
  known_by: [thalassor_locals, eldervale_locals, scholars, mages]

- id: thalassor_bells
  text: Thalassor's Bellwrights cast the fog bells that guide ships home. A bell is rung at every birth and every death in the city.
  known_by: [thalassor_locals, merchants]

- id: thalassor_wreck_rights
  text: Any ship that sinks within sight of Thalassor's harbour belongs to the city, and the wreck-rights are sold at auction.
  known_by: [thalassor_locals, merchants]

- id: cairnholt_cairns
  text: Cairnholt's families each keep a cairn on the moor for an ancestor, and restack it every spring. If one falls, someone must restack it before dusk.
  known_by: [thalassor_locals]

- id: whitehaven_weather
  text: Whitehaven's Weathermongers sell the day's forecast and refund the price if it proves wrong. Disputes go to the Weather Reeve.
  known_by: [thalassor_locals, merchants]

- id: wraithmoor_kept
  text: On foggy mornings the dead soldiers of the Wraithmoor stand up out of the peat, whole and unrotted. Locals call them the Kept.
  known_by: [thalassor_locals, hunters]

- id: skarnhelm_guest_right
  text: In Skarnhelm a guest is protected under the lintel for a week and a day. Breaking guest-right is the gravest crime in the city, and the sentence is exile onto the ice.
  known_by: [skarnhelm_locals, merchants]

- id: skarnhelm_reckoning
  text: Skarnhelm's clans carry great stones up the city's stair at the yearly Reckoning, and a clan's standing for the next year depends on how far it gets.
  known_by: [skarnhelm_locals]

- id: glimmerfrost_glimmer
  text: Glimmerfrost's miners cut glimmer from the crevasses, a crystal that holds daylight. Miners work in tethered pairs, and folk say the crystal dims near a liar.
  known_by: [skarnhelm_locals, merchants]

- id: kelpmoor_knots
  text: In Kelpmoor a newborn has a ship-knot tied on their wrist, untied only on the day they leave the town. People who come back are met at the quay with a feast.
  known_by: [kelpmoor_locals, merchants]

- id: saltmarsh_drag
  text: Saltmarsh Landing's houses stand on sledges, and every few years the whole village drags itself inland as the marsh creeps. They call it the Drag.
  known_by: [kelpmoor_locals]

- id: elmshade_unrooted
  text: Elmshade was settled by elves who left Eldervale and planted their own grove. Eldervale thinks it a little vulgar, and the elves of Elmshade call themselves the Unrooted.
  known_by: [eldervale_locals, parth_locals]

- id: harrowgate_barn
  text: Harrowgate is built in rings around the Tithe-Barn, where the crown stores its grain. Royal inspectors come and go.
  known_by: [valecourt_locals, merchants]

- id: kingsmere_court
  text: Kingsmere triples in size when the court arrives for the summer. The old royal summer palace lies drowned at the bottom of the lake.
  known_by: [valecourt_locals, nobility, merchants]

- id: dustwell_well
  text: Dustwell's well is so deep that a dropped coin takes a long count to land. The well-keepers say voices answer from the bottom.
  known_by: [redstone_locals, merchants]

- id: saltwind_dawn
  text: At Saltwind Oasis the spring runs sweet only at dawn. All trade is done in the first hour of daylight, and the market closes when the sun clears the ridge.
  known_by: [sunspire_locals, merchants]

- id: cinders_rest_drake
  text: Cinder's Rest is built inside the fossil ribcage of a fire-drake that died in the ash. The villagers bake in the heart-stone, which is still warm.
  known_by: [cinderhold_locals, merchants]

- id: frontier_garrison
  text: >
    The Cracked Plains are a constant battlefield. Every major city keeps a standing company at the Frontier Garrison, rotated each season, to hold the line
    against what comes across the cracks.
  known_by: [everyone]

- id: frontier_rolls
  text: At dusk the Frontier Garrison reads out the Frontier Rolls, the names of the dead since the last season. A soldier who comes back alive from beyond the line drops a pebble on the cairn.
  known_by: [frontier_locals, guards]

- id: ironvein_mines_copper
  text: Ironvein's dwarves cut copper and iron from the mines behind the city gates. The Deep Stair goes down from the lowest gallery, to the Deep Roads below.
  known_by: [ironvein_locals, merchants]
