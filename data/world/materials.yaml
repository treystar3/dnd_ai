# MATERIALS - what equipment is made of.
#
# Material is the era of a piece of gear; rarity is how special it is within that era.
#
# family:            metal | hide | cloth | wood. Each base item in items.yaml takes one family.
# levels:            [min, max] item levels this material appears at
# rarity:            how often it is chosen among materials that fit a level (common, uncommon, rare, legendary)
# weapon_multiplier / armor_multiplier: strength compared with a plain material (default 1.0)
# weight_shift:      -1 makes armor one weight class lighter, +1 heavier
# extra_properties:  bonus properties every item of this material carries
# any / weapon / armor: built-in effects. any applies to all items; weapon only to weapons; armor to everything else.
#                    Magnitudes are written at "rare" size: the game scales them by the material's rarity (equipment.yaml material_bonus_size),
#                    so a common material gives less than a rare one for the same line. Amounts of damage, defense, health, attributes and
#                    elements grow with the item level; chance stats (evasion, stealth...) grow gently (material_chance_growth).
#                    Each effect is a stat from stats.yaml, a trigger from triggers.yaml, and a percentage.
# weapon_flags / armor_flags: special mechanics -
#                    armor_pierce: % of the target's armor ignored     crit_resist: % less chance to be critically hit
#                    ward_fraction: % of armor also counts as ward
#                    adaptive: strikes as physical or spell, whichever the target resists less
# drops_from:        creatures (bestiary ids) that can drop this raw material when killed
# source:            where it comes from in the world
#
# No armor material gives a bonus against a kind of enemy: that would make a found upgrade worth leaving in the pack. Armor materials are
# rewarded as sets instead (data/world/sets.yaml). A few WEAPON materials keep an 'against' bonus (cold iron, silver, ghostwood, infernal
# iron): a weapon is picked for the fight ahead, and these are meant to be rare.

