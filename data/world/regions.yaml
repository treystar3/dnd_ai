# Regions of Rivia. Add more as you write them.

- id: wend_vale
  name: the Wend Vale          # invented
  description: >
    Farmland and low sheep hills along the river Wend, crossed by an old trade road.
    Far from the seats of power and largely ignored by them.
  ruled_by: the crown at Valecourt

- id: cracked_plains_region
  name: the Cracked Plains          # invented
  description: >
    A shattered wasteland very far from the known kingdoms. It is said that fiends and
    the hosts that oppose them use it as their battlefield. Few who go there come back.
  ruled_by: null

- id: northern_hills
  name: the northern hills
  description: Rolling hills, mixed woodland and rocky foothills north of Parth - mining and timber country.
  ruled_by: the crown at Valecourt

- id: blackpine
  name: the Blackpine
  description: An ancient forest, older and denser the deeper it goes, home to the elves of Eldervale.
  ruled_by: Eldervale

- id: grey_mountains
  name: the Grey Mountains
  description: High mountains northeast of Parth, carved through and beneath by the dwarves of Ironvein.
  ruled_by: Ironvein

- id: far_north
  name: the far north
  description: Alpine valleys, tundra, glaciers and perpetual snow beyond the Grey Mountains.
  ruled_by: Frostholm

- id: great_river
  name: the Great River lands
  description: Fertile plains, wetlands and river valleys along the Great River - the kingdom's busiest country.
  ruled_by: the crown at Valecourt

- id: eastern_frontier
  name: the eastern frontier
  description: Dry grassland giving way to scrub, red hills and badlands at the edge of the settled kingdom.
  ruled_by: nobody in particular - the crown's reach is thin here

- id: sunscar
  name: the Sunscar
  description: Immense deserts, rocky expanses, salt flats, mesas and scattered oases far to the east.
  ruled_by: Sunspire

- id: royal_vales
  name: the royal vales
  description: Fertile valleys, vineyards, managed forests and great estates around the royal capital.
  ruled_by: the crown at Valecourt

# --- the far lands: beyond the settled map, reached by long roads. Levels roughly 75-160. ---

- id: ashen_reach
  name: the Ashen Reach
  description: >
    A land of black ash plains, lava fields and a smoking caldera far beyond the Sunscar, where the earth is still being
    made. Dragonborn and genasi hold the one great city; everything else survives by the forge or not at all.
  ruled_by: Cinderhold

- id: stormcrown
  name: the Stormcrown
  description: A ring of storm-wracked peaks above the cloud line, far past the northern snows. Giants keep their halls on the high ground.
  ruled_by: Hrimgard

- id: deep_roads
  name: the Deep Roads
  description: >
    The great tunnels beneath the Grey Mountains, older than Ironvein and deeper than any mine, running down to caverns
    where the sun has never been.
  ruled_by: Dunmarrow

- id: drowned_coast
  name: the drowned coast
  description: A western shore where a kingdom sank, leaving reefs, wrecks and drowned halls half above the tide, and a free port that lives off them.
  ruled_by: Brinewatch

- id: jade_maw
  name: the Jade Maw
  description: A vast jungle south of the Great River, thick with ruined temples and hungry things, that swallows whole armies without a sound.
  ruled_by: Amaranth

- id: sepulchre
  name: the Sepulchre Fields
  description: The burial grounds of a dead empire, miles of barrow, mausoleum and bone-white road, west of the royal vales. Nothing in them rests.
  ruled_by: null

- id: gloaming_coast
  name: the Gloaming Coast
  description: >
    A fog-bound seaboard far to the north-west where the sun shows on perhaps a hundred days a year. Sound carries oddly,
    so people speak softly, keep bells on everything and measure time by the tides. The Taking is a southern custom
    and is not practised here.
  ruled_by: Thalassor

- id: rimelands
  name: the Rimelands
  description: >
    The far north-eastern corner of the kingdom, where tundra runs into the Ashen Reach. The cold is old and the people
    are proud of it. Nothing here is gentle, but nothing is cruel without a reason, and guests are treated better than at home.
  ruled_by: Skarnhelm

- id: saltmarches
  name: the Saltmarches
  description: A soft, windy coast of tidal flats and kelp beds just south-west of Parth, the gentlest country on the map.
  ruled_by: the crown at Valecourt
