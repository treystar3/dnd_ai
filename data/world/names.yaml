# NAME POOLS for the people who live in Rivia.
#
# The engine picks every resident's name from these lists (seeded by the campaign, so the same save always gets the same names), and
# never gives two people the same first name in one save. The model is only told the name and gender and writes the look and the day.
#
# Each people has: male, female and family lists. `family_from` points a people at another people's family names (half-elves
# use human family names). Names are first draft: add, cut or rewrite freely. A first name used by two different peoples is fine;
# it is the whole save that is kept free of repeats, not each list.
#
# Elf, gnome, dragonborn, genasi, orc and goliath lists are deliberately short for now: they are meant to grow, and later to be
# joined by a name builder that assembles new names from syllables.

