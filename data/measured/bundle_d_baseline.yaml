# (f475, tools/latency.py --baseline) Bundle D's baseline: what the speech tasks cost and how often they were accepted at the first
# try, and what the page showed of memory and time, measured on the tree before Bundle D (GOALS.md, 2026-11-03: S7, prompt ceilings
# measured first). A measurement, outside the data hash like card_profile.yaml; engine/data_check.py checks its task names. Bundle D's
# closing gate (f490) reads it. Do not hand-edit numbers; the blind reading's counts are the one part written by hand.
#
#   night:        the night it was measured on (pod night 20261103_0520: four 10-hour runs at ed8fdf4, continuity on), or pending
#   speech_tasks: the tasks measured (each one in budget.yaml)
#   tasks:        per task: calls, first_try (first tries accepted, of all), p50 / p95 / max prompt characters, tail_p50, cached
#   continuity:   per run, the page's C1-C8 counts (tools/page_measures.py continuity)
#   blind:        the blind reading's memory-and-time counts (tools/blind_review.md question 5), by hand once read
#   estimates:    per input of each golden, the required path's seconds with every answer at its expected size (card_profile --expected);
#                 (f490, tools/latency.py --estimates) stub_party's from its recording as first kept (f476, 26b5239), before any request
#                 changed: it was kept after the baseline night; (f495) stub_fight's the same way, from its recording as first kept;
#                 (f496) stub_fight's set again from its re-blessed recording: the rounds told after a stood-down line gained the ALREADY
#                 SHOWN lines they were owed (input 20, 34.4 -> 34.5 s), a telling corrected, not a prompt grown
#                 (2026-11-10, tools/latency.py --rekeep 0.2) f571: ground told to the narrator; owner accepts up to 0.2 s per fight
#                 input. Set again at today's price: stub_short inputs 11, 13, 15, 17, 23, 30, 34; stub_fight inputs 3, 7, 8, 11, 12,
#                 14, 15, 23, 24, 25
#                 (2026-11-15, tools/latency.py --retold stub_short --from 5) f640: recorded again once f639 gave the story its own dice
#                 after a command; from input 5 the stand-in bot plays another story (the prompts are priced as before: stub_party,
#                 which has no command, kept every price). Its 35 inputs from 5 on set to today's prices: kept over the limit, plain
#                 inputs 33 (67.4 s), 35 (69.7 s), 37 (67.1 s)
#                 (2026-11-15, tools/latency.py --retold stub_fight --from 0) f640: a new recording on seed 147; on seed 18 the fight is
#                 lost once f639 moves the dice after the draught, and the script's census refuses it. Its 19 inputs from 0 on set to
#                 today's prices, none over the limit
#   priced_at:    (f527) the speeds every estimate above was priced at, read tps, write tps and the embedder's seconds a text: the gate
#                 (tools/latency.py gate, over_limit) prices today's goldens at these, whatever card_profile.yaml says now
