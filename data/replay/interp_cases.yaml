  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}, {id: s2, name: Pip, role: server}], partner: i1}
  plan: [{kind: talk, target: i1, speech: "And how much would that room cost me?"}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: i1}}
- name: asking_anyone_picks_someone
  text: "I ask anyone here whether they've seen a caravan come through"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}, {id: g1, name: Garran Holt, role: guard}]}
