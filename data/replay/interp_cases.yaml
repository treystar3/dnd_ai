# ---- talk, and ending it
- name: greeting_by_trade
  text: "Good morning, innkeeper"
  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}, {id: s2, name: Pip, role: server}]}
  plan: [{kind: talk, target: i1, speech: "Good morning, innkeeper"}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: i1}}
- name: a_question_about_a_room_is_talk_not_buy
  text: "Hollis, do you have a room free tonight?"
  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}]}
  plan: [{kind: talk, target: i1, speech: "Do you have a room free tonight?"}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: i1}}
- name: a_whisper_is_talk
  text: "I lean in and whisper to the guard that I saw bandits on the road"
  scene: {place: trading_square, present: [{id: g1, name: Garran Holt, role: guard}, {id: m1, name: Osric Vane, role: merchant}]}
  plan: [{kind: talk, target: g1, speech: "I saw bandits on the road."}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: g1}}
- name: keeping_the_conversation_going
  text: "And how much would that room cost me?"
  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}, {id: s2, name: Pip, role: server}], partner: i1}
  plan: [{kind: talk, target: i1, speech: "And how much would that room cost me?"}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: i1}}
- name: asking_anyone_picks_someone
  text: "I ask anyone here whether they've seen a caravan come through"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}, {id: g1, name: Garran Holt, role: guard}]}
  plan: [{kind: talk, target: m1, speech: "Have you seen a caravan come through?"}]
  expect: {handled_by: interpret, kinds: [talk]}
- name: marked_speech_and_action
  text: '"Is the road north safe?" *I ask the guard*'
  scene: {place: trading_square, present: [{id: g1, name: Garran Holt, role: guard}, {id: m1, name: Osric Vane, role: merchant}]}
  plan: [{kind: talk, target: g1, speech: "Is the road north safe?"}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: g1, speech: "Is the road north safe?"}}
- name: a_goodbye_ends_the_conversation
  text: "Thanks, that's all I needed. Goodbye."
  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}], partner: i1}
  plan: [{kind: leave_conversation, speech: "Thanks, that's all I needed. Goodbye."}]
  expect: {handled_by: farewell, kinds: []}
  note: "(f347) a plain goodbye never reaches the interpreter: the farewell intercept answers it with one parting line"
- name: a_goodbye_that_carries_a_question_is_still_read
  text: "Goodbye, but first: where is the mill?"
  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}], partner: i1}
  plan: [{kind: talk, target: i1, speech: "Goodbye, but first: where is the mill?"}]
  expect: {handled_by: interpret, kinds: [talk]}
- name: turning_away_ends_the_conversation
  text: "I turn away from Osric and say nothing more"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}], partner: m1}
  plan: [{kind: leave_conversation}]
  expect: {handled_by: interpret, kinds: [leave_conversation]}

