# ============================================================================================================================
# THE WIDE CORPUS (f334): every kind of action in the scene it needs, in several wordings; the ways out; every intercept; negation,
# the past and questions that must stay talk; marked-up text; lines of two, three and four actions. Ids used throughout:
#   m1 Osric Vane (merchant), g1 Garran Holt (guard), i1 Hollis (innkeeper), s1 Odo (smith), p1 Brother Aldo (priest),
#   c1 Wenna (guild_clerk), t1 Master Orrin (guild_instructor), h1 Tamsin (hunter), e1 Mirel (herbalist), f1 Dunstan (farmer),
#   x1 the captured outlaw (prisoner); hire:h0 Bram Voss.
# ============================================================================================================================

# ---- move, and the ways out
- name: move_named_place
  text: "I walk to the Greywood"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}]}
  plan: [{kind: move, destination: greywood}]
  expect: {handled_by: interpret, kinds: [move], moves: [greywood]}
- name: move_to_the_guild_hall
  text: "Let's go over to the guild hall"
  scene: {place: trading_square}
  plan: [{kind: move, destination: guild_house}]
  expect: {handled_by: interpret, kinds: [move], moves: [guild_house]}
- name: move_to_another_town
  text: "I set out for Willowmead"
  scene: {place: trading_square}
  plan: [{kind: move, destination: willowmead}]
  expect: {handled_by: interpret, kinds: [move], moves: [willowmead]}
- name: move_within_the_place_is_look
  text: "I go upstairs to my room"
  scene: {place: tilted_plough, present: [{id: i1, name: Hollis, role: innkeeper}]}
  plan: [{kind: look}]
  expect: {handled_by: interpret, kinds: [look]}
- name: walking_up_to_someone_is_talk
  text: "I walk over to the merchant and nod to him"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}, {id: g1, name: Garran Holt, role: guard}]}
  plan: [{kind: talk, target: m1, speech: "Good day."}]
  expect: {handled_by: interpret, kinds: [talk], first: {target: m1}}
- name: a_road_by_name_is_the_way_out
  text: "I take the King's Road south"
  scene: {place: trading_square}
  expect: {handled_by: exit, moves: [willowmead]}
- name: a_gate_by_direction_is_the_way_out
  text: "I head out the north gate"
  scene: {place: trading_square}
  expect: {handled_by: exit}

