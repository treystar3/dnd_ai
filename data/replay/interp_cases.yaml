# How the game reads what the player types (tools/interp_eval.py). Each case: a line, the scene it is typed in, what the model is taken
# to have read (offline), and what should happen: which intercept takes it (or `interpret`, the model), what runs. The first cases are the
# ordinary sentences that once went to the wrong place. Add a case from a real turn with --promote, then fill in `expect`.
- name: road_question_is_talk
  text: "Tell me about the Red Road"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}]}
  plan: [{kind: talk, target: m1, speech: "Tell me about the Red Road"}]
  expect: {handled_by: interpret, kinds: [talk]}
- name: direction_question_is_talk
  text: "What do you know about the north?"
  scene: {place: trading_square, present: [{id: m1, name: Osric Vane, role: merchant}]}
  plan: [{kind: talk, target: m1, speech: "What do you know about the north?"}]
  expect: {handled_by: interpret, kinds: [talk]}
- name: heretics_trial_is_for_the_priest
  text: "I ask the priest about the heretic's trial"
  scene: {place: parth_temple, present: [{id: p1, name: Brother Aldo, role: priest}]}
  plan: [{kind: talk, target: p1, speech: "Tell me about the heretic's trial"}]
  expect: {handled_by: interpret, kinds: [talk]}
- name: own_trial_away_from_hall
  text: "I'd like to take the trial"
  scene: {place: trading_square}
  expect: {handled_by: trial, kinds: []}
- name: rank_question_at_hall_is_answered
  text: "What do I need for the next rank?"
  scene: {place: guild_house, rank: F, guild_done: {F: 5}, level: 10}
  expect: {handled_by: trial, kinds: []}
- name: maren_named_with_action_is_the_hunt
