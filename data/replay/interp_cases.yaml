  plan: [{kind: look}]
  expect: {handled_by: interpret, kinds: [look]}
- name: examining_a_thing_is_look
  text: "I examine the carvings on the old well"
  scene: {place: trading_square}
  plan: [{kind: look}]
  expect: {handled_by: interpret, kinds: [look]}
