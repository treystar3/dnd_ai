# ---------- what the character can do decides ----------
- {line: "I fly up to the roof of the cave.", at: tidepool_caves, expect: "yes", means: [flight], model: {sense: "yes", requires: [flight]}}
- {line: "I fly up to the roof of the cave.", at: tidepool_caves, expect: "no", means: [], model: {sense: "yes", requires: [flight]}}
