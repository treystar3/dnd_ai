- {line: "I breathe underwater and swim to the sea floor.", at: tidepool_caves, expect: "no", model: {sense: "yes", requires: [water_breathing]}}
- {line: "I lift the whole inn off the ground.", at: trading_square, expect: "no"}
- {line: "I turn into a wolf.", at: greywood, expect: "no", model: {sense: "yes", requires: [shape_change]}}
- {line: "I find a legendary sword lying in the gutter.", at: trading_square, expect: "no"}
- {line: "I make the sun go down now.", at: trading_square, expect: "no"}
- {line: "I read the merchant's mind.", at: trading_square, expect: "no", model: {sense: "yes", requires: [mind_reading]}}
- {line: "I raise the dead guard from his grave.", at: trading_square, expect: "no", model: {sense: "yes", requires: [raise_dead]}}
- {line: "I become invisible.", at: trading_square, expect: "no", model: {sense: "yes", requires: [invisibility]}}
- {line: "I jump to the top of the guild hall.", at: trading_square, expect: "no"}
- {line: "I order the whole town to bow to me.", at: trading_square, expect: "no"}
- {line: "I pull a cannon out of my pack.", at: trading_square, expect: "no"}
- {line: "I instantly heal every wound in the town.", at: trading_square, expect: "no"}
- {line: "I grow ten feet tall.", at: trading_square, expect: "no", model: {sense: "yes", requires: [shape_change]}}
