               conditions: [{kind: danger, label: smugglers holding the watch tower, by: the smugglers, by_kind: group, place: watch_tower}]},
   model: {sense: "cost", stakes: {check: strength, hard: fair}, changes: [{n: 1, target: "@condition", becomes: lifted, because: force}]},
   moves: {"@condition": false}}
- {line: "I wrestle {person:1} to the ground until they give up the fight.", at: trading_square, expect: "cost",
