# (f522) How the game runs its model server: which llama-server builds and model files it uses (each pinned by its sha256 and size),
# and the server's settings. Read by llm/runtime.py and checked at startup by its runtime_problems(). Outside the data hash
# (storage/statehash.py), as data/measured is: it says how this machine runs the model, not what the game is, so a recording replays
# across a change here (the answers are served); night comparisons read each run's run.json for what it ran on.
#
# The builds are llama.cpp's own releases of the commit the pod measured (b11963, 39febd2), hashed whole on 2026-11-06. Linux has no
# CUDA release: tools/fetch_runtime.py builds it from that commit on a pod.
# The model files are the ones every night ran on, served by their sha256 from a public, content-addressed registry (the digest in the
# URL is the file's own checksum, checked again after the fetch). tools/fetch_runtime.py fetches and checks them; runtime/ and models/
# are never in git. (f531) On Steam the model files are a depot of their own; the testers' installer fetches these same URLs.

llama_cpp:
  tag: b11963
  commit: 39febd2adb947b70da35e95f9351b3bf58ad170a
  release: https://github.com/ggml-org/llama.cpp/releases/download/b11963/

# In the order a machine tries them (f526's ladder): the CUDA build when an NVIDIA card shows, then Vulkan, then the processor.
builds:
  - id: cuda
    platform: windows
    files:
      - {name: llama-b11963-bin-win-cuda-12.4-x64.zip, sha256: 70ba73e7554acd3319c74bb8f7d2cf01c8524cc4849b4e069b0a1e0426d9b2e4, size: 279763930}
      - {name: cudart-llama-bin-win-cuda-12.4-x64.zip, sha256: 8c79a9b226de4b3cacfd1f83d24f962d0773be79f1e7b75c6af4ded7e32ae1d6, size: 391443627}
  - id: vulkan
    platform: windows
    files:
      - {name: llama-b11963-bin-win-vulkan-x64.zip, sha256: 7e0c3934878aba0a2e48a1f631d37ef08721e638504d06a8cb1b7bb547e6e715, size: 37346495}
  - id: cpu
    platform: windows
    files:
      - {name: llama-b11963-bin-win-cpu-x64.zip, sha256: de99853c24276a77377aa23fa9b387cde7e723ec5af841b4ebc957b9e1914ee1, size: 24407990}
  - id: cuda
    platform: linux
    from_source: true           # no release; tools/fetch_runtime.py --build cuda builds the commit above (CUDA arch 86 and up)
    files: []
  - id: vulkan
    platform: linux
    files:
      - {name: llama-b11963-bin-ubuntu-vulkan-x64.tar.gz, sha256: 1905cf16e22fbb6a70d56f01ee2405e7e61af77a032a3951bef38169ebb46696, size: 35471500}
  - id: cpu
    platform: linux
    files:
      - {name: llama-b11963-bin-ubuntu-x64.tar.gz, sha256: c117406e0eaaaeca0ac4a081b1e94152754fa79bcfc7f8af7016aace40defadf, size: 22691329}

models:
  chat:
    role: chat
    file: gemma4-12b-bb722270.gguf
    sha256: bb722270d54346adc198f213851dbe0207e87c3ecf2a0aff4d92262726215391
    size: 7381383680
    source: https://registry.ollama.ai/v2/library/gemma4/blobs/sha256:bb722270d54346adc198f213851dbe0207e87c3ecf2a0aff4d92262726215391
  draft:
