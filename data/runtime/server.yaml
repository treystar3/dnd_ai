server:
  slots: 2                  # the turn's slot and the background's (owner's decision, 2026-11-05)
  slot_ctx: 16384           # each slot's context; the server is started with twice it, and --fit may not shrink it
  batch: 1024
  ubatch: 1024
  threads: 0                # 0: the server's own choice (DND_NUM_THREAD, config.NUM_THREAD, sets it for a night)
  cache_ram_mib: 2048       # the prompt cache in RAM, capped (llama-server's default is 8 GiB, untested; f530 sets this on the 3060)
  draft_n_max: 3            # the draft model guesses this many tokens ahead (the pod: 75% accepted, writing 1.55 times as fast)
  start_seconds: 300        # the longest a load may take before it is 'failed' (the pod: 7.9 s cold on its own disk)
  hang_seconds: 1800        # the hang guard for one call on a machine below the minimum card (f526)
  restarts: 1               # a server that dies is started again this many times in a session; the next death is 'failed'
