embed:                      # (f524) the embedder's own server
  ctx: 2048                 # its context, batch and micro-batch: a text longer than the batch is refused, never cut quietly
  batch: 2048
  ubatch: 2048
  max_chars: 5000           # so every text is cut to this before it is sent (above the 601 characters a kept recording embeds)
  device: auto              # card, processor, or auto: on the card unless the chat model would not otherwise sit wholly on it

machine:                    # (f526) the minimum card (GOALS.md, the owner's decision of 5 Nov): the whole model on the card, and an
  minimum_cuda_mib: 12000   # NVIDIA card of 12 GB through CUDA (a 12 GB card lists about 12,287 MiB) or any card of 16 GB through
  minimum_vulkan_mib: 16000 # Vulkan; below it the game plays slowly but whole (llm/launch.py classify)
  integrated:               # (f526's review) cards built into the processor, or software ones: never chosen, never at the minimum
    ['\bUHD\b', '\bIris\b', '\bHD Graphics\b', 'Radeon\(TM\) Graphics', '\bRadeon Graphics\b', '\bVega \d+ Graphics\b', '\b\d{3}M\b',
     'llvmpipe', 'lavapipe', 'SwiftShader', 'Microsoft Basic']

server:
  slots: 2                  # two slots (owner's decision, 2026-11-05); f536: the understanding's and every other call's, below
  slot_of:                  # (f536) the slot a task's calls take, by the gateway's task name. The understanding alone on slot 0: the server
    interpret_action: 0     # keeps a checkpoint at the end of its system message (the start of the user message), reusable only while no
  other_slot: 1             # other prompt takes the slot; every other call, the background's included, on slot 1 (its checkpoints the RAM cache's)
  slot_ctx: 16384           # each slot's context; the server is started with twice it, and --fit may not shrink it
  batch: 1024
  ubatch: 1024
  threads: 0                # 0: the server's own choice (DND_NUM_THREAD, config.NUM_THREAD, sets it for a night)
  cache_ram_mib: 2048       # the prompt cache in RAM, capped (llama-server's default is 8 GiB; 0 turns it off). (f537) One entry is a
                            # slot's whole state with its checkpoints, about 0.8 GiB on the 6 Nov night; 2 GiB held two to four and
                            # evicted 270 times. Each new prompt that displaces a slot's prompt saves that state to RAM and looks for a
                            # better one: 190 times that night, 550 ms each, 104 s of the 7.7 minutes. Sized on the pod, then the 3060 (f530)
  ctx_checkpoints: 32       # (f537) context checkpoints a slot keeps (the server's default); each is the sliding-window state at the
                            # start of a user message or near a prompt's end, up to 320 MiB (half of them that, a quarter under 150 MiB),
                            # and the RAM cache saves them with the slot
  kv_type: f16              # (f537) the KV cache's type for K and V: f16 (the server's default), bf16, q8_0 (half the memory and half the
                            # copying, quality near f16), q4_0, q4_1, q5_0, q5_1, iq4_nl, f32. A quantized type turns flash attention on;
                            # the Vulkan night is measured with it. Measured on the pod before any change
  cache_idle_slots: true    # (f537) whether an idle slot's state is also saved to the RAM cache when a new task starts (the server's
                            # default); off, only the slot a new prompt displaces is saved. On the 6 Nov night 91 idle saves copied state
                            # (115 found it already cached), 380 ms each, 35 s in all, for 5 reuses
  draft_n_max: 3            # the draft model guesses this many tokens ahead (the pod: 75% accepted, writing 1.55 times as fast)
  start_seconds: 300        # the longest a load may take before it is 'failed' (the pod: 7.9 s cold on its own disk)
  hang_seconds: 1800        # the hang guard for one call on a machine below the minimum card (f526)
  restarts: 1
  log_kib: 4096             # (f522) each server log file's cap (logs/llama-server.log, llama-embed.log); the one before is kept as .1               # a server that dies is started again this many times in a session; the next death is 'failed'
  max_cancels: 3            # (f523) a background call gives the card back to the turn this many times, then runs beside it
  resume_idle_seconds: 2    # (f523) a background call starts once no turn's call has run for this long (the player reading)
  max_wait_seconds: 120     # (f523's review) ...or once it has waited this long, beside the turn: the owner's "after it has been put off
                            # twice", two turns of the 60-second budget (turns less than resume_idle apart leave no reading time)
