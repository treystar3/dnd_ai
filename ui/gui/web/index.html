<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dnd_ai</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- status strip: a self-contained block (this div + the Strip section in app.js + .strip rules in style.css); delete all three to remove it -->
<header id="strip" class="strip" aria-label="Status"></header>
<div id="ticker" class="ticker" hidden aria-live="polite"></div>   <!-- (f325) this turn's mechanics: coins, contracts, things taken, checks -->
<button id="updatebtn" hidden>⬆ Update available</button>

<div id="app">
  <main id="main">
    <div id="log" aria-live="polite"></div>
    <div id="busy" hidden><span>The world is thinking…</span></div>
    <form id="form" autocomplete="off">
      <span class="caret">&gt;</span>
      <input id="input" type="text" spellcheck="false" autofocus placeholder="What do you do?">
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <div id="grip" title="Drag to resize"></div>
  <aside id="side">
    <div id="sidehead"><div id="buttons"></div></div>
    <div id="sidetitlerow">
      <div id="sidetitle"></div>
      <div id="sidetools">
        <button id="pin" title="Pin this view: it refreshes after every turn">📌</button>
        <button id="theme" title="Colour theme: auto follows Windows">◐</button>
        <button id="hide" title="Hide this pane">▸</button>
      </div>
    </div>
    <pre id="sidebody"></pre>
  </aside>
  <button id="show" hidden title="Show the info pane">◂ Info</button>
</div>
<div id="update" hidden><div class="card"><h2 id="updtitle"></h2><div id="updnotes"></div><div id="updbar" hidden><div id="updfill"></div></div><div id="updtext"></div><div id="updbtns"></div></div></div>
<div id="homepage" hidden>   <!-- (f345) the home page: app.js showHome; the game sends it before any game is open, and on #menu -->
  <div class="home-map" aria-hidden="true"></div>
  <div class="home-inner">
    <header class="home-head"><h1 id="hometitle"></h1><div id="homesub"></div></header>
    <section id="homecontinue"></section>
    <div class="home-actions"><button id="homenew">New game</button><button id="homequit">Quit</button></div>
    <section id="homegames"><h2>Your games</h2><div id="homelist"></div></section>
    <footer id="homever"></footer>
  </div>
</div>
<div id="setup" hidden><div class="card"><h2 id="setuptitle"></h2><div id="setuplines"></div><div id="setupbar" hidden><div id="setupfill"></div></div><div id="setuptext"></div><div id="setupbtns"></div></div></div>
<script>window.TOKEN = "__TOKEN__";</script>
<script src="/app.js"></script>
</body>
</html>
