<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meravia</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- status strip: a self-contained block (this div + the Strip section in app.js + .strip rules in style.css); delete all three to remove it -->
<header id="strip" class="strip" aria-label="Status"></header>
<div id="ticker" class="ticker" hidden aria-live="polite"></div>   <!-- (f325) this turn's mechanics: coins, contracts, things taken, checks -->
<button id="updatebtn" hidden>⬆ Update available</button>

<div id="app">
  <main id="main">
    <div id="log" aria-live="polite"></div>
    <button id="more" hidden title="New text below">↓ More below</button>   <!-- (f396) shown while the reader is scrolled up and new text has come -->
    <div id="busy" hidden><span>The world is thinking…</span></div>
    <form id="form" autocomplete="off">
      <span class="caret">&gt;</span>
      <input id="input" type="text" spellcheck="false" autofocus placeholder="What do you do?">
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <div id="grip" title="Drag to resize"></div>
  <aside id="side">
    <div id="sidehead"><div id="buttons"></div></div>
    <div id="sidetitlerow">
      <div id="sidetitle"></div>
      <div id="sidetools">
        <button id="pin" title="Pin this view: it refreshes after every turn">📌</button>
        <button id="theme" title="Colour theme: dark">◐</button>
        <button id="hide" title="Hide this pane">▸</button>
      </div>
    </div>
    <pre id="sidebody"></pre>
  </aside>
  <button id="show" hidden title="Show the info pane">◂ Info</button>
</div>
<div id="update" hidden><div class="card"><h2 id="updtitle"></h2><div id="updnotes"></div><div id="updbar" hidden><div id="updfill"></div></div><div id="updtext"></div><div id="updbtns"></div></div></div>
<div id="homepage">   <!-- (f345) the home page: shown from the first paint, app.js showHome fills the menu when the game sends it, and again on #menu -->
  <div class="home-map" aria-hidden="true"></div>
  <div class="home-inner">
    <header class="home-head"><h1 id="hometitle">__TITLE__</h1><div id="homesub">__SUBTITLE__</div></header>
    <section id="homemain"><div id="homecontinue"></div><nav id="homebtns" class="home-menu"><div class="ask">Loading…</div></nav></section>
    <section id="homegames" hidden><div class="home-subhead"><button class="home-back">‹ Back</button><h2>Your games</h2></div><div id="homelist"></div></section>
    <section id="homeprefs" hidden><div class="home-subhead"><button class="home-back">‹ Back</button><h2>Settings</h2></div><div id="homeprefsbody"></div></section>
    <section id="homecredits" hidden><div class="home-subhead"><button class="home-back">‹ Back</button><h2>Credits</h2></div><pre id="homecreditsbody" class="home-credits"></pre></section>
    <footer id="homever">Version __VERSION__</footer>
  </div>
</div>
<div id="creation" hidden>   <!-- (f388) character creation as pages: app.js showCreation draws each step the game sends (scenes/goddess.py show) -->
  <div class="cr-inner">
    <nav id="crtabs" class="cr-tabs" aria-label="Steps"></nav>
    <div id="crvoice" class="cr-voice"></div>
    <section id="crcard" class="cr-card"></section>
    <form id="crform" class="cr-say" autocomplete="off"><input id="crinput" type="text" spellcheck="false" placeholder="Or say it to her in your own words…"><button id="crsend" type="submit">Say</button></form>
  </div>
</div>
<div id="setup" hidden><div class="card"><h2 id="setuptitle"></h2><div id="setuplines"></div><div id="setupbar" hidden><div id="setupfill"></div></div><div id="setuptext"></div><div id="setupbtns"></div></div></div>
<script>window.TOKEN = "__TOKEN__";</script>
<script src="/app.js"></script>
</body>
</html>
