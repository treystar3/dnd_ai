name: suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the suite needs
        run: python -m pip install pydantic pyyaml
      - name: Run the suite
        run: python tools/run_suite.py -j 4 --outdir "$RUNNER_TEMP/suite_out"    # outside the checkout: tests scan its files
      - name: Keep the test output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-output-${{ matrix.os }}
          path: ${{ runner.temp }}/suite_out
