# The test suite (tools/run_suite.py) on every pull request and every push to main, on Linux and Windows.
# The suite runs against simlib's stub and fake model servers: no GPU and no model is needed.
name: suite

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tests read the history and the tracked files (git rev-parse, git ls-files)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements (pywebview only if it builds; the suite does not need the window)
        run: |
          python -m pip install --upgrade pip
          grep -v -i '^pywebview' requirements.txt > "$RUNNER_TEMP/requirements-core.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-core.txt"
          python -m pip install "$(grep -i '^pywebview' requirements.txt | sed 's/#.*//' | xargs)" \
            || echo "::warning::pywebview did not install on ${{ matrix.os }} / ${{ matrix.python }}; the suite runs without it"
          python -c "import yaml; print('libyaml C loader:', hasattr(yaml, 'CSafeLoader'))"

      - name: Run the suite
        run: python tools/run_suite.py -j 4 --outdir "$RUNNER_TEMP/meravia_suite"

      - name: Upload each test's output when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meravia_suite-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/meravia_suite
          retention-days: 14
